<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b6d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Planner">
<title>Game Planner</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" rel="stylesheet">
<script>
  // Tema: scelta salvata su questo dispositivo, altrimenti quello del sistema
  (function () {
    var t = null; try { t = localStorage.getItem("gp-theme"); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
/* ===== Design "Tavolo & Dadi" (Claude Design) ===== */
:root, :root[data-theme="light"]{
  --bg:#f6faff; --card:#ffffff; --soft:#eff4fb; --soft2:#e9eef5; --soft3:#e3e9f0; --hover:#f0f5f2;
  --line:#e2e8f0; --line2:#cbd5e1; --line3:#bec9c1; --text:#161c21; --muted:#3f4943; --faint:#6f7a73;
  --primary:#1b6d4f; --primary-d:#00533a; --shelf:#124935; --on-primary:#ffffff; --logo-fg:#9eecc6;
  --mint:#a5f3cd; --mint-t:#002114; --mint-line:#89d6b1;
  --orange:#fea047; --orange-t:#6d3a00; --peach:#ffdcc2; --peach-t:#2e1500; --peach-soft:#fff3e8;
  --err-bg:#ffdad6; --err-t:#93000a; --red:#ba1a1a; --red-t:#ba1a1a; --rose:#e11d48; --warn-t:#6d3a00; --sky-bg:#e0f2fe; --sky-t:#075985; --sky-line:#bae6fd; --sky-dot:#0284c7; --today-t:#8f4e00;
  --brass:#8f4e00; --brass-shelf:#6d3a00;
  --indigo:#4d3c88; --indigo-shelf:#1f0559; --lav:#e7deff; --lav-line:#cdc0ff; --lav-soft:#f1ecff; --lav-t:#1f0559;
  --rec-bg:#fef3c7; --rec-line:#d9822b; --rec-t:#78350f;
  --day-yes:#e6f7ef; --day-maybe:#fff3e8; --day-no:#fff4f2;
  --ev-line:rgba(27,109,79,.3); --toast-bg:#2b3136; --toast-t:#ecf1f8; --scrim:rgba(22,28,33,.42);
  --sh1:0 1px 3px rgba(30,36,41,.05); --sh2:0 8px 16px -4px rgba(27,109,79,.08); --sh3:0 20px 25px -5px rgba(30,36,41,.15);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1417; --card:#182025; --soft:#1e282d; --soft2:#232e34; --soft3:#2a363c; --hover:#1f2a2f;
  --line:#2a353b; --line2:#3b484f; --line3:#4b5960; --text:#e5ecf0; --muted:#b2bec4; --faint:#8b989e;
  --primary:#1f7a58; --primary-d:#8fe0bb; --shelf:#0b3626; --on-primary:#ffffff; --logo-fg:#9eecc6;
  --mint:#1f5a43; --mint-t:#c8f7e1; --mint-line:#2f7a5c;
  --orange:#d98a3c; --orange-t:#231100; --peach:#4a3122; --peach-t:#ffdcc2; --peach-soft:#33261b;
  --err-bg:#4a2222; --err-t:#ffb4ab; --red:#e05555; --red-t:#ff8f87; --rose:#fb7185; --warn-t:#ffc78f; --sky-bg:#0c3b55; --sky-t:#bae6fd; --sky-line:#155e83; --sky-dot:#38bdf8; --today-t:#ffb35c;
  --brass:#b0670f; --brass-shelf:#6d3a00;
  --indigo:#6a58b0; --indigo-shelf:#2c1c66; --lav:#352b5c; --lav-line:#54468c; --lav-soft:#272140; --lav-t:#e2d9ff;
  --rec-bg:#3a2e14; --rec-line:#d9822b; --rec-t:#ffd99a;
  --day-yes:#183429; --day-maybe:#34271b; --day-no:#3a2224;
  --ev-line:rgba(63,174,132,.4); --toast-bg:#e5ecf0; --toast-t:#161c21; --scrim:rgba(0,0,0,.6);
  --sh1:none; --sh2:none; --sh3:0 20px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary-d);font-weight:700;cursor:pointer}
p{margin:0}
h1,h2,h3{margin:0}
@keyframes gpUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes gpFade{from{opacity:0}to{opacity:1}}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";flex:none;width:1em;height:1em;overflow:hidden}
.ms.fill{font-variation-settings:"FILL" 1}
.s16{font-size:16px}.s18{font-size:18px}.s22{font-size:22px}

/* struttura */
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--soft3)}
.logo{width:34px;height:34px;border-radius:8px;background:#1b6d4f;color:var(--logo-fg);display:flex;align-items:center;justify-content:center;flex:none}
.logo .ms{font-size:20px}
.hdr-title{flex:1;font-size:18px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.bell{position:relative;width:44px;height:44px;border:none;border-radius:9999px;display:flex;align-items:center;justify-content:center;background:var(--soft2);color:var(--text)}
.bell.unread{background:var(--peach);color:var(--brass)}
.bell .ms{font-size:22px}
.bell .dot{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9999px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);padding:0 3px}
.av{width:44px;height:44px;border:none;border-radius:9999px;padding:0;color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.av .ms{font-size:22px;font-variation-settings:"FILL" 1}
.av.ring{box-shadow:0 0 0 3px #a5f3cd}
.demo-bar{background:var(--peach);color:var(--peach-t);font-size:12px;font-weight:600;text-align:center;padding:6px 12px}
/* ===== HOME ===== */
.home{display:flex;flex-direction:column;gap:22px}
.h-hello small{display:block;font-size:12px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.h-hello h1{font-size:27px;line-height:33px;font-weight:800}
.h-sec{display:flex;flex-direction:column;gap:10px}
.h-sec>.h-head{display:flex;align-items:center;gap:8px}
.h-sec>.h-head h2{font-size:18px;font-weight:800}
.h-cnt{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--orange);color:#fff;font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.htodo{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh1)}
.htodo .hic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.htodo .k{font-size:12px;font-weight:700;color:var(--faint)}
.htodo .t{font-size:15px;font-weight:800;line-height:20px}
.htodo .s{font-size:13px;color:var(--muted)}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
.hb{min-height:40px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-size:14px;font-weight:700;padding:0 14px;display:inline-flex;align-items:center;gap:6px}
.hb:active{transform:scale(.95)}
.hb.yes{background:var(--mint);color:var(--mint-t);border-color:transparent}.hb.maybe{background:var(--peach);color:var(--peach-t);border-color:transparent}.hb.no{background:var(--err-bg);color:var(--err-t);border-color:transparent}
.hb.p{background:var(--primary);color:#fff;border-color:transparent}.hb.ind{background:var(--indigo);color:#fff;border-color:transparent}
.hmore{align-self:flex-start;font-size:13px}
.hdone{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.hdone .ck{width:44px;height:44px;border-radius:50%;background:var(--mint);color:var(--mint-t);display:flex;align-items:center;justify-content:center;flex:none}
.hnext{border-radius:26px;background:var(--gc);color:#fff;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hnext:before{content:"";position:absolute;right:-34px;top:-34px;width:150px;height:150px;border-radius:40px;background:rgba(255,255,255,.08);transform:rotate(18deg)}
.hnext .lab{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.hnext .gname{font-size:23px;line-height:28px;font-weight:800}
.hnext .game{font-size:15px;font-weight:600;color:rgba(255,255,255,.82)}
.hnext .when{font-size:31px;line-height:34px;font-weight:800;color:#ffd3a8;text-align:right}
.hnext .when2{font-size:13px;font-weight:700;color:rgba(255,255,255,.85);text-align:right}
.hnext .info{display:flex;flex-direction:column;gap:6px;padding:11px 13px;border-radius:16px;background:rgba(255,255,255,.12);font-size:14px}
.hnext .info span{display:flex;gap:8px;align-items:flex-start}
.hav{display:flex}
.hav i{font-style:normal;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:#fff;color:#16302a;border:3px solid #7ee2b0;margin-left:-8px}
.hav i:first-child{margin-left:0}
.hav i.maybe{border-color:#ffc078}.hav i.no{opacity:.45;border-color:#ff9b95}.hav i.wait{border:3px dashed #ffd3a8;background:rgba(255,255,255,.18);color:#fff}
.hnudge{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;border-radius:14px;border:1px dashed #ffd3a8;background:rgba(255,211,168,.14);color:#ffe7d1;font-size:14px;font-weight:700;text-decoration:none}
.hseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.hseg button{min-height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-size:14px;font-weight:700}
.hseg button.on{background:#fff;color:#16302a;border-color:#fff}
.hacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hacts>*{min-height:44px;border-radius:14px;border:0;background:#fff;color:#16302a;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.pulse{width:10px;height:10px;border-radius:50%;background:#ffb070;flex:none}
.hweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.hday{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 9px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--text);min-width:0}
.hday.today{background:var(--primary);border-color:var(--primary);color:#fff}
.hday .w{font-size:11px;font-weight:700;opacity:.75;text-transform:uppercase}
.hday .n{font-size:17px;font-weight:800;line-height:1}
.hday .bar{width:22px;height:5px;border-radius:3px;background:var(--soft3)}
.hday .bar.yes{background:#34c38f}.hday .bar.maybe{background:#f5a524}.hday .bar.no{background:#ef6461}
.hday .dots{display:flex;gap:3px;height:7px}
.hday .dots b{width:7px;height:7px;border-radius:50%;background:var(--gc)}
.hday .dots b.pr{background:transparent;border:2px solid var(--gc);box-sizing:border-box}
.hday.today .dots b{box-shadow:0 0 0 1.5px #fff}
.hfree{border-radius:22px;border:2px dashed var(--lav-line);background:var(--lav);color:var(--lav-t);padding:16px;display:flex;gap:14px;align-items:center}
.hfree .die{width:52px;height:52px;border-radius:16px;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;transform:rotate(-8deg)}
.hgroups{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.hgroups::-webkit-scrollbar{display:none}
.hg{flex:none;width:164px;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start;background:var(--gl);color:var(--gd);border:0;text-align:left}
.hg .nm{font-size:15px;font-weight:800;color:var(--text)}
.hg .gm{font-size:12px;font-weight:600;color:var(--muted)}
.hg .st{font-size:13px;font-weight:700}
.hprop{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.hprop .go{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;color:var(--text)}
.hprop .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.hprop .t1{font-size:14px;font-weight:800;line-height:19px}
.hprop .t2{font-size:12px;color:var(--muted);line-height:17px}
.hprop .me{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:800;margin-right:4px}
.hprop .me.yes{background:var(--mint);color:var(--mint-t)}.hprop .me.maybe{background:var(--peach);color:var(--peach-t)}.hprop .me.no{background:var(--err-bg);color:var(--err-t)}.hprop .me.off{background:var(--soft2);color:var(--muted)}
.hprop .nudge{flex:none;min-height:36px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);font-size:12px;font-weight:700;color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.hmem{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.gc5{--gc:#0f6e66;--gl:#dcf5f2;--gd:#0f6e66}.gc6{--gc:#3a4450;--gl:#e8ecf0;--gd:#3a4450}.gc7{--gc:#7a5800;--gl:#fbf0d3;--gd:#6b4d00}
:root[data-theme="dark"] .gc5{--gl:#123a37;--gd:#99f0e4}:root[data-theme="dark"] .gc6{--gl:#262d34;--gd:#c9d2db}:root[data-theme="dark"] .gc7{--gl:#3a2f12;--gd:#f5d27a}
.gmed{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:50%;background:#fff;color:#141a1f;border:2px solid #141a1f;box-sizing:border-box;font-weight:800;line-height:1}
.gmed svg{width:62%;height:62%;fill:#141a1f}
.gmed .ms{font-size:inherit;font-variation-settings:"FILL" 1}
.gmed .bdg{position:absolute;right:-10%;bottom:-10%;width:46%;height:46%;border-radius:50%;background:#141a1f;color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:inherit}
.gmed .bdg svg{fill:#fff;width:66%;height:66%}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;background:var(--gc);box-shadow:0 0 0 1px var(--line2)}
.swatches button.on{border-color:var(--card);box-shadow:0 0 0 3px var(--text)}
.icgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;max-height:212px;overflow-y:auto;padding:2px}
.icgrid button{aspect-ratio:1;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center}
.icgrid button .ms{font-size:24px}
.icgrid button svg{width:24px;height:24px;fill:currentColor}
.icgrid button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.gc0{--gc:#1b6d4f;--gl:#e3f6ec;--gd:#1b6d4f}.gc1{--gc:#4d3c88;--gl:#ece6ff;--gd:#4d3c88}.gc2{--gc:#9a4a00;--gl:#ffeedd;--gd:#8f4e00}.gc3{--gc:#0a5f8a;--gl:#ddf1fd;--gd:#075985}.gc4{--gc:#a3214a;--gl:#ffe3ec;--gd:#9f1239}
:root[data-theme="dark"] .gc0{--gl:#173a2c;--gd:#8fe0bb}:root[data-theme="dark"] .gc1{--gl:#2a2350;--gd:#cfc3ff}:root[data-theme="dark"] .gc2{--gl:#3d2a17;--gd:#ffc78f}:root[data-theme="dark"] .gc3{--gl:#123a52;--gd:#bae6fd}:root[data-theme="dark"] .gc4{--gl:#46192a;--gd:#fda4bf}
.h-in{animation:hIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes hIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.pulse.anim{animation:hPulse 1.6s ease-in-out infinite}
@keyframes hPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.35}}
.wig{animation:hWig .9s ease-in-out 1.2s 2}
@keyframes hWig{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}
.htodo.leaving{animation:hOut .32s ease-in forwards}
@keyframes hOut{to{opacity:0;transform:translateX(60px)}}
.hdone.pop{animation:hPop .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes hPop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.confetti{position:fixed;left:0;right:0;top:0;height:70vh;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:hFall 2.4s cubic-bezier(.3,.6,.4,1) both}
@keyframes hFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(70vh) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.home *,.confetti{animation:none!important}.confetti{display:none}}
.main{padding:20px 16px calc(100px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--soft3);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;padding:6px 8px 10px}
.nav button{position:relative;flex:1;min-height:52px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted)}
.nav .pill{height:28px;width:56px;border-radius:9999px;display:flex;align-items:center;justify-content:center}
.nav .pill .ms{font-size:22px}
.nav .lbl{font-size:11px;font-weight:600}
.nav button.on{color:var(--primary-d)}
.nav button.on .pill{background:var(--mint)}
.nav button.on .lbl{font-weight:800}
.nav .badge{position:absolute;top:0;left:calc(50% + 10px);min-width:16px;height:16px;padding:0 4px;border-radius:9999px;background:var(--brass);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* menu account */
.menu-ov{position:fixed;inset:0;z-index:60}
.menu{position:fixed;top:calc(64px + env(safe-area-inset-top));right:max(12px,calc(50% - 228px));width:280px;z-index:61;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh3);overflow:hidden;animation:gpFade .15s}
.menu-head{padding:14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--soft)}
.menu-head .av{cursor:default}
.menu-body{padding:6px;display:flex;flex-direction:column}
.mi{min-height:48px;border:none;background:transparent;border-radius:10px;padding:0 10px;display:flex;align-items:center;gap:12px;text-align:left;color:var(--text);width:100%}
.mi:hover{background:var(--soft)}
.mi .ms{color:var(--muted)}
.mi .chev{font-size:18px;color:var(--line3)}
.mi-txt{flex:1;display:flex;flex-direction:column;min-width:0}
.mi-txt b{font-size:14px;font-weight:600}
.mi-txt small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi.red{color:var(--red-t);font-size:14px;font-weight:700}
.mi.red .ms{color:var(--red-t)}
.mi.red:hover{background:var(--err-bg)}
.toggle2{display:flex;gap:2px;background:var(--soft2);padding:3px;border-radius:9999px}

  let auth;
  try { auth = A.initializeAuth(app, { persistence: [A.browserLocalPersistence, A.indexedDBLocalPersistence], popupRedirectResolver: A.browserPopupRedirectResolver }); }
  catch (e) { console.error(e); auth = A.getAuth(app); }
  auth.languageCode = LANG;

  let listener = () => {}, uid = null, email = "", authState = "loading", meDoc = null, provider = "password";
  let base = []; const per = {}; const raw = {}; let invIn = [], invOut = [];
  const emit = () => {
    const groups = {};
    for (const [gid, r] of Object.entries(raw)) if (r.doc) groups[gid] = { prefs: {}, names: {}, emails: {}, phones: {}, admins: [r.doc.createdBy], ...r.doc, avail: r.avail, over: r.over || {}, sessions: r.sessions, proposals: r.proposals };
    listener({ authState, authEmail: email, groups, invIn, invOut, me: authState === "ready" && meDoc ? { uid, email, provider, days: {}, games: [], seenAt: 0, ...meDoc, email } : null });
  };
  const onErr = e => { console.error(e); emit(); };
  const dropGroup = g => { (per[g] || []).forEach(u => u()); delete per[g]; delete raw[g]; };
  const stopAll = () => { base.forEach(u => u()); base = []; Object.keys(per).forEach(dropGroup); Object.keys(raw).forEach(g => delete raw[g]); meDoc = null; invIn = []; invOut = []; };
  const sub = (g, name, key, map) => F.onSnapshot(F.collection(db, "groups", g, name), s => { const o = {}; s.forEach(d => { o[d.id] = map(d.data()); }); if (raw[g]) { raw[g][key] = o; emit(); } }, onErr);
  function watchGroup(g) {
    if (per[g]) return;
    per[g] = [
      sub(g, "availability", "avail", d => d.days || {}),
      sub(g, "availability", "over", d => d.over || {}),
      sub(g, "sessions", "sessions", d => ({ rsvps: {}, ...d })),

  async function handleUser(user) {

    if (provider === "password" && !user.emailVerified) { uid = null; authState = "unverified"; return emit(); }

    const ref = F.doc(db, "users", uid);
    try {
      const s = await F.getDoc(ref);
      if (!s.exists()) await F.setDoc(ref, { name: user.displayName || email.split("@")[0], email, days: {}, games: [] });
      // Indice per email: serve a farsi trovare e invitare dagli altri
      const d = s.exists() ? s.data() : {};
      if (email) F.setDoc(F.doc(db, "emailIndex", email), { uid, name: d.name || user.displayName || email.split("@")[0], username: d.username || "" }).catch(e => console.error(e));
    } catch (e) { console.error(e); authState = "error"; return emit(); }
    authState = "ready";
    base.push(F.onSnapshot(ref, s => { meDoc = s.data() || {}; emit(); }, onErr));
    watchGroups();
    const invQ = field => F.query(F.collection(db, "invitations"), F.where(field, "==", uid));
    base.push(F.onSnapshot(invQ("to"), s => { invIn = s.docs.map(d => ({ id: d.id, ...d.data() })); emit(); }, onErr));

      // Una lettura dalla cache del dispositivo può non conoscere ancora un gruppo appena raggiunto
      if (!s.metadata.fromCache) for (const g of Object.keys(raw)) if (!ids.has(g)) dropGroup(g);
      emit();

  async function loadJoined(gid) {

    start(fn) { listener = fn; emit(); A.onAuthStateChanged(auth, handleUser); },
    signInGoogle: () => A.signInWithPopup(auth, new A.GoogleAuthProvider()),
    signInEmail: (e, p) => A.signInWithEmailAndPassword(auth, e, p),
    async signUpEmail(e, p) { const c = await A.createUserWithEmailAndPassword(auth, e, p); await A.sendEmailVerification(c.user); },
    resendVerification: () => A.sendEmailVerification(auth.currentUser),
    async checkVerified() { await auth.currentUser.reload(); await auth.currentUser.getIdToken(true); await handleUser(auth.currentUser); return auth.currentUser.emailVerified; },

      for (const g of myIds()) b.update(F.doc(db, "groups", g), { ["names." + uid]: n });
      if (email) b.set(F.doc(db, "emailIndex", email), { uid, name: n, username: meDoc?.username || "" });
      if (meDoc?.username) b.set(F.doc(db, "usernames", meDoc.username), { uid, name: n });

  else if (groups.length) parts.push(`<div class="hdone${justDone ? " pop" : ""}${inA(1)}"><span class="ck">${ic("check", "fill")}</span><div class="stack" style="gap:2px"><b style="font-size:16px">${L("Tutto fatto", "All done")}</b><span class="t13 muted">${L("Nessuna risposta in sospeso.", "No answers pending.")}</span></div></div>`);
  // Prossima sessione
  if (next) {
    const { g, s, sid } = next, [w1, w2] = whenBig(s), mine = rsvpOf(g, s, me);
    const mem = byName(g, g.members).map(u => ({ u, n: nameIn(g, u), v: rsvpOf(g, s, u) }));
    const yes = mem.filter(m => m.v === "yes").length, wait = mem.filter(m => !m.v && m.u !== me);
    const nudgeTxt = L(`Ciao! ${cap(longDate(s.date))} alle ${s.time || DEFAULT_TIME} si gioca a ${g.game} con ${g.name}. Ci sei? Rispondi su Game Planner: ${location.origin + location.pathname}`, `Hi! ${cap(longDate(s.date))} at ${s.time || DEFAULT_TIME} we play ${g.game} with ${g.name}. Are you in? Answer on Game Planner: ${location.origin + location.pathname}`);
    parts.push(`<section class="hnext ${gColor(g)}${inA(2)}">
      <div class="lab"><span class="pulse${anim || true ? " anim" : ""}"></span>${L("Prossima sessione", "Next session")}</div>
      <div class="row between" style="align-items:flex-end;gap:12px"><div class="row" style="gap:12px;min-width:0;align-items:center">${gMed(g, 48)}<div class="stack" style="min-width:0"><span class="gname">${esc(g.name)}</span><span class="game">${esc(g.game)}</span></div></div><div class="stack" style="flex:none;align-items:flex-end"><span class="when">${w1}</span><span class="when2">${w2}</span></div></div>
      ${s.location || s.notes ? `<div class="info">${s.location ? `<span>${ic("location_on", "s18")}${esc(s.location)}</span>` : ""}${s.notes ? `<span>${ic("sticky_note_2", "s18")}${esc(s.notes)}</span>` : ""}</div>` : ""}
      <div class="row" style="gap:12px"><div class="hav">${mem.slice(0, 7).map(m => `<i class="${m.v === "yes" ? "" : m.v === "maybe" ? "maybe" : m.v === "no" ? "no" : "wait"}" title="${esc(m.n)}">${esc(initials(m.n))}</i>`).join("")}</div><span style="font-size:13px;font-weight:600;color:rgba(255,255,255,.85)">${L(`${yes} su ${mem.length} ci sono`, `${yes} of ${mem.length} in`)}${wait.length ? L(` · ${wait.length} in attesa`, ` · ${wait.length} waiting`) : ""}</span></div>
      ${wait.length ? `<a class="hnudge" href="https://wa.me/?text=${encodeURIComponent(nudgeTxt)}" target="_blank" rel="noopener noreferrer">${ic("campaign")}<span class="grow">${wait.length === 1 ? L(`Manca ${esc(wait[0].n)}: mandale un messaggio`, `${esc(wait[0].n)} hasn't answered: send a message`) : L(`Mancano ${wait.length} risposte: manda un messaggio`, `${wait.length} answers missing: send a message`)}</span>${ic("chevron_right")}</a>` : ""}
      <div class="stack" style="gap:6px"><span style="font-size:12px;font-weight:700;color:rgba(255,255,255,.85)">${L("La tua risposta", "Your answer")}</span><div class="hseg">${["yes", "maybe", "no"].map((v, i) => `<button class="${mine === v ? "on" : ""}" data-action="rsvp" data-g="${g.id}" data-s="${sid}" data-v="${v}">${[L("Ci sono", "I'm in"), L("Forse", "Maybe"), L("Non posso", "Can't")][i]}</button>`).join("")}</div></div>
      <div class="hacts"><button data-action="ics" data-g="${g.id}" data-s="${sid}">${ic("event", "s18")}${L("Calendario", "Calendar")}</button><a href="https://wa.me/?text=${encodeURIComponent(sessionText(g, s))}" target="_blank" rel="noopener noreferrer">${ic("ios_share", "s18")}WhatsApp</a></div>
    </section>`);
  }
  // Proposte aperte: cosa si sta organizzando (quelle a cui devi rispondere sono già in Da fare)
  const confirmable = x => isAdmin(x.g) && x.g.members.filter(u => ansOf(x.p, u) === "yes").length >= need(x.g);
  const openP = allProposals().filter(x => (ansOf(x.p, me) || propImpossible(x.g, x.p)) && !confirmable(x));
  if (openP.length) parts.push(`<section class="h-sec${inA(3)}"><div class="h-head"><h2 class="grow">${L("Proposte aperte", "Open proposals")}</h2>${openP.length > 3 ? `<a class="t13" data-action="goProp">${L(`Vedi tutte (${openP.length})`, `See all (${openP.length})`)}</a>` : ""}</div>
    ${openP.slice(0, 3).map(x => { const { g, p } = x, my = ansOf(p, me), yesN = g.members.filter(u => ansOf(p, u) === "yes").length, miss = byName(g, g.members.filter(u => !ansOf(p, u) && u !== me)).map(u => nameIn(g, u));
      const imp = propImpossible(g, p), myLab = { yes: L("Hai detto Sì", "You said Yes"), maybe: L("Hai detto Forse", "You said Maybe"), no: L("Hai detto No", "You said No") }[my];
      const txt = L(`Ciao! C'è una proposta per ${g.game} con ${g.name}: ${longDate(p.date)}${p.time ? " alle " + p.time : ""}. Rispondi su Game Planner: ${location.origin + location.pathname}`, `Hi! There's a proposal for ${g.game} with ${g.name}: ${longDate(p.date)}${p.time ? " at " + p.time : ""}. Answer on Game Planner: ${location.origin + location.pathname}`);
      return `<div class="hprop ${gColor(g)}"><button class="go" data-action="goProp"><span style="display:flex;padding:3px;border-radius:50%;background:var(--gc)">${gMed(g, 30)}</span><span class="tx"><span class="t1">${esc(g.name)} · ${esc(DOWS()[parseYmd(p.date).getDay()].slice(0, 3))} ${parseYmd(p.date).getDate()}${p.time ? " · " + esc(p.time) : ""}</span>
        <span class="t2">${my ? `<span class="me ${my}">${myLab}</span>` : ""}${imp ? L("Non si può fare: troppi No", "Can't happen: too many No") : `${L(`${yesN} Sì su ${g.members.length}`, `${yesN} Yes of ${g.members.length}`)}${miss.length ? L(` · manca ${esc(miss.slice(0, 2).join(", "))}${miss.length > 2 ? ` e altri ${miss.length - 2}` : ""}`, ` · waiting for ${esc(miss.slice(0, 2).join(", "))}${miss.length > 2 ? ` and ${miss.length - 2} more` : ""}`) : ""}`}</span></span></button>
        ${miss.length && !imp ? `<a class="nudge" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener noreferrer">${L("Sollecita", "Nudge")}</a>` : ""}</div>`; }).join("")}</section>`);
  // Prossimi 7 giorni
  const days = Array.from({ length: 7 }, (_, i) => addDays(today, i));
  parts.push(`<section class="h-sec${inA(4)}"><div class="h-head"><h2 class="grow">${L("Prossimi 7 giorni", "Next 7 days")}</h2><span class="t12 muted" style="font-weight:600">${L("la barretta è la tua disponibilità", "the bar is your availability")}</span></div>
    <div class="hweek">${days.map(k => { const d = parseYmd(k), v = (S.me.days || {})[k] || "";
      const ses = allSessions().filter(x => x.s.date === k), prs = allProposals().filter(x => x.p.date === k);
      const dots = [...ses.map(x => `<b class="${gColor(x.g)}"></b>`), ...prs.map(x => `<b class="pr ${gColor(x.g)}"></b>`)].slice(0, 3).join("");
      return `<button class="hday ${k === today ? "today" : ""}" data-action="openF4" data-date="${k}" aria-label="${esc(longDate(k))}"><span class="w">${DOWS()[d.getDay()].slice(0, 3)}</span><span class="n">${d.getDate()}</span><span class="bar ${v}"></span><span class="dots">${dots}</span></button>`; }).join("")}</div></section>`);
  // Serata libera
  let free = null;
  for (let i = 0; i < 30 && !free; i++) { const k = addDays(today, i), n = night(k, "all");
    const e = n.possible.find(e => e.status === "ok" && !allProposals().some(x => x.g.id === e.g.id && x.p.date === k)); if (e) free = { k, e }; }
  if (free) { const { k, e } = free, all = e.yes === e.M;
    parts.push(`<section class="hfree${inA(5)}"><span class="die">${ic("casino", "fill s22")}</span><div class="stack" style="gap:8px;min-width:0"><span style="font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase">${all ? L("Serata libera per tutti", "A free night for everyone") : L("Si può giocare", "You can play")}</span>
      <span style="font-size:15px;font-weight:700;line-height:20px">${all ? L(`${cap(longDate(k))} siete tutti liberi per ${esc(e.g.name)}.`, `${cap(longDate(k))} everyone in ${esc(e.g.name)} is free.`) : L(`${cap(longDate(k))} siete in ${e.yes} liberi per ${esc(e.g.name)}, il minimo è ${e.need}.`, `${cap(longDate(k))} ${e.yes} are free in ${esc(e.g.name)}, the minimum is ${e.need}.`)} ${L("Nessuno ha ancora proposto.", "Nobody has proposed yet.")}</span>
      <button class="hb ind${anim ? " wig" : ""}" style="align-self:flex-start" data-action="openProp" data-g="${e.g.id}" data-date="${k}">${ic("add", "s18")}${L(`Proponi ${DOWS()[parseYmd(k).getDay()].toLowerCase()}`, `Propose ${DOWS()[parseYmd(k).getDay()]}`)}</button></div></section>`); }
  // Gruppi
  if (groups.length) parts.push(`<section class="h-sec${inA(6)}"><div class="h-head"><h2>${L("I tuoi gruppi", "Your groups")}</h2></div><div class="hgroups">${groups.map(g => {
    const up = allSessions().find(x => x.g.id === g.id && !ended(x.s)), pr = allProposals().find(x => x.g.id === g.id);
    const last = allSessions().filter(x => x.g.id === g.id && ended(x.s)).pop(), idle = last ? Math.floor((parseYmd(today) - parseYmd(last.s.date)) / 864e5) : null;
    const [icn, st] = up ? ["local_fire_department", up.s.date === today ? L("Si gioca oggi", "Playing today") : L(`Si gioca ${DOWS()[parseYmd(up.s.date).getDay()].slice(0, 3)} ${parseYmd(up.s.date).getDate()}`, `Playing ${DOWS()[parseYmd(up.s.date).getDay()].slice(0, 3)} ${parseYmd(up.s.date).getDate()}`)]
      : incomplete(g) ? ["group_add", L(`Mancano ${need(g) - g.members.length} giocatori`, `${need(g) - g.members.length} players missing`)]
      : pr ? ["campaign", L(`Proposta aperta: ${dayMonth(pr.p.date)}`, `Open proposal: ${dayMonth(pr.p.date)}`)]
      : idle !== null && idle >= 21 ? ["bedtime", L(`Fermo da ${Math.floor(idle / 7)} settimane`, `Idle for ${Math.floor(idle / 7)} weeks`)]
      : ["event_busy", L("Niente in programma", "Nothing planned")];
    return `<button class="hg ${gColor(g)}" data-action="homeGroup" data-g="${g.id}"><span class="row between" style="width:100%">${gMed(g, 40)}${ic(icn, "fill s22")}</span><span class="stack" style="gap:1px"><span class="nm">${esc(g.name)}</span><span class="gm">${esc(g.game)}</span></span><span class="st">${st}</span></button>`; }).join("")}</div></section>`);
  // Ricordo
  const played = playedAll(), yearAgo = addDays(today, -365);
  const memo = played.find(x => x.s.date >= addDays(yearAgo, -3) && x.s.date <= addDays(yearAgo, 3)), lastP = played[played.length - 1];
  const memTxt = memo ? L(`<b>Un anno fa</b> giocavate a ${esc(memo.g.game)} con ${esc(memo.g.name)}.`, `<b>A year ago</b> you played ${esc(memo.g.game)} with ${esc(memo.g.name)}.`)
    : lastP ? (() => { const dd = Math.floor((parseYmd(today) - parseYmd(lastP.s.date)) / 864e5), n = lastP.g.members.filter(u => rsvpOf(lastP.g, lastP.s, u) !== "no").length;
      return L(`<b>L'ultima volta</b>, ${dd === 0 ? "oggi" : dd === 1 ? "ieri" : `${dd} giorni fa`}, ${esc(lastP.g.game)} con ${esc(lastP.g.name)}: eravate in ${n}.`, `<b>Last time</b>, ${dd === 0 ? "today" : dd === 1 ? "yesterday" : `${dd} days ago`}, ${esc(lastP.g.game)} with ${esc(lastP.g.name)}: ${n} of you.`); })() : "";
  if (memTxt) parts.push(`<div class="hmem${inA(7)}">${ic("history", "s22")}<span class="t14" style="font-size:14px;line-height:20px;color:var(--muted)">${memTxt}</span></div>`);
  if (anim) setTimeout(() => { homeAnimated = true; }, 50);
  const conf = Date.now() < confettiUntil ? `<div class="confetti" aria-hidden="true">${Array.from({ length: 18 }, (_, i) => `<i style="left:${(i * 5.5 + 3) % 97}%;animation-delay:${((i * 7) % 6) / 10}s;background:${["#34c38f", "#f5a524", "#7c6cf2", "#38bdf8"][i % 4]}"></i>`).join("")}</div>` : "";
  return `<div class="home">${parts.join("")}</div>${conf}`;
}

function renderApp() {
  const today = todayStr(), me = S.me.uid;
  const pendingEv = allSessions().filter(x => !ended(x.s) && !rsvpOf(x.g, x.s, me)).length;
  const riskN = allSessions().filter(x => isAdmin(x.g) && atRisk(x.g, x.s)).length;
  const pendingProp = allProposals().filter(x => !ansOf(x.p, me)).length;
  const unread = notifications().filter(n => n.unread).length + (S.invIn || []).length + allSessions().filter(x => isAdmin(x.g) && atRisk(x.g, x.s)).length;
  let body;
  if (S.tab === "home") body = renderHome();
  else if (S.tab === "gruppi") body = S.groupId ? renderGroup(getGroup(S.groupId)) : renderGroups();

    </div></nav>

  const marked = u => Object.keys(u === me ? (S.me.days || {}) : (g.avail?.[u] || {})).filter(d => d >= today).length;
  return `<button class="btn link sm" style="padding:0 0 12px;min-height:0" data-action="closeGroup">${ic("chevron_left")}I miei gruppi</button>

function presenceLine(g, s) {
  const mem = byName(g, g.members).map(u => ({ u, v: rsvpOf(g, s, u) }));
  const X = mem.filter(x => x.v === "yes").length, F = mem.filter(x => x.v === "maybe").length, Z = mem.filter(x => x.v === "no").length;
  const wait = mem.filter(x => !x.v);
  const pres = !wait.length && !Z && !F ? L(`Ci sono tutti: ${X} su ${mem.length}.`, `Everyone's in: ${X} of ${mem.length}.`) : [X ? L(`${X} ci sono`, `${X} in`) : "", F ? L(`${F} forse`, `${F} maybe`) : "", wait.length ? L(`${wait.length} da confermare`, `${wait.length} to confirm`) + ` (${wait.map(x => nameIn(g, x.u)).join(", ")})` : "", Z ? L(Z === 1 ? "1 non viene" : `${Z} non vengono`, `${Z} not coming`) : ""].filter(Boolean).join(", ") + ".";
  return L(`Confermata da ${nameIn(g, s.confirmedBy || s.createdBy)}. ${pres}`, `Confirmed by ${nameIn(g, s.confirmedBy || s.createdBy)}. ${pres}`);
}

// ----- DISPONIBILITÀ -----
const monthSel = (id, value, cls) => `<select id="${id}" class="sel ${cls}" data-change="${id}">${monthOptions().map(m => `<option value="${m}" ${m === value ? "selected" : ""}>${monthLabel(m)}</option>`).join("")}</select>`;

  const opts = monthOptions();
  if (!opts.includes(S.dMonth)) S.dMonth = opts[0];
  const [y, m] = S.dMonth.split("-").map(Number);
  const mine = S.me.days || {}, today = todayStr(), hasGroups = groupList().length > 0;
  const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7, dim = new Date(y, m, 0).getDate();

      <p class="t13 muted">Scegli SI, FORSE o NO e tocca i giorni. Toccando di nuovo un giorno con lo stesso stato lo cancelli.</p>

    <button class="btn redtxt m44 full" data-action="clearMonth">Svuota mese</button>
    ${hasGroups ? `<button class="btn link sm" style="align-self:center;margin:6px auto 0;display:flex" data-action="openProp">${ic("campaign", "s18")}Proponi una sessione</button>` : ""}`;

// ----- SERATE -----
const ROW_ST = { ok: ["Ci sono tutti quelli che servono", "c-mint"], maybe: ["Possibile se i forse confermano", "c-peach"], none: ["Non si può", "c-grey"] };
function memberChip(x) {

  return `<span class="chip c-grey">${esc(x.name)} (?)</span>`;
}
function renderRow(e, k, isRec, mine) {

      ${admin ? `<button class="btn p m44" style="font-size:14px" data-action="openF5" data-g="${e.g.id}" data-date="${k}">Conferma questa sessione</button>` : ""}` : ""}
  </div>`;
}
function renderProposal(x, inline) {
  const g = x.g, p = x.p, me = S.me.uid, myV = ansOf(p, me);
  const mem = byName(g, g.members).map(u => ({ u, name: nameIn(g, u), v: ansOf(p, u) }));
  const chip = m => m.v === "yes" ? `<span class="chip c-green">${esc(m.name)}</span>` : m.v === "maybe" ? `<span class="chip c-peach">${esc(m.name)} (${L("forse", "maybe")})</span>` : m.v === "no" ? `<span class="chip c-err">${esc(m.name)} · no</span>` : `<span class="chip c-grey">${esc(m.name)} · ${L("in attesa", "waiting")}</span>`;

  return `<div class="${inline ? "row-g prop-in" : "card prop stack g10"}${impossible ? " dim-card" : ""}">
    <div class="row wrapf" style="gap:6px"><span class="tag c-lav">Proposta</span><span class="t13 muted" style="font-weight:700">${esc(g.name)}</span>${impossible ? `<span class="tag c-grey">${L("Non si può fare: troppi No", "Not possible: too many No")}</span>` : ""}</div>
    ${inline ? `<span class="t13 muted" style="margin-top:-4px">${esc(g.game)}${p.time ? L(" · ore ", " · at ") + esc(p.time) : ""}${p.place ? " · " + esc(p.place) : ""}</span>`
      : `<div class="stack" style="gap:2px"><span style="font-size:17px;font-weight:700">${longDate(p.date)}${p.time ? L(" alle ", " at ") + esc(p.time) : ""}</span><span class="t13 muted">${esc(g.game)}${p.place ? " · " + esc(p.place) : ""}</span></div>`}
    ${p.desc ? `<p class="t13" style="background:var(--bg);border-radius:8px;padding:8px 10px">${esc(p.desc)}</p>` : ""}

    <div class="chips">${mem.map(chip).join("")}</div>
    <div class="stack g6"><span class="t12" style="font-weight:700">La tua risposta</span>${answersSeg(myV, "propAnswer", `data-g="${g.id}" data-pid="${x.pid}"`, ["Sì", "Forse", "No"])}</div>
    ${admin ? `<div class="stack g4"><button class="btn p m44" style="font-size:14px" data-action="openF5" data-g="${g.id}" data-date="${p.date}" data-pid="${x.pid}">Conferma la sessione</button>${ok ? "" : `<span class="t12 muted" style="text-align:center">${L("Hanno detto Sì", "Said Yes")}: ${yesN} ${L("su", "of")} ${mem.length}. ${L("Manca", "Missing")}: ${esc(mem.filter(m => m.v !== "yes").map(m => m.name).join(", "))}.</span>`}</div>` : ""}
    ${p.by === me || admin ? `<button class="btn redtxt sm" style="min-height:40px" data-action="withdrawProp" data-g="${g.id}" data-pid="${x.pid}">Ritira la proposta</button>` : ""}

function renderSerate() {
  const groups = groupList();
  const head = `<h1 class="h1">Sessioni</h1>`;
  if (!groups.length) return head + `<div class="card dashed" style="margin-top:14px">Qui vedrai in quali sessioni si può giocare e con quale gruppo. Prima crea o entra in un gruppo. <a data-action="tab" data-tab="gruppi">Vai su Gruppi</a></div>`;
  if (!["poss", "prop", "prog"].includes(S.sFilter)) S.sFilter = "poss";
  const opts = monthOptions();
  if (!opts.includes(S.sMonth)) S.sMonth = opts[0];
  if (S.sGroup !== "all" && !S.groups[S.sGroup]) S.sGroup = "all";
  const sF = S.sFilter, me = S.me.uid, today = todayStr(), inG = g => S.sGroup === "all" || g.id === S.sGroup;
  const props = allProposals().filter(x => inG(x.g));
  const propPending = props.filter(x => !ansOf(x.p, me) && !propImpossible(x.g, x.p)).length;
  const upcoming = allSessions().filter(x => !ended(x.s) && inG(x.g));
  const progPending = upcoming.filter(x => !rsvpOf(x.g, x.s, me) || (isAdmin(x.g) && atRisk(x.g, x.s))).length;
  const tabB = (v, label, badge) => `<button class="${sF === v ? "on" : ""}" data-action="sFilter" data-v="${v}">${label}${badge ? `<span class="cnt">${badge}</span>` : ""}</button>`;
  const groupSel = `<select id="sGroupSel" class="sel" data-change="sGroupSel"><option value="all">Tutti i miei gruppi</option>${groups.map(g => `<option value="${g.id}" ${S.sGroup === g.id ? "selected" : ""}>${esc(g.name)}</option>`).join("")}</select>`;
  const ctrl = `<div class="row" style="gap:8px"><div class="grow" style="min-width:0">${groupSel}</div><div class="seg c2 h40" style="width:92px;flex:none">${[["list", "view_agenda", L("Lista", "List")], ["cal", "calendar_month", L("Calendario", "Calendar")]].map(([v, icn, lab]) => `<button class="${sView() === v ? "on" : ""}" data-action="setSView" data-v="${v}" aria-label="${lab}" title="${lab}">${ic(icn, "s18")}</button>`).join("")}</div></div>`;
  const monthRow = `<div class="row" style="gap:8px"><div class="grow" style="min-width:0">${monthSel("sMonthSel", S.sMonth, "")}</div><button class="btn sm" style="min-height:40px;flex:none" data-action="goToday">${L("Oggi", "Today")}</button></div>`;
  // Calendario del mese per Proposte e In programma: il numero indica quante cose ci sono quel giorno
  const simpleCal = mode => {
    const [y, m] = S.sMonth.split("-").map(Number), lead = (new Date(y, m - 1, 1).getDay() + 6) % 7, dim = new Date(y, m, 0).getDate();
    let cells = ""; for (let i = 0; i < lead; i++) cells += `<span class="day pad"></span>`;
    for (let d = 1; d <= dim; d++) {
      const k = `${y}-${pad(m)}-${pad(d)}`;
      const items = mode === "prop" ? props.filter(x => x.p.date === k) : upcoming.filter(x => x.s.date === k);
      if (k < today || !items.length) { cells += `<button class="day ${k === today ? "today" : ""}" ${k < today ? "disabled" : `data-action="openF4" data-date="${k}"`}><span class="n">${d}</span></button>`; continue; }
      const todo = mode === "prop" ? items.some(x => !ansOf(x.p, me) && !propImpossible(x.g, x.p)) : items.some(x => !rsvpOf(x.g, x.s, me));
      cells += `<button class="day ${todo ? "s-maybe" : "s-ok"} ${k === today ? "today" : ""}" data-action="openF4" data-date="${k}" aria-label="${longDate(k)}"><span class="n">${d}</span><span class="dpill ${todo ? "maybe" : "yes"}">${items.length}</span></button>`;
    }
    return `<div class="cal"><div class="cal-h">${L(["Lun", "Mar", "Mer", "Gio", "Ven", "Sab", "Dom"], ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]).map(w => `<span>${w}</span>`).join("")}</div><div class="cal-g">${cells}</div></div>
      <p class="t12 muted">${mode === "prop" ? L("Il numero è quante proposte ci sono quel giorno. Giallo: ce n'è una a cui devi rispondere. Tocca un giorno per aprirlo.", "The number is how many proposals that day. Yellow: one needs your answer. Tap a day to open it.") : L("Il numero è quante sessioni ci sono quel giorno. Giallo: devi ancora rispondere. Tocca un giorno per aprirlo.", "The number is how many sessions that day. Yellow: you still need to answer. Tap a day to open it.")}</p>`;
  };
  let top, list;
  if (sF === "poss") {

    const nights = keys.map(k => night(k, S.sGroup)).map(n => ({ ...n, props: props.filter(x => x.p.date === n.k) }))

      return `<div class="card night tap stack g10 ${n.confirmed.length ? "has-conf" : ""}" data-action="openF4" data-date="${n.k}">

        ${n.confirmed.map(x => `<button class="conf-item sky" data-action="openEv" data-g="${x.g.id}" data-s="${x.sid}">${ic("event_available")}<span class="grow">${L("In programma", "Scheduled")}: ${esc(x.g.game)} ${L("con", "with")} ${esc(x.g.name)}${L(" alle ", " at ")}${esc(x.s.time || DEFAULT_TIME)}</span>${ic("chevron_right")}</button>`).join("")}
        ${n.props.map(x => `<button class="conf-item prop-link" data-action="sFilter" data-v="prop">${ic("campaign")}<span class="grow">${L("Proposta aperta", "Open proposal")}: ${esc(x.g.game)} ${L("con", "with")} ${esc(x.g.name)}</span>${ic("chevron_right")}</button>`).join("")}
        ${rows.map(e => renderRow(e, n.k, false)).join("")}
      </div>`;
    });
    top = `${monthRow}
      ${sView() === "list" ? `<button class="toggle" data-action="toggleOnly">Solo le sessioni possibili<span class="sw ${onlyPoss() ? "on" : ""}"><i></i></span></button>` : ""}`;
    if (sView() === "cal") {
      // Calendario del mese: ogni giorno mostra quanti giochi si possono fare; toccandolo si apre il dettaglio
      const [y, m] = S.sMonth.split("-").map(Number), lead = (new Date(y, m - 1, 1).getDay() + 6) % 7, dim = new Date(y, m, 0).getDate();
      let cells = ""; for (let i = 0; i < lead; i++) cells += `<span class="day pad"></span>`;

const playedAll = () => { const me = S.me.uid; return allSessions().filter(x => ended(x.s) && rsvpOf(x.g, x.s, me) !== "no"); };
const weekKey = ds => { const d = parseYmd(ds); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
function longestRun(list) {
  const ws = [...new Set(list.map(x => weekKey(x.s.date)))].sort(); let best = 0, run = 0, prev = null;
  for (const w of ws) { run = prev && Math.round((parseYmd(w) - parseYmd(prev)) / 6048e5) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = w; }

}
const tally = (list, f) => { const c = {}; list.forEach(x => { const k = f(x); if (k) c[k] = (c[k] || 0) + 1; }); return Object.entries(c).sort((a, b) => b[1] - a[1] || byNameStr(a[0], b[0])); };
function yearStats(year, gid) {
  const me = S.me.uid, list = playedAll().filter(x => x.s.date.startsWith(year) && (gid === "all" || x.g.id === gid));
  const games = tally(list, x => x.g.game), months = tally(list, x => x.s.date.slice(5, 7));
  const co = {}; list.forEach(x => x.g.members.filter(u => u !== me && rsvpOf(x.g, x.s, u) !== "no").forEach(u => { const k = nameIn(x.g, u); co[k] = (co[k] || 0) + 1; }));
  return { list, total: list.length, games, topGame: games[0], topMonth: months[0], run: longestRun(list), topCo: Object.entries(co).sort((a, b) => b[1] - a[1] || byNameStr(a[0], b[0]))[0], nGames: games.length };
}
function yearText(year, gid) {
  const st = yearStats(year, gid), g = gid !== "all" ? getGroup(gid) : null;
  const bits = [L(`${st.total} sessioni`, `${st.total} sessions`), st.topGame ? L(`gioco preferito: ${st.topGame[0]} (${st.topGame[1]})`, `favourite game: ${st.topGame[0]} (${st.topGame[1]})`) : "", st.run >= 2 ? L(`record: ${st.run} settimane di fila`, `record: ${st.run} weeks in a row`) : ""].filter(Boolean).join(", ");
  return `${g ? L(`Il mio ${year} con ${g.name}`, `My ${year} with ${g.name}`) : L(`Il mio ${year} a giocare`, `My ${year} of gaming`)} su Game Planner: ${bits}. ${location.origin + location.pathname}`;
}
function badgesOf() {
  const all = playedAll(), n = all.length, out = [], next = [];
  const steps = (val, list, mk) => { const hit = list.filter(t => val >= t); hit.forEach(t => out.push(mk(t))); const nx = list.find(t => val < t); return nx; };
  const nx1 = steps(n, [1, 10, 25, 50, 100], t => t === 1 ? { i: "flag", t: L("Prima sessione", "First session"), s: L("Si comincia", "Off we go") } : { i: "emoji_events", t: L(`${t} sessioni`, `${t} sessions`), s: L("giocate in totale", "played in total") });
  if (nx1) next.push(L(`${nx1 - n} ${nx1 - n === 1 ? "sessione" : "sessioni"} al traguardo delle ${nx1}`, `${nx1 - n} ${nx1 - n === 1 ? "session" : "sessions"} to the ${nx1} mark`));
  const run = longestRun(all); steps(run, [4, 8, 12], t => ({ i: "local_fire_department", t: L(`${t} settimane di fila`, `${t} weeks in a row`), s: L("senza saltare", "without a break") }));
  const games = tally(all, x => x.g.game); steps(games.length, [3, 5, 10], t => ({ i: "explore", t: L(`${t} giochi provati`, `${t} games tried`), s: L("che varietà", "what variety") }));
  games.filter(([, c]) => c >= 10).slice(0, 2).forEach(([gm, c]) => out.push({ i: "military_tech", t: L(`Veterano di ${gm}`, `${gm} veteran`), s: L(`${c} giocate`, `${c} plays`) }));
  // sempre presente in un mese (almeno 3 sessioni in programma, nessun "no")
  const me = S.me.uid, byM = {}; allSessions().filter(x => ended(x.s)).forEach(x => { const m = x.s.date.slice(0, 7); (byM[m] = byM[m] || []).push(x); });
  Object.entries(byM).filter(([, l]) => l.length >= 3 && l.every(x => rsvpOf(x.g, x.s, me) !== "no")).sort().reverse().slice(0, 3).forEach(([m]) => out.push({ i: "event_available", t: L(`Sempre presente a ${MONTHS()[+m.slice(5) - 1]}`, `Never missed ${MONTHS()[+m.slice(5) - 1]}`), s: m.slice(0, 4) }));
  return { out, next };
}

      <button class="btn" data-action="copyText" data-text="${esc(msg)}">Copia il messaggio</button>
      <button class="btn link m44" data-action="closeModal">Fatto</button>`;

    const p = S.pendingJoin || {};
    inner = `<h3>Invito</h3>
      <p style="font-size:15px;line-height:21px">Sei stato invitato nel gruppo <strong>${esc(p.name || L("senza nome", "unnamed"))}</strong>.</p>

      ${twoBtns(`<button class="btn" data-action="ignoreJoin">Non ora</button>`, `<button class="btn p" data-action="doJoin">Unisciti</button>`)}`;

  return `<div class="scrim" data-action="closeModal"></div><div class="sheet"><div class="grab"></div><div class="stack g12">${inner}</div></div>`;
}

function renderTut(M) {
  const steps = tutSteps(), i = Math.max(0, Math.min(M.i || 0, steps.length - 1)), st = steps[i], last = i === steps.length - 1;
  const na = M.moved ? " noanim" : "";
  return `<div class="scrim${na}" data-action="tutClose"></div><div class="dialog tut stack g14${na}">
    <div class="row between"><span class="t12 muted" style="font-weight:700">${i + 1} / ${steps.length}</span><button class="btn link sm" style="min-height:32px;padding:0 4px" data-action="tutClose">${last ? L("Chiudi", "Close") : L("Salta", "Skip")}</button></div>
    <div class="tut-ill" aria-hidden="true">${st.img}</div>
    <div class="stack g6"><h3 style="font-size:19px;line-height:24px">${st.t}</h3><p class="t13" style="font-size:14px;line-height:20px;color:var(--muted)">${st.d}</p></div>
    <div class="tut-dots">${steps.map((_, k) => `<button class="${k === i ? "on" : ""}" data-action="tutGo" data-i="${k}" aria-label="${k + 1}"></button>`).join("")}</div>
    <div class="grid2">${i ? `<button class="btn" data-action="tutGo" data-i="${i - 1}">${L("Indietro", "Back")}</button>` : `<span></span>`}<button class="btn p" data-action="${last ? "tutClose" : "tutGo"}" data-i="${i + 1}">${last ? L("Inizia", "Start") : L("Avanti", "Next")}</button></div>
  </div>`;
}

let toastTimer;
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.textContent = tr(msg);
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
}
