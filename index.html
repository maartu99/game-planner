async function run(fn) {
  try { await fn(); } catch (e) { console.error(e); toast(e?.code === "permission-denied" ? "Permesso negato: controlla le regole Firestore." : (e?.message || String(e))); }
}
const val = id => (document.getElementById(id)?.value || "").trim();
function clearPending() { try { sessionStorage.removeItem("gp-join"); } catch (e) {} }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast("Copiato."); } catch (e) { prompt("Copia:", text); } }
function ask(text, ok, fn) { S.ask = { text, ok, fn }; render(); }
function go(tab) { S.tab = tab; S.groupId = null; S.modal = null; S.menuOpen = false; render(); window.scrollTo(0, 0); }
const okPhone = s => s.replace(/[^\d]/g, "").length >= 8;

document.addEventListener("change", e => {
  const id = e.target.dataset?.change;
  if (!id) return;
  const v = e.target.value;
  if (id === "dMonthSel") S.dMonth = v;
  else if (id === "sMonthSel") S.sMonth = v;
  else if (id === "sGroupSel") S.sGroup = v;
  else if (["fGame", "fGroup", "fYear", "fMonth"].includes(id)) S[id] = v;
  else if (id === "yrYear") S.yrYear = v;
  else if (id === "yrGroup") S.yrGroup = v;
  else if (id === "gGameSel") { S.gameSel = v; }
  else if (id === "gMin") { S.modal.min = v; }
  render();
});
document.addEventListener("input", e => {
  const gm = e.target.dataset?.gameInput;
  if (gm !== undefined) S.gameDrafts[gm] = e.target.value;
});

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action, d = el.dataset;
  if (el.tagName === "SELECT") return;
  if (d.leave && !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) {
    const card = el.closest(".htodo");
    if (card && !card.classList.contains("leaving")) { card.classList.add("leaving"); setTimeout(() => el.click(), 300); return; }
  }
  const g = S.groupId ? getGroup(S.groupId) : null;
  const me = S.me?.uid;

  switch (a) {
    // navigazione
    case "tab": go(d.tab); break;
    case "goProg": S.sFilter = "prog"; go("serate"); break;
    case "openGroup": S.groupId = d.g; render(); window.scrollTo(0, 0); break;
    case "closeGroup": go("gruppi"); break;
    case "closeModal": S.modal = null; render(); break;
    case "toggleMenu": S.menuOpen = !S.menuOpen; render(); break;
    case "askNo": S.ask = null; render(); break;
    case "askYes": { const fn = S.ask?.fn; S.ask = null; render(); if (fn) fn(); break; }

    // account
    case "openName": S.menuOpen = false; S.modal = { type: "f1" }; render(); break;
    case "saveName": { const n = val("nameInput"); if (!n) break; S.modal = null; run(() => store.setName(n)); render(); break; }
    case "accEmail": case "accPwd": case "accPhone": case "accUsername": S.menuOpen = false; S.modal = { type: "acc", kind: { accEmail: "email", accPwd: "pwd", accPhone: "phone", accUsername: "username" }[a] }; render(); break;
    case "saveAcc": {
      const k = S.modal.kind;
      if (k === "email") {
        const em = val("accEmail"), pw = document.getElementById("accPwd").value;
        if (!/^\S+@\S+\.\S+$/.test(em)) { showErr("accErr", "Email non valida."); break; }
        if (!pw) { showErr("accErr", "Inserisci la password."); break; }
        store.changeEmail(em, pw).then(() => { S.modal = null; render(); toast("Ti abbiamo mandato un'email per confermare il nuovo indirizzo."); }).catch(err => showErr("accErr", authMsg(err)));
      } else if (k === "pwd") {
        const cur = document.getElementById("accCur").value, nw = document.getElementById("accNew").value, rep = document.getElementById("accRep").value;
        if (!cur) { showErr("accErr", "Inserisci la password attuale."); break; }
        if (nw.length < 6) { showErr("accErr", "La password deve avere almeno 6 caratteri."); break; }
        if (nw !== rep) { showErr("accErr", "Le due password non coincidono."); break; }
        store.changePassword(cur, nw).then(() => { S.modal = null; render(); toast("Password aggiornata."); }).catch(err => showErr("accErr", authMsg(err)));
      } else if (k === "username") {
        const n = val("accUserIn").toLowerCase().replace(/^@/, "");
        if (!/^[a-z0-9._]{3,20}$/.test(n)) { showErr("accErr", "Da 3 a 20 caratteri: lettere minuscole, numeri, punto e trattino basso."); break; }
        if (n === S.me.username) { S.modal = null; render(); break; }
        store.setUsername(n).then(() => { S.modal = null; render(); toast("Username salvato."); }).catch(err => showErr("accErr", err.message));
      } else {
        const p = val("accPhoneIn");
        if (p && !okPhone(p)) { showErr("accErr", "Scrivi un numero di cellulare valido."); break; }
        S.modal = null; render();
        run(async () => { await store.setProfile({ phone: p }); toast(p ? "Numero salvato." : "Numero rimosso."); });
      }
      break;
    }
    case "saveSetupUser": {
      const n = val("setupUser").toLowerCase().replace(/^@/, "");
      if (!/^[a-z0-9._]{3,20}$/.test(n)) { showErr("setupErr", "Da 3 a 20 caratteri: lettere minuscole, numeri, punto e trattino basso."); break; }
      el.disabled = true;
      store.setUsername(n).then(() => toast("Username salvato.")).catch(err => { el.disabled = false; if (err?.code === "permission-denied") { S.skipUser = true; render(); toast("Per ora non si può salvare lo username: riprova più tardi dal menu del profilo."); } else showErr("setupErr", err.message); });
      break;
    }
    case "openAvatar": S.menuOpen = false; S.modal = { type: "avatar" }; render(); break;
    case "setAvIcon": run(() => store.setProfile({ avIcon: d.v || null })); break;
    case "setAvColor": run(() => store.setProfile({ avColor: d.v })); break;
    case "lang": LANG = d.v; try { localStorage.setItem("gp-lang", d.v); } catch (err) {} render(); break;
    case "theme": document.documentElement.setAttribute("data-theme", d.v); try { localStorage.setItem("gp-theme", d.v); } catch (err) {} render(); break;
    case "logout": S.modal = null; S.menuOpen = false; S.tab = "gruppi"; S.groupId = null; notifiedKeys = null; run(() => store.logout()); break;

    // gruppi
    case "openF2": S.gameSel = ""; S.modal = { type: "f2", color: GCOLORS[Math.floor(Math.random() * GCOLORS.length)], icon: "", letter: true }; render(); break;
    case "openF2Edit": S.gameSel = g.game || ""; S.modal = { type: "f2", gid: S.groupId, color: gColor(g), icon: g.icon || "", letter: g.letter !== false || !g.icon }; render(); break;
    case "pickColor": S.modal.nameDraft = val("gName") || S.modal.nameDraft; S.modal.chatDraft = val("gChat"); S.modal.color = d.v; render(); break;
    case "pickIcon": S.modal.nameDraft = val("gName") || S.modal.nameDraft; S.modal.chatDraft = val("gChat"); S.modal.icon = S.modal.icon === d.v ? "" : d.v; render(); break;
    case "toggleLetter": S.modal.nameDraft = val("gName") || S.modal.nameDraft; S.modal.chatDraft = val("gChat"); S.modal.letter = !S.modal.letter; render(); break;
    case "saveGroup": {
      const name = val("gName"), game = S.gameSel === "__new" ? val("gGame") : S.gameSel;
      if (!name || !game) { showErr("gErr", "Scrivi il nome del gruppo e il gioco."); break; }
      const min = +(document.getElementById("gMin")?.value || 4);
      const chatRaw = val("gChat"), chat = chatRaw ? safeChat(chatRaw) : "";
      if (chatRaw && !chat) { showErr("gErr", L("Il link alla chat non è valido: usa un link https di WhatsApp, Discord, Telegram o Signal.", "The chat link is not valid: use an https link from WhatsApp, Discord, Telegram or Signal.")); break; }
      const data = { name, game, rule: "min", min, chat, color: S.modal.color || "", icon: S.modal.icon || "", letter: S.modal.letter !== false }, gid = S.modal.gid;
      if (!(S.me.games || []).includes(game)) run(() => store.setProfile({ games: [...(S.me.games || []), game] }));
      S.modal = null;
      if (gid) run(() => store.updateGroup(gid, data));
      else run(async () => { const id = await store.createGroup(data); S.tab = "gruppi"; S.groupId = id; render(); toast("Gruppo creato: ora invita gli altri."); });
      render();
      break;
    }
    case "openGames": {
      const n = S.gameSel === "__new" ? val("gGame") : "";
      S.modal = { type: "games", back: { ...S.modal, type: "f2", newName: n, nameDraft: val("gName"), chatDraft: val("gChat"), min: document.getElementById("gMin")?.value || S.modal.min } }; S.gameDrafts = {};
      if (!(S.me.games || []).length && myGames().length) run(() => store.setProfile({ games: myGames() }));
      render(); break;
    }
    case "backToF2": S.modal = S.modal.back || { type: "f2" }; render(); break;
    case "renameGame": {
      const list = S.me.games || [], oldN = list[+d.i], nw = (S.gameDrafts[oldN] ?? oldN).trim();
      if (!nw) { showErr("gamesErr", "Il nome del gioco non può essere vuoto."); break; }
      if (nw === oldN) break;
      if (list.includes(nw)) { showErr("gamesErr", "Questo gioco è già in lista."); break; }
      if (S.gameSel === oldN) S.gameSel = nw;
      delete S.gameDrafts[oldN];
      run(async () => { await store.renameGame(oldN, nw); toast("Gioco rinominato."); });
      break;
    }
    case "removeGame": {
      const gm = (S.me.games || [])[+d.i]; const used = groupList().some(x => x.game === gm);
      ask(used ? L(`Elimini "${gm}" dalla lista? I gruppi che lo usano lo mantengono.`, `Remove "${gm}" from the list? Groups using it keep it.`) : L(`Elimini "${gm}" dalla lista?`, `Remove "${gm}" from the list?`), L("Elimina", "Delete"), () => { if (S.gameSel === gm) S.gameSel = ""; run(() => store.removeGame(gm)); });
      break;
    }
    case "setPref": run(() => store.setPref(S.groupId, +d.v)); break;
    case "toggleAdmin": {
      if (isAdmin(g, d.u) && adminsOf(g).length === 1) { toast("Il gruppo deve avere almeno un admin."); break; }
      run(() => store.setAdmin(S.groupId, d.u, !isAdmin(g, d.u))); break;
    }
    case "removeMember": ask(L(`Rimuovi ${nameIn(g, d.u)} dal gruppo?`, `Remove ${nameIn(g, d.u)} from the group?`), L("Rimuovi", "Remove"), () => run(() => store.removeMember(g.id, d.u))); break;
    case "leaveGroup": {
      if (isAdmin(g) && adminsOf(g).length === 1 && g.members.length > 1) { toast("Sei l'unico admin: prima rendi admin qualcun altro."); break; }
      ask(L(`Vuoi uscire dal gruppo "${g.name}"?`, `Leave the group "${g.name}"?`), L("Esci", "Leave"), () => { const id = g.id; go("gruppi"); run(() => g.members.length === 1 ? store.deleteGroup(id) : store.leaveGroup(id)); });
      break;
    }
    case "deleteGroup": ask(L(`Elimini il gruppo "${g.name}" per tutti?`, `Delete the group "${g.name}" for everyone?`), L("Elimina", "Delete"), () => { const id = g.id; go("gruppi"); run(() => store.deleteGroup(id)); }); break;
    case "inviteUser": {
      const q = val("invQ");
      if (!q) { showErr("invErr", "Scrivi un username o un'email."); break; }
      showErr("invErr", "");
      const gg = g;
      store.findUser(q).then(u => {
        if (!u) return showErr("invErr", "Nessuno usa l'app con questo username o email. Puoi mandargli un link qui sotto.");
        if (gg.members.includes(u.uid)) return showErr("invErr", L(`${u.name} fa già parte del gruppo.`, `${u.name} is already in the group.`));
        if ((S.invOut || []).some(i => i.gid === gg.id && i.to === u.uid)) return showErr("invErr", L(`Hai già invitato ${u.name}.`, `You already invited ${u.name}.`));
        return store.sendInvitation(gg.id, u).then(() => { const el = document.getElementById("invQ"); if (el) el.value = ""; toast(L(`Invito inviato a ${u.name}.`, `Invite sent to ${u.name}.`)); });
      }).catch(err => { console.error(err); showErr("invErr", err?.code === "permission-denied" ? "Permesso negato: controlla le regole Firestore." : (err?.message || String(err))); });
      break;
    }
    case "cancelInv": { const inv = (S.invOut || []).find(i => i.id === d.id); if (inv) run(() => store.deleteInvitation(inv)); break; }
    case "declineInv": { const inv = (S.invIn || []).find(i => i.id === d.id); if (inv) ask(L(`Rifiuti l'invito nel gruppo "${inv.groupName}"?`, `Decline the invite to the group "${inv.groupName}"?`), L("Rifiuta", "Decline"), () => run(() => store.deleteInvitation(inv))); break; }
    case "acceptInv": {
      const inv = (S.invIn || []).find(i => i.id === d.id); if (!inv) break;
      run(async () => {
        try { await store.acceptInvitation(inv); } catch (err) { toast(err.message); return; }
        S.modal = null; S.menuOpen = false; S.tab = "gruppi"; S.groupId = inv.gid; render(); window.scrollTo(0, 0);
        toast("Sei entrato nel gruppo. Segna le tue disponibilità!");
      });
      break;
    }
    case "copyLink": copy(inviteLink(g, newInvite(g))); break;
    case "shareLink": { const t = inviteText(g, newInvite(g)); if (navigator.share) navigator.share({ title: "Game Planner", text: t }).catch(() => {}); else copy(t); break; }
    case "cancelInvites": ask(L("Annulli tutti gli inviti non ancora usati? Quei link smettono di funzionare.", "Cancel all unused invites? Those links will stop working."), L("Annulla inviti", "Cancel invites"), () => run(async () => { await store.cancelInvites(g.id); toast("Inviti annullati."); })); break;

    // inviti
    case "openF3": S.modal = { type: "f3" }; render(); break;
    case "copyAppLink": copy(shareableUrl()); break;
    case "pasteClip": navigator.clipboard.readText().then(t => {
      const inv = parseInvite(t);
      if (!inv) { showErr("pErr", "Negli appunti non c'è un link di invito. Copialo dal messaggio e riprova."); return; }
      S.pendingJoin = inv; S.modal = null; render();
    }).catch(() => showErr("pErr", "Non riesco a leggere gli appunti: tieni premuto nel campo qui sotto e scegli Incolla.")); break;
    case "usePaste": {
      const inv = parseInvite(val("pasteInput"));
      if (!inv) { showErr("pErr", "Questo non sembra un link di invito valido."); break; }
      S.pendingJoin = inv; S.modal = null; render(); break;
    }
    case "ignoreJoin": S.pendingJoin = null; clearPending(); S.modal = null; render(); break;
    case "doJoin": {
      const p = S.pendingJoin;
      run(async () => {
        try { await store.joinGroup(p.gid, p.code); } catch (err) { showErr("jErr", err.message); return; }
        S.pendingJoin = null; clearPending(); S.modal = null; S.tab = "gruppi"; S.groupId = p.gid; render();
        toast("Sei entrato nel gruppo. Segna le tue disponibilità!");
      });
      break;
    }

    // disponibilità
    case "brush": S.brush = d.b; render(); break;
    case "day": { const cur = (S.me.days || {})[d.date]; run(() => store.setDays({ [d.date]: S.brush === "clear" || cur === S.brush ? null : S.brush })); break; }
    case "setMyDay": { const cur = (S.me.days || {})[d.date]; run(() => store.setDays({ [d.date]: cur === d.v ? null : d.v })); break; }
    case "fillEmpty": case "fillWeekend": {
      if (S.brush === "clear") { toast("Scegli prima SI, FORSE o NO."); break; }
      const mine = S.me.days || {}, map = {};
      for (const k of monthKeys(S.dMonth)) { const w = parseYmd(k).getDay(); if (a === "fillEmpty" ? !mine[k] : (w === 0 || w === 6)) map[k] = S.brush; }
      if (Object.keys(map).length) run(() => store.setDays(map));
      break;
    }
    case "clearMonth": ask("Cancello le tue disponibilità di questo mese?", "Svuota", () => {
      const mine = S.me.days || {}, map = {};
      for (const k of monthKeys(S.dMonth)) if (mine[k]) map[k] = null;
      if (Object.keys(map).length) run(() => store.setDays(map));
    }); break;

    // proposte
    case "openProp": S.modal = { type: "prop", draft: { gid: d.g || (S.sGroup !== "all" ? S.sGroup : (groupList()[0]?.id || "")), date: d.date || "" } }; render(); break;
    case "goProp": S.sFilter = "prop"; go("serate"); break;
    case "homeGroup": S.tab = "gruppi"; S.groupId = d.g; render(); window.scrollTo(0, 0); break;
    case "submitProp": {
      const gid = val("pGroup"), date = val("pDate"), gg = getGroup(gid);
      if (!gg) { showErr("propErr", "Scegli un gruppo."); break; }
      if (!date || date < todayStr() || date > LAST_DAY) { showErr("propErr", "Scegli un giorno a partire da oggi."); break; }
      const data = { date, time: val("pTime"), place: val("pPlace"), desc: val("pDesc") };
      S.modal = null; S.tab = "serate"; S.sFilter = "prop"; S.groupId = null; S.sMonth = date.slice(0, 7);
      run(async () => { await store.createProposal(gid, data); toast(L(`Proposta inviata al gruppo ${gg.name}.`, `Proposal sent to the group ${gg.name}.`)); });
      render(); window.scrollTo(0, 0);
      break;
    }
    case "setGameDay": { const gg = S.groups[d.g] && getGroup(d.g); if (!gg) break; run(() => store.setGameDay(d.g, d.date, gameDay(gg, me, d.date) === d.v ? null : d.v)); break; }
    case "propAnswer": { const p = S.groups[d.g]?.proposals?.[d.pid]; if (p) run(() => store.propAnswer(d.g, d.pid, ansOf(p, me) === d.v ? null : d.v)); break; }
    case "withdrawProp": ask("Ritiri questa proposta per tutto il gruppo?", "Ritira", () => run(() => store.deleteProposal(d.g, d.pid))); break;

    // sessioni
    case "sFilter": S.sFilter = d.v; render(); break;
    case "toggleOnly": { const v = !onlyPoss(); S.me.onlyPossible = v; render(); run(() => store.setProfile({ onlyPossible: v })); break; }
    case "setSView": { if (sView() === d.v) break; S.me.sView = d.v; render(); run(() => store.setProfile({ sView: d.v })); break; }
    case "goToday": { S.sMonth = curMonth(); S.modal = { type: "f4", date: todayStr() }; render(); break; }
    case "openF4": S.modal = { type: "f4", date: d.date }; render(); break;
    case "openEv": S.modal = { type: "ev", gid: d.g, sid: d.s }; render(); break;
    case "openF5": {
      const adm = groupList().filter(x => isAdmin(x));
      let draft = { gid: d.g || adm[0]?.id || "", date: d.date || "", time: DEFAULT_TIME };
      if (d.pid) { const p = S.groups[d.g]?.proposals?.[d.pid]; if (p) draft = { ...draft, time: p.time || DEFAULT_TIME, place: p.place || "", notes: p.desc || "", propId: d.pid }; }
      S.modal = { type: "f5", draft }; render(); break;
    }
    case "submitF5": {
      const gid = val("sGroup"), date = val("sDate"), gg = getGroup(gid);
      if (!gg || !isAdmin(gg)) { showErr("sErr", "Scegli un gruppo di cui sei admin."); break; }
      if (!date || date < todayStr() || date > LAST_DAY) { showErr("sErr", "Scegli un giorno a partire da oggi."); break; }
      if (Object.values(gg.sessions || {}).some(s => s.date === date)) { showErr("sErr", "Questo gruppo ha già una sessione confermata in quel giorno."); break; }
      const data = { date, time: val("sTime") || DEFAULT_TIME, location: val("sLoc"), notes: val("sNotes") };
      const propId = S.modal.draft?.propId && S.modal.draft.gid === gid ? S.modal.draft.propId : null;
      S.modal = null; S.tab = "serate"; S.sFilter = "prog"; S.groupId = null;
      run(async () => {
        await store.confirmSession(gid, data, propId);
        toast("Sessione confermata: i membri del gruppo trovano l'avviso nell'app.");
      });
      render(); window.scrollTo(0, 0);
      break;
    }

    // giocate
    case "rsvp": {
      const s = S.groups[d.g]?.sessions?.[d.s], gg = getGroup(d.g); if (!s || !gg) break;
      run(async () => {
        if (d.v !== "no" && baseDay(gg, me, s.date) === "no") await store.setDays({ [s.date]: null });
        if ((s.rsvps || {})[me] !== d.v) await store.rsvp(d.g, d.s, d.v);
      });
      break;
    }
    case "ics": { const gg = getGroup(d.g); downloadIcs(gg, d.s, gg.sessions[d.s]); break; }
    case "hTab": S.hTab = d.v; render(); window.scrollTo(0, 0); break;
    case "shareYear": { const t = yearText(S.yrYear || String(new Date().getFullYear()), S.yrGroup || "all"); if (navigator.share) navigator.share({ title: "Game Planner", text: t }).catch(() => {}); else copy(t); break; }
    case "openF6": S.modal = { type: "f6", gid: d.g, sid: d.s }; render(); break;
    case "copyText": copy(d.text); break;
    case "revoke": ask("Revochi la conferma? La sessione torna una proposta e tutti possono rispondere di nuovo.", "Revoca", () => { S.modal = null; run(async () => { await store.revokeSession(d.g, d.s); toast("Conferma revocata: la sessione è di nuovo una proposta."); }); }); break;
    case "cancelSession": ask("Annulli questa sessione per tutti?", "Annulla sessione", () => { S.modal = null; run(async () => { await store.deleteSession(d.g, d.s); toast("Sessione annullata."); }); }); break;
    case "fGameChip": S.fGame = S.fGame === d.game ? "all" : d.game; render(); break;
    case "clearFilters": S.fGame = S.fGroup = S.fYear = S.fMonth = "all"; render(); break;
    case "openTut": S.menuOpen = false; S.modal = { type: "tut", i: 0 }; render(); break;
    case "tutGo": if (S.modal?.type === "tut") { S.modal.i = +d.i; S.modal.moved = true; render(); } break;
    case "tutClose": S.modal = null; render(); if (!S.me.tutorialSeen) { S.me.tutorialSeen = true; run(() => store.setProfile({ tutorialSeen: true })); } break;
    case "pushBannerOff": try { localStorage.setItem("gp-push-off", "1"); } catch (e) {} S.me.pushBanner = "off"; render(); run(() => store.setProfile({ pushBanner: "off" })); toast(L("Puoi attivarle quando vuoi dal menu del profilo, alla voce Notifiche.", "You can turn them on anytime from the profile menu, under Notifications.")); break;
    case "openNotifPrefs": S.menuOpen = false; S.modal = { type: "notif" }; render(); break;
    case "pushCat": { const pr = { ...(S.me.pushPrefs || {}) }; pr[d.k] = !pushOn(d.k); S.me.pushPrefs = pr; render(); run(() => store.setProfile({ pushPrefs: pr })); break; }
    case "pushMenu": {
      const ps = pushState(); S.menuOpen = false;
      if (ps === "on") { ask(L("Disattivi le notifiche su questo dispositivo?", "Turn off notifications on this device?"), L("Disattiva", "Turn off"), () => run(async () => { await store.disablePush(); render(); toast(L("Notifiche disattivate.", "Notifications turned off.")); })); break; }
      if (ps === "ios-home") { toast(L("Su iPhone: Condividi, Aggiungi alla schermata Home, poi apri l'app da lì.", "On iPhone: Share, Add to Home Screen, then open the app from there.")); render(); break; }
      if (ps === "denied") { toast(L("Le notifiche sono bloccate: riattivale dalle impostazioni del telefono per questo sito.", "Notifications are blocked: allow them in your phone settings for this site.")); render(); break; }
      if (ps === "retry") { store.enablePush().then(() => { render(); toast(L("Notifiche attivate su questo dispositivo.", "Notifications turned on for this device.")); }).catch(e => { toast(L("Notifiche non attivate: ", "Notifications not turned on: ") + String(e?.code || e?.message || e).slice(0, 120)); }); break; }
      if (ps !== "ask") { toast(PUSH_LABEL()); render(); break; }
      // La richiesta del permesso deve partire subito dal tocco (iPhone lo pretende)
      Notification.requestPermission().then(p => {
        if (p !== "granted") { render(); toast(p === "denied" ? L("Permesso negato: riattivalo da Impostazioni, Notifiche, Game Planner.", "Permission denied: turn it on in Settings, Notifications, Game Planner.") : L("Il telefono non ha mostrato la richiesta. Prova da Impostazioni, Notifiche, Game Planner, oppure rimuovi l'icona dalla Home e aggiungila di nuovo.", "The phone did not show the prompt. Try Settings, Notifications, Game Planner, or remove the Home Screen icon and add it again.")); return; }
        return store.enablePush().then(() => { render(); toast(L("Notifiche attivate su questo dispositivo.", "Notifications turned on for this device.")); });
      }).catch(e => { console.error(e); const msg = String(e?.code || e?.message || e).slice(0, 120); try { localStorage.setItem("gp-push-err", msg); } catch (x) {} store.reportPushError?.(`${e?.code || ""} ${e?.message || e}`); render(); toast(L("Notifiche non attivate: ", "Notifications not turned on: ") + msg); });
      break;
    }
    case "enableNotif": Notification.requestPermission().then(p => { render(); if (p === "granted") toast("Avvisi attivati su questo dispositivo."); }); break;
    case "openNotifs": {
      const unread = notifications().filter(n => n.unread).map(n => n.key);
      S.menuOpen = false; S.modal = { type: "f8", unread }; render();
      if (unread.length) run(() => store.markSeen());
      break;
    }

    // accesso
    case "googleIn": S.authErr = ""; store.signInGoogle().catch(err => { S.authErr = authMsg(err); render(); }); break;
    case "emailIn": case "emailUp": {
      S.authErr = "";
      const em = val("authEmail"), pw = document.getElementById("authPw")?.value || "";
      if (!/^\S+@\S+\.\S+$/.test(em)) { S.authErr = "Email non valida."; render(); break; }
      if (!pw) { S.authErr = "Inserisci la password."; render(); break; }
      if (pw.length < 6) { S.authErr = "La password deve avere almeno 6 caratteri."; render(); break; }
      (a === "emailIn" ? store.signInEmail(em, pw) : store.signUpEmail(em, pw)).catch(err => { S.authErr = authMsg(err); render(); });
      break;
    }
    case "resetPw": {
      const em = val("authEmail");
      if (!em) { S.authErr = "Scrivi la tua email qui sopra, poi tocca di nuovo."; render(); break; }
      store.resetPassword(em).then(() => toast("Ti abbiamo mandato un'email per reimpostare la password.")).catch(err => { S.authErr = authMsg(err); render(); });
      break;
    }
    case "resendVerify": store.resendVerification().then(() => toast("Email inviata di nuovo.")).catch(err => { S.authErr = authMsg(err); render(); }); break;
    case "checkVerify": store.checkVerified().then(ok => { if (!ok) { S.authErr = "Non risulta ancora verificata. Apri il link nell'email e riprova."; render(); } }).catch(err => { S.authErr = authMsg(err); render(); }); break;

    // demo
    case "demoAs": notifiedKeys = null; store.loginAs(d.u); break;
    case "demoNew": { const n = val("demoName"); if (!n) { toast("Scrivi un nome."); break; } store.createUser(n); break; }
    case "demoSeed": store.seed(); S.tab = "gruppi"; render(); break;
    case "demoReset": ask("Cancello tutti i dati della demo?", L("Cancella", "Delete"), () => store.reset()); break;
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (S.ask) S.ask = null; else if (S.menuOpen) S.menuOpen = false; else if (S.modal?.type === "tut") { document.querySelector('[data-action="tutClose"]')?.click(); return; } else S.modal = null; render(); return; }
  if (e.key !== "Enter") return;
  const map = { setupUser: "saveSetupUser", invQ: "inviteUser", demoName: "demoNew", nameInput: "saveName", authPw: "emailIn", pasteInput: "usePaste", gName: "saveGroup" };
  const act = map[e.target.id];
  if (act) document.querySelector(`[data-action="${act}"]`)?.click();
  const gi = e.target.dataset?.gameInput;
  if (gi !== undefined) e.target.closest(".row")?.querySelector('[data-action="renameGame"]')?.click();
});

// ---------------------------------------------------------------------
//  AVVIO
// ---------------------------------------------------------------------
(async () => {
  let inv = parseInvite(location.hash) || parseInvite(location.search);
  if (inv) { try { sessionStorage.setItem("gp-join", JSON.stringify(inv)); } catch (e) {} history.replaceState(null, "", location.pathname); }
  else { try { inv = JSON.parse(sessionStorage.getItem("gp-join") || "null"); } catch (e) {} }
  S.pendingJoin = inv;
  // Link dalle notifiche: ?open=prop|prog apre Sessioni nella sezione giusta
  try { const o = new URLSearchParams(location.search).get("open"); if (o === "prop" || o === "prog") { S.tab = "serate"; S.sFilter = o; history.replaceState(null, "", location.pathname); } } catch (e) {}
  // Service worker: rende l'app installabile su Android (così i link di invito aprono l'app)
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(e => console.error(e));
    // Aggiornamenti: quando l'app torna in primo piano controlla se c'è una versione nuova e, se c'è, ricarica
    const hadCtrl = !!navigator.serviceWorker.controller; let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!hadCtrl || reloading) return; reloading = true; location.reload(); });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {}); });
  }
  try { store = FIREBASE_CONFIG ? await makeFirebaseStore(FIREBASE_CONFIG) : makeLocalStore(); }
  catch (e) { console.error(e); $("#app").innerHTML = `<div class="auth">${hero()}<div class="card"><p class="sub">Non riesco a collegarmi al server. Controlla la connessione e ricarica la pagina.</p></div></div>`; translateDom($("#app")); return; }
  store.start(data => { Object.assign(S, data); render(); browserNotify(); migrateRules(); refreshPush(); });
})();
</script>
</body>
</html>
