<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#efece4; --text:#1d2230; --muted:#6b7080; --line:#e2ddd2;
  --accent:#2f4b8a; --accent-text:#ffffff; --accent-soft:#e3e9f7;
  --yes:#2e9d5b; --yes-bg:#dff3e6; --maybe:#b97c0c; --maybe-bg:#fbefd2; --no:#b5463c; --no-bg:#f6dedb;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14171f; --surface:#1d212c; --surface-2:#262b38; --text:#eceef3; --muted:#9aa0ae; --line:#2e3442;
    --accent:#8aa6f0; --accent-text:#0f1320; --accent-soft:#25304a;
    --yes:#4cc27e; --yes-bg:#1b3527; --maybe:#e3a93a; --maybe-bg:#3a2f17; --no:#e0766b; --no-bg:#3b2120;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;gap:8px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.2px}
.who{display:flex;gap:6px;align-items:center}
main{padding:16px 0 110px}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:16px;margin:0 0 4px}
h4{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card.click{cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:10px}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:15px;text-decoration:none;display:inline-block;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--no)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.yes.on{background:var(--yes-bg);border-color:var(--yes);color:var(--yes)}
.btn.maybe.on{background:var(--maybe-bg);border-color:var(--maybe);color:var(--maybe)}
.btn.no.on{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.btn:disabled{opacity:.4;cursor:default}
.full{width:100%}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=time],input[type=date],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.chip{display:inline-block;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:13px;margin:2px 4px 2px 0}
.chip.yes{background:var(--yes-bg);border-color:var(--yes);color:var(--yes)}
.chip.maybe{background:var(--maybe-bg);border-color:var(--maybe);color:var(--maybe)}
.chip.no{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.chip.none{opacity:.75;border-style:dashed}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.go{background:var(--yes-bg);color:var(--yes)}
.badge.wait{background:var(--maybe-bg);color:var(--maybe)}
.badge.stop{background:var(--no-bg);color:var(--no)}
.badge.star{background:var(--accent);color:var(--accent-text)}
.banner{background:var(--maybe-bg);color:var(--text);border:1px solid var(--maybe);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.note{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
.err{color:var(--no);font-size:14px;min-height:20px}
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:0;margin-bottom:10px;font-size:15px}
.legend{font-size:12px;color:var(--muted);margin-top:10px}
.choice{display:flex;align-items:center;gap:8px;padding:8px 0}
.choice input{width:auto;margin:0}

/* calendario */
.brushes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.brushes .btn{padding:8px 4px;font-size:13px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow div{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding-bottom:4px}
.day{aspect-ratio:1/1;border:1px solid var(--line);background:var(--surface);border-radius:10px;position:relative;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;line-height:1.1}
.day .t{font-size:9px;font-weight:800;letter-spacing:.3px;margin-top:2px}
.day.yes{background:var(--yes-bg);border-color:var(--yes);color:var(--yes);font-weight:700}
.day.maybe{background:var(--maybe-bg);border-color:var(--maybe);color:var(--maybe);font-weight:700}
.day.no{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.day.today .n{text-decoration:underline;text-underline-offset:3px;font-weight:800}
.day:disabled{opacity:.35;cursor:default}

/* serate */
.night{padding:0;overflow:hidden}
.night .head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.night .head strong{font-size:16px}
.gr{padding:12px 14px;border-bottom:1px solid var(--line)}
.gr:last-child{border-bottom:0}
.gr.dim{opacity:.6}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding:0 4px}
nav.tabs button{background:none;border:0;padding:12px 2px 14px;font-size:13px;font-weight:600;color:var(--muted);position:relative}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.tabs .count{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-text);font-size:11px;margin-left:3px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw}
.auth{max-width:400px;margin:40px auto;padding:0 16px}
.auth h1{font-size:30px;margin:0 0 4px;letter-spacing:-.5px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:14px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
details summary{cursor:pointer;color:var(--muted);font-weight:600;margin:8px 0}
.linkbox{font-size:13px;word-break:break-all;background:var(--surface-2);border-radius:8px;padding:8px 10px;margin:6px 0}
</style>
</head>
<body>
<div id="app"><div class="auth"><p class="muted">Caricamento...</p></div></div>

<script type="module">
// =====================================================================
//  CONFIGURAZIONE
//  Incolla qui sotto la configurazione del tuo progetto Firebase
//  (Console Firebase > Impostazioni progetto > Le tue app > Config).
//  Finché resta null, l'app gira in MODALITÀ DEMO: i dati restano
//  solo su questo dispositivo e puoi provare tutto da solo.
// =====================================================================
const FIREBASE_CONFIG = null;
const DEFAULT_TIME = "21:00";
const SESSION_HOURS = 3;
const LAST_YEAR = 2029;
// =====================================================================

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const MONTHS = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const DOW = ["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const fmtDate = s => cap(parseYmd(s).toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long", year: "numeric" }));
const fmtShort = s => cap(parseYmd(s).toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" }));
const todayStr = () => ymd(new Date());
const LAST_DAY = `${LAST_YEAR}-12-31`;
const curMonth = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const PREFS = { 3: "Tanta voglia", 2: "Normale", 1: "Poca voglia" };
const STATUS = { yes: "Ci sono", maybe: "Forse", no: "Non ci sono" };

function monthOptions() {
  const out = []; const d = new Date(); d.setDate(1);
  while (d.getFullYear() <= LAST_YEAR) { out.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`); d.setMonth(d.getMonth() + 1); }
  return out;
}
const monthLabel = ym => { const [y, m] = ym.split("-").map(Number); return `${MONTHS[m - 1]} ${y}`; };

function parseInvite(str) {
  const m = String(str || "").match(/join=([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)(?:&n=([^&\s#]*))?/);
  if (!m) return null;
  let name = ""; try { name = m[3] ? decodeURIComponent(m[3]) : ""; } catch (e) {}
  return { gid: m[1], code: m[2], name };
}

const S = {
  authState: "loading", me: null, groups: {}, demoUsers: [],
  tab: "groups", groupId: null, brush: "yes",
  month: curMonth(), nMonth: curMonth(), nGroup: "all", onlyPossible: true,
  modal: null, authErr: "", pendingJoin: null,
};
let store = null;

// ---------------------------------------------------------------------
//  STORE DEMO (localStorage)
// ---------------------------------------------------------------------
function makeLocalStore() {
  const KEY = "gameplanner-demo-v2";
  let db = null;
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  db = db || { users: {}, groups: {}, current: null };
  let listener = () => {};
  const emit = () => {
    const uid = db.current, u = uid && db.users[uid];
    const me = u ? { uid, name: u.name, email: "", days: u.days || {} } : null;
    const groups = {};
    if (me) for (const [gid, g] of Object.entries(db.groups)) {
      if (!g.members.includes(uid)) continue;
      const names = {}, avail = {};
      for (const m of g.members) { names[m] = db.users[m]?.name || "?"; avail[m] = db.users[m]?.days || {}; }
      groups[gid] = { ...g, names, avail, sessions: g.sessions || {} };
    }
    listener({ me, groups, authState: me ? "ready" : "signedOut", demoUsers: Object.entries(db.users).map(([id, x]) => ({ id, name: x.name })) });
  };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} emit(); };
  const id = () => Math.random().toString(36).slice(2, 10);
  const G = gid => db.groups[gid];
  return {
    demo: true,
    start(fn) { listener = fn; emit(); },
    loginAs(u) { db.current = u; save(); },
    createUser(name) { const u = "u_" + id(); db.users[u] = { name, days: {} }; db.current = u; save(); },
    logout() { db.current = null; save(); },
    setName(n) { db.users[db.current].name = n; save(); },
    setDays(map) { const d = db.users[db.current].days ||= {}; for (const [k, v] of Object.entries(map)) { if (v) d[k] = v; else delete d[k]; } save(); },
    createGroup(data) { const gid = "g" + id(); db.groups[gid] = { ...data, members: [db.current], prefs: { [db.current]: 2 }, inviteCode: id(), createdBy: db.current, sessions: {} }; save(); return gid; },
    updateGroup(gid, p) { Object.assign(G(gid), p); save(); },
    joinGroup(gid, code) {
      const g = G(gid);
      if (!g || g.inviteCode !== code) throw new Error("Invito non valido o gruppo non più esistente.");
      if (!g.members.includes(db.current)) g.members.push(db.current);
      g.prefs[db.current] ??= 2; save();
    },
    leaveGroup(gid) { const g = G(gid); g.members = g.members.filter(x => x !== db.current); delete g.prefs[db.current]; save(); },
    deleteGroup(gid) { delete db.groups[gid]; save(); },
    setPref(gid, v) { G(gid).prefs[db.current] = v; save(); },
    createSession(gid, data) { G(gid).sessions[ "s" + id()] = { ...data, createdBy: db.current, rsvps: { [db.current]: "yes" } }; save(); },
    rsvp(gid, sid, v) { G(gid).sessions[sid].rsvps[db.current] = v; save(); },
    deleteSession(gid, sid) { delete G(gid).sessions[sid]; save(); },
    reset() { db = { users: {}, groups: {}, current: null }; save(); },
    seed() {
      // Dati di ottobre 2026 presi dal foglio "QUANDO GIOCARE" (s = si, n = no, f = forse)
      const october = {
        Gigi:    "nnnnssssssssssssnssssnssssssssn",
        Mattia:  "nnnnsnnsnnnssnsnnnssnsnnnssnsnn",
        Roberto: "sssssssssssssssssssssssssssssss",
        Iole:    "sssssssssssssssssssssssssssssss",
        Gian:    "ssnnsnsssnnsssssnnsssssnnsssssn",
        Fabiola: "nnnnssnsnsnssnnssssnnsnsnssnnns",
      };
      db = { users: {}, groups: {}, current: null };
      const ids = {};
      let r = 11; const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647;
      for (const [name, str] of Object.entries(october)) {
        const uid = "u_" + name.toLowerCase(); ids[name] = uid;
        const days = {};
        [...str].forEach((c, i) => { days[`2026-10-${pad(i + 1)}`] = c === "s" ? "yes" : c === "f" ? "maybe" : "no"; });
        const d = new Date(2026, 10, 1);
        while (d < new Date(2027, 1, 1)) {
          const x = rnd(), w = d.getDay(), k = ymd(d);
          const base = name === "Roberto" || name === "Iole" ? .85 : (w === 0 || w === 6) ? .45 : .6;
          days[k] = x < base ? "yes" : x < base + .12 ? "maybe" : "no";
          d.setDate(d.getDate() + 1);
        }
        db.users[uid] = { name, days };
      }
      const mk = (gid, name, game, who, prefs) => {
        const members = who.map(n => ids[n]); const p = {};
        members.forEach((m, i) => { p[m] = prefs[i]; });
        db.groups[gid] = { name, game, rule: "all", min: 2, members, prefs: p, inviteCode: "demo" + gid, createdBy: ids.Mattia, sessions: {} };
      };
      mk("gLUT", "L'Ultima Torcia", "Ultima Torcia", ["Gigi", "Mattia", "Roberto", "Iole", "Gian"], [3, 3, 2, 3, 2]);
      mk("gSB", "Set Base", "Set Base", ["Mattia", "Iole", "Gian"], [2, 2, 3]);
      mk("gDND", "Campagna D&D", "Dungeons & Dragons", ["Gigi", "Mattia", "Roberto", "Iole", "Gian", "Fabiola"], [2, 3, 3, 2, 2, 3]);
      mk("gFM", "Fan Made", "Fan Made", ["Gigi", "Roberto", "Iole", "Gian"], [3, 2, 2, 3]);
      db.current = ids.Mattia;
      save();
    },
  };
}

// ---------------------------------------------------------------------
//  STORE FIREBASE
// ---------------------------------------------------------------------
async function makeFirebaseStore(cfg) {
  const V = "10.12.2";
  const [{ initializeApp }, A, F] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
  ]);
  const app = initializeApp(cfg);
  const auth = A.getAuth(app);
  auth.languageCode = "it";
  const db = F.getFirestore(app);
  let listener = () => {}, uid = null, email = "", authState = "loading", meDoc = null;
  let base = []; const per = {}; const raw = {};
  const emit = () => {
    const groups = {};
    for (const [gid, r] of Object.entries(raw)) if (r.doc) groups[gid] = { prefs: {}, names: {}, ...r.doc, avail: r.avail, sessions: r.sessions };
    listener({ authState, authEmail: email, groups, me: authState === "ready" && meDoc ? { uid, email, days: {}, ...meDoc } : null });
  };
  const onErr = e => { console.error(e); emit(); };
  const dropGroup = g => { (per[g] || []).forEach(u => u()); delete per[g]; delete raw[g]; };
  const stopAll = () => { base.forEach(u => u()); base = []; Object.keys(per).forEach(dropGroup); Object.keys(raw).forEach(g => delete raw[g]); meDoc = null; };

  function watchGroup(g) {
    if (per[g]) return;
    per[g] = [
      F.onSnapshot(F.collection(db, "groups", g, "availability"), s => { const o = {}; s.forEach(d => { o[d.id] = d.data().days || {}; }); if (raw[g]) { raw[g].avail = o; emit(); } }, onErr),
      F.onSnapshot(F.collection(db, "groups", g, "sessions"), s => { const o = {}; s.forEach(d => { o[d.id] = { rsvps: {}, ...d.data() }; }); if (raw[g]) { raw[g].sessions = o; emit(); } }, onErr),
    ];
  }

  async function handleUser(user) {
    stopAll();
    if (!user) { uid = null; email = ""; authState = "signedOut"; return emit(); }
    email = (user.email || "").toLowerCase();
    const isPassword = user.providerData.some(p => p.providerId === "password");
    if (isPassword && !user.emailVerified) { uid = null; authState = "unverified"; return emit(); }
    uid = user.uid;
    const ref = F.doc(db, "users", uid);
    try {
      const s = await F.getDoc(ref);
      if (!s.exists()) await F.setDoc(ref, { name: user.displayName || email.split("@")[0], email, days: {} });
    } catch (e) { console.error(e); authState = "error"; return emit(); }
    authState = "ready";
    base.push(F.onSnapshot(ref, s => { meDoc = s.data() || {}; emit(); }, onErr));
    base.push(F.onSnapshot(F.query(F.collection(db, "groups"), F.where("members", "array-contains", uid)), s => {
      const ids = new Set();
      s.forEach(d => { ids.add(d.id); (raw[d.id] ||= { avail: {}, sessions: {} }).doc = d.data(); watchGroup(d.id); });
      for (const g of Object.keys(raw)) if (!ids.has(g)) dropGroup(g);
      emit();
    }, onErr));
    emit();
  }

  const myIds = () => Object.keys(raw).filter(g => raw[g].doc);
  const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => "abcdefghijkmnpqrstuvwxyz23456789"[b % 32]).join("");

  return {
    demo: false,
    start(fn) { listener = fn; emit(); A.onAuthStateChanged(auth, handleUser); },
    signInGoogle: () => A.signInWithPopup(auth, new A.GoogleAuthProvider()),
    signInEmail: (e, p) => A.signInWithEmailAndPassword(auth, e, p),
    async signUpEmail(e, p) { const c = await A.createUserWithEmailAndPassword(auth, e, p); await A.sendEmailVerification(c.user); },
    resendVerification: () => A.sendEmailVerification(auth.currentUser),
    async checkVerified() { await auth.currentUser.reload(); await auth.currentUser.getIdToken(true); await handleUser(auth.currentUser); return auth.currentUser.emailVerified; },
    resetPassword: e => A.sendPasswordResetEmail(auth, e),
    logout: () => A.signOut(auth),
    async setName(n) {
      const b = F.writeBatch(db);
      b.update(F.doc(db, "users", uid), { name: n });
      for (const g of myIds()) b.update(F.doc(db, "groups", g), { ["names." + uid]: n });
      await b.commit();
    },
    async setDays(map) {
      const days = {}; for (const [k, v] of Object.entries(map)) days[k] = v || F.deleteField();
      const b = F.writeBatch(db);
      b.set(F.doc(db, "users", uid), { days }, { merge: true });
      for (const g of myIds()) b.set(F.doc(db, "groups", g, "availability", uid), { days }, { merge: true });
      await b.commit();
    },
    async createGroup(data) {
      const ref = F.doc(F.collection(db, "groups"));
      await F.setDoc(ref, { ...data, members: [uid], names: { [uid]: meDoc?.name || "" }, prefs: { [uid]: 2 }, inviteCode: rid(), createdBy: uid, createdAt: F.serverTimestamp() });
      await F.setDoc(F.doc(db, "groups", ref.id, "availability", uid), { days: meDoc?.days || {} });
      return ref.id;
    },
    updateGroup: (gid, p) => F.updateDoc(F.doc(db, "groups", gid), p),
    async joinGroup(gid, code) {
      try {
        await F.updateDoc(F.doc(db, "groups", gid), { members: F.arrayUnion(uid), ["names." + uid]: meDoc?.name || "", ["prefs." + uid]: 2, joinCode: code });
      } catch (e) {
        throw new Error(e.code === "permission-denied" || e.code === "not-found" ? "Invito non valido o gruppo non più esistente." : e.message);
      }
      await F.setDoc(F.doc(db, "groups", gid, "availability", uid), { days: meDoc?.days || {} });
    },
    async leaveGroup(gid) {
      await F.deleteDoc(F.doc(db, "groups", gid, "availability", uid));
      await F.updateDoc(F.doc(db, "groups", gid), { members: F.arrayRemove(uid), ["names." + uid]: F.deleteField(), ["prefs." + uid]: F.deleteField() });
    },
    deleteGroup: gid => F.deleteDoc(F.doc(db, "groups", gid)),
    setPref: (gid, v) => F.updateDoc(F.doc(db, "groups", gid), { ["prefs." + uid]: v }),
    createSession: (gid, d) => F.addDoc(F.collection(db, "groups", gid, "sessions"), { ...d, createdBy: uid, rsvps: { [uid]: "yes" }, createdAt: F.serverTimestamp() }),
    rsvp: (gid, sid, v) => F.updateDoc(F.doc(db, "groups", gid, "sessions", sid), { ["rsvps." + uid]: v }),
    deleteSession: (gid, sid) => F.deleteDoc(F.doc(db, "groups", gid, "sessions", sid)),
  };
}

const groupList = () => Object.entries(S.groups).map(([id, g]) => ({ id, ...g })).sort((a, b) => (a.name || "").localeCompare(b.name || ""));
const getGroup = id => S.groups[id] ? { id, ...S.groups[id] } : null;
const nameIn = (g, u) => u === S.me.uid ? (S.me.name || "Tu") : (g.names?.[u] || "Qualcuno");
const prefOf = (g, u) => g.prefs?.[u] || 2;
const dayOf = (g, u, d) => u === S.me.uid ? (S.me.days || {})[d] : (g.avail?.[u] || {})[d];
const need = g => g.rule === "min" ? Math.min(g.min || 2, g.members.length) : g.members.length;
const ruleText = g => g.rule === "min" ? `Si gioca con almeno ${g.min} membri` : "Si gioca solo se ci sono tutti";
const byName = (g, list) => [...list].sort((a, b) => nameIn(g, a).localeCompare(nameIn(g, b)));

function evalGroup(g, d) {
  const by = { yes: [], maybe: [], no: [], none: [] };
  for (const u of g.members) (by[dayOf(g, u, d)] || by.none).push(u);
  const n = need(g);
  const status = by.yes.length >= n ? "ok" : by.yes.length + by.maybe.length >= n ? "maybe" : "no";
  const counted = status === "ok" ? by.yes : [...by.yes, ...by.maybe];
  const pref = counted.length ? counted.reduce((a, u) => a + prefOf(g, u), 0) / counted.length : 0;
  return { g, n, ...by, status, pref, counted };
}

function sessionInfo(g, s) {
  const rs = s.rsvps || {};
  const yes = g.members.filter(u => rs[u] === "yes"), no = g.members.filter(u => rs[u] === "no"), pending = g.members.filter(u => !rs[u]);
  const n = need(g);
  return { yes, no, pending, n, go: yes.length >= n, missing: Math.max(0, n - yes.length) };
}

function allSessions() {
  const out = [];
  for (const g of groupList()) for (const [sid, s] of Object.entries(g.sessions || {})) out.push({ g, sid, s });
  return out.sort((a, b) => (a.s.date + (a.s.time || "")).localeCompare(b.s.date + (b.s.time || "")));
}

function inviteLink(g) {
  const base = location.origin + location.pathname;
  return `${base}#join=${g.id}.${g.inviteCode}&n=${encodeURIComponent(g.name)}`;
}
const inviteText = g => `Ciao! Ti invito nel gruppo "${g.name}" (${g.game}) su Si gioca?, così vediamo insieme quando possiamo giocare. Entra da qui: ${inviteLink(g)}`;

function sessionTimes(s) {
  const [hh, mm] = (s.time || DEFAULT_TIME).split(":").map(Number);
  const start = parseYmd(s.date); start.setHours(hh, mm, 0, 0);
  const end = new Date(start.getTime() + SESSION_HOURS * 3600e3);
  const f = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  return { start: f(start), end: f(end) };
}
function sessionDetails(g, s) {
  const i = sessionInfo(g, s);
  const lines = [`Si gioca a ${g.game} con il gruppo ${g.name}!`];
  if (i.yes.length) lines.push("Confermati: " + byName(g, i.yes).map(u => nameIn(g, u)).join(", "));
  if (s.notes) lines.push(s.notes);
  return lines.join("\n");
}
function downloadIcs(g, sid, s) {
  const t = sessionTimes(s);
  const e = x => String(x || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Si gioca//IT", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
    "BEGIN:VEVENT", `UID:${g.id}-${sid}@sigioca`, `DTSTAMP:${stamp}`, `DTSTART:${t.start}`, `DTEND:${t.end}`,
    `SUMMARY:${e(g.game + " - " + g.name)}`, `LOCATION:${e(s.location)}`, `DESCRIPTION:${e(sessionDetails(g, s))}`,
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${e("Domani si gioca a " + g.game)}`, "TRIGGER:-P1D", "END:VALARM",
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${e("Tra 2 ore si gioca a " + g.game)}`, "TRIGGER:-PT2H", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR",
  ].join("\r\n");
  const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = `${g.game.replace(/[^\w]+/g, "-").toLowerCase()}-${s.date}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function gcalLink(g, s) {
  const t = sessionTimes(s);
  const p = new URLSearchParams({ action: "TEMPLATE", text: `${g.game} - ${g.name}`, dates: `${t.start}/${t.end}`, details: sessionDetails(g, s), location: s.location || "" });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

}

// ----- PAGINA SERATE -----
function renderNights() {
  const groups = groupList();
  if (!groups.length) return `<h2>Serate</h2><p class="muted">Qui vedrai in quali serate si può giocare e con quale gruppo. Prima <a href="#" data-action="tab" data-tab="groups">crea o entra in un gruppo</a>.</p>`;
  const opts = monthOptions();
  if (!opts.includes(S.nMonth)) S.nMonth = opts[0];
  if (S.nGroup !== "all" && !S.groups[S.nGroup]) S.nGroup = "all";
  const shown = S.nGroup === "all" ? groups : groups.filter(g => g.id === S.nGroup);
  const [y, m] = S.nMonth.split("-").map(Number);
  const today = todayStr(), dim = new Date(y, m, 0).getDate();
  const sessKey = new Set(allSessions().map(x => x.g.id + "|" + x.s.date));
  const cards = [];
  for (let d = 1; d <= dim; d++) {
    const k = `${y}-${pad(m)}-${pad(d)}`;
    if (k < today) continue;
    const ev = shown.map(g => evalGroup(g, k));
    const rank = { ok: 0, maybe: 1, no: 2 };
    ev.sort((a, b) => rank[a.status] - rank[b.status] || b.pref - a.pref || b.yes.length - a.yes.length || a.g.name.localeCompare(b.g.name));
    const viable = ev.filter(e => e.status !== "no");
    if (S.onlyPossible && !viable.length) continue;
    const list = S.onlyPossible ? viable : ev;
    const best = viable.length >= 2 ? viable[0].g.id : null;
    let overlapNote = "";
    if (viable.length >= 2) {
      const count = {};
      viable.forEach(e => e.counted.forEach(u => { count[u] = (count[u] || 0) + 1; }));
      const shared = Object.keys(count).filter(u => count[u] > 1);
      if (shared.length) {
        const g0 = viable[0].g;
        const names = shared.map(u => nameIn(viable.find(e => e.counted.includes(u)).g, u)).sort();
        overlapNote = `<div class="note">${viable.length} gruppi possibili con persone in comune (${esc(names.join(", "))}): si gioca a uno solo. Consigliato <strong>${esc(g0.name)}</strong>, il gruppo con più voglia di giocare.</div>`;
      }
    }
    const top = viable.some(e => e.status === "ok") ? `<span class="badge go">Si gioca</span>` : viable.length ? `<span class="badge wait">Dipende dai forse</span>` : `<span class="badge stop">Nessun gruppo</span>`;
    cards.push(`<div class="card night">
      <div class="head"><strong>${fmtShort(k)}</strong>${top}</div>
      ${overlapNote ? `<div style="padding:0 14px">${overlapNote}</div>` : ""}
      ${list.map(e => {
        const g = e.g;
        const badge = e.status === "ok" ? `<span class="badge go">Ci sono tutti quelli che servono</span>` : e.status === "maybe" ? `<span class="badge wait">Possibile se i forse confermano</span>` : `<span class="badge stop">Non si può</span>`;
        const chip = (u, cls) => `<span class="chip ${cls}">${esc(nameIn(g, u))}${cls === "maybe" ? " (forse)" : cls === "none" ? " (?)" : ""}</span>`;
        const proposed = sessKey.has(g.id + "|" + k);
        return `<div class="gr ${e.status === "no" ? "dim" : ""}">
          <div class="row between"><div><h3 style="display:inline">${esc(g.name)}</h3> ${best === g.id ? `<span class="badge star">Consigliato</span>` : ""}<div class="small muted">${esc(g.game)} - servono ${e.n} su ${g.members.length}</div></div>${badge}</div>
          <div style="margin:6px 0">${byName(g, e.yes).map(u => chip(u, "yes")).join("")}${byName(g, e.maybe).map(u => chip(u, "maybe")).join("")}${byName(g, e.no).map(u => chip(u, "no")).join("")}${byName(g, e.none).map(u => chip(u, "none")).join("")}</div>
          ${e.status !== "no" ? `<div class="row between"><span class="small muted">Voglia media: ${e.pref.toFixed(1).replace(".", ",")} su 3</span>
            ${proposed ? `<button class="btn sm" data-action="tab" data-tab="agenda">Serata già proposta</button>` : `<button class="btn sm primary" data-action="propose" data-g="${g.id}" data-date="${k}">Proponi la serata</button>`}</div>` : ""}
        </div>`;
      }).join("")}
    </div>`);
  }
  return `
    <h2>Serate</h2>
    <p class="small muted" style="margin-top:-6px">Incrocia le disponibilità di tutti i membri dei tuoi gruppi, sera per sera.</p>
    <div class="row" style="margin-bottom:8px">
      <div style="flex:1;min-width:150px">${monthSelect("nMonthSel", S.nMonth)}</div>
      <div style="flex:1;min-width:150px"><select id="nGroupSel" data-action-change="nGroupSel"><option value="all">Tutti i miei gruppi</option>${groups.map(g => `<option value="${g.id}" ${S.nGroup === g.id ? "selected" : ""}>${esc(g.name)}</option>`).join("")}</select></div>
    </div>
    <div class="row" style="margin-bottom:14px"><button class="btn sm ${S.onlyPossible ? "on" : ""}" data-action="toggleOnly">Solo le serate possibili</button></div>
    ${cards.length ? cards.join("") : `<p class="muted">Nessuna serata possibile in ${monthLabel(S.nMonth).toLowerCase()}. Servono le disponibilità di tutti: controlla in ogni gruppo chi non ha ancora segnato i suoi giorni, oppure prova un altro mese.</p>`}`;
}

// ----- PAGINA AGENDA -----
function renderSessionCard(g, sid, s, past) {
  const i = sessionInfo(g, s);
  const my = (s.rsvps || {})[S.me.uid];
  return `<div class="card">
    <div class="row between"><div><h3>${esc(g.game)}</h3><div class="small muted">Gruppo ${esc(g.name)}</div></div>
      ${past ? "" : i.go ? `<span class="badge go">Si gioca</span>` : `<span class="badge wait">${i.missing === 1 ? "Manca 1 conferma" : `Mancano ${i.missing} conferme`}</span>`}</div>
    <div style="margin-top:6px"><strong>${fmtDate(s.date)}</strong> alle ${esc(s.time || DEFAULT_TIME)}</div>
    ${s.location ? `<div class="muted">${esc(s.location)}</div>` : ""}
    ${s.notes ? `<div class="small" style="margin-top:4px">${esc(s.notes)}</div>` : ""}
    <div style="margin:10px 0">
      ${byName(g, i.yes).map(u => `<span class="chip yes">${esc(nameIn(g, u))}</span>`).join("")}
      ${byName(g, i.pending).map(u => `<span class="chip">${esc(nameIn(g, u))} - in attesa</span>`).join("")}
      ${byName(g, i.no).map(u => `<span class="chip no">${esc(nameIn(g, u))} - non viene</span>`).join("")}
    </div>
    ${past ? "" : `
    <div class="row" style="margin-bottom:8px">
      <button class="btn sm yes ${my === "yes" ? "on" : ""}" data-action="rsvp" data-g="${g.id}" data-s="${sid}" data-v="yes">Ci sono</button>
      <button class="btn sm no ${my === "no" ? "on" : ""}" data-action="rsvp" data-g="${g.id}" data-s="${sid}" data-v="no">Non posso</button>
    </div>
    <div class="row">
      <button class="btn sm" data-action="ics" data-g="${g.id}" data-s="${sid}">Aggiungi al calendario</button>
      <a class="btn sm" href="${esc(gcalLink(g, s))}" target="_blank" rel="noopener">Google Calendar</a>
      ${s.createdBy === S.me.uid ? `<button class="btn sm ghost danger" data-action="deleteSession" data-g="${g.id}" data-s="${sid}">Annulla</button>` : ""}
    </div>`}
  </div>`;
}

function renderAgenda() {
  const today = todayStr(), all = allSessions();
  const up = all.filter(x => x.s.date >= today), past = all.filter(x => x.s.date < today).reverse().slice(0, 10);
  return `
    <div class="row between" style="margin-bottom:12px"><h2 style="margin:0">Agenda</h2>${groupList().length ? `<button class="btn sm primary" data-action="newSession">Nuova serata</button>` : ""}</div>
    ${up.length ? up.map(x => renderSessionCard(x.g, x.sid, x.s, false)).join("") : `<p class="muted">Nessuna serata in programma. Proponine una dalle <a href="#" data-action="tab" data-tab="nights">Serate</a>.</p>`}
    ${past.length ? `<details><summary>Serate passate</summary>${past.map(x => renderSessionCard(x.g, x.sid, x.s, true)).join("")}</details>` : ""}`;
}

// ----- FINESTRE -----
function renderModal() {
  const M = S.modal;
  let inner = "";
  if (M.type === "name") {
    inner = `<h2>Il tuo nome</h2><p class="muted small">È il nome che vedono gli altri nei tuoi gruppi.</p>
      <input id="nameInput" data-keep type="text" value="${esc(S.me.name || "")}">
      <div class="row" style="margin-top:14px"><button class="btn grow" data-action="closeModal">Annulla</button><button class="btn primary grow" data-action="saveName">Salva</button></div>`;
  } else if (M.type === "group") {
    const g = M.gid ? getGroup(M.gid) : null;
    const rule = g?.rule || "all", min = g?.min || 3;
    inner = `<h2>${g ? "Modifica gruppo" : "Nuovo gruppo"}</h2>
      <div class="stack">
        <div><label class="f" for="gName">Nome del gruppo o della campagna</label><input id="gName" data-keep type="text" placeholder="Es. La campagna del giovedì" value="${esc(g?.name || "")}"></div>
        <div><label class="f" for="gGame">Gioco</label><input id="gGame" data-keep type="text" placeholder="Es. Dungeons & Dragons" value="${esc(g?.game || "")}"></div>
        <div><label class="f">Quando si può giocare</label>
          <label class="choice"><input type="radio" name="gRule" id="gRuleAll" data-keep value="all" ${rule === "all" ? "checked" : ""}> Solo se ci sono tutti i membri</label>
          <label class="choice"><input type="radio" name="gRule" id="gRuleMin" data-keep value="min" ${rule === "min" ? "checked" : ""}> Basta un minimo di
            <select id="gMin" data-keep style="width:auto;padding:6px 10px">${[2, 3, 4, 5, 6, 7, 8, 9, 10].map(n => `<option ${n === min ? "selected" : ""}>${n}</option>`).join("")}</select> membri</label>
        </div>
        <div class="err" id="gErr"></div>
        <div class="row"><button class="btn grow" data-action="closeModal">Annulla</button><button class="btn primary grow" data-action="saveGroup">${g ? "Salva" : "Crea gruppo"}</button></div>
      </div>`;
  } else if (M.type === "join") {
    const p = S.pendingJoin || {};
    inner = `<h2>Invito</h2><p>Sei stato invitato nel gruppo <strong>${esc(p.name || "senza nome")}</strong>.</p>
      <p class="small muted">Entrando, gli altri membri vedranno il tuo nome e le tue disponibilità.</p>
      <div class="err" id="jErr"></div>
      <div class="row"><button class="btn grow" data-action="ignoreJoin">Non ora</button><button class="btn primary grow" data-action="doJoin">Unisciti</button></div>`;
  } else if (M.type === "paste") {
    inner = `<h2>Ho un invito</h2><p class="small muted">Incolla qui il link che ti hanno mandato.</p>
      <input id="pasteInput" data-keep type="text" placeholder="https://...#join=...">
      <div class="err" id="pErr"></div>
      <div class="row"><button class="btn grow" data-action="closeModal">Annulla</button><button class="btn primary grow" data-action="usePaste">Continua</button></div>`;
  } else if (M.type === "session") {
    const groups = groupList();
    inner = `<h2>Proponi una serata</h2>
      <div class="stack">
        <div><label class="f" for="sGroup">Gruppo</label><select id="sGroup" data-keep>${groups.map(g => `<option value="${g.id}" ${g.id === M.gid ? "selected" : ""}>${esc(g.name)} - ${esc(g.game)}</option>`).join("")}</select></div>
        <div class="row">
          <div style="flex:1.4"><label class="f" for="sDate">Giorno</label><input id="sDate" data-keep type="date" min="${todayStr()}" max="${LAST_DAY}" value="${esc(M.date || "")}"></div>
          <div style="flex:1"><label class="f" for="sTime">Ora</label><input id="sTime" data-keep type="time" value="${DEFAULT_TIME}"></div>
        </div>
        <div><label class="f" for="sLoc">Dove</label><input id="sLoc" data-keep type="text" placeholder="Es. da Gigi, via Roma 12"></div>
        <div><label class="f" for="sNotes">Note</label><textarea id="sNotes" data-keep placeholder="Es. portate le schede, si cena prima"></textarea></div>
        <div class="err" id="sErr"></div>
        <div class="row"><button class="btn grow" data-action="closeModal">Annulla</button><button class="btn primary grow" data-action="saveSession">Proponi</button></div>
      </div>`;
  }
  return `<div class="overlay" data-action="overlay"><div class="sheet">${inner}</div></div>`;
}

let toastTimer;
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2800);
}

const AUTH_ERRORS = {
  "auth/invalid-email": "Email non valida.",
  "auth/missing-password": "Inserisci la password.",
  "auth/weak-password": "La password deve avere almeno 6 caratteri.",
  "auth/email-already-in-use": "Esiste già un account con questa email: usa Entra.",
  "auth/invalid-credential": "Email o password non corrette.",
  "auth/wrong-password": "Email o password non corrette.",
  "auth/user-not-found": "Email o password non corrette.",
  "auth/popup-closed-by-user": "Accesso annullato.",
  "auth/popup-blocked": "Il browser ha bloccato la finestra di Google. Riprova o usa email e password.",
  "auth/unauthorized-domain": "Questo indirizzo non è autorizzato nel progetto Firebase (vedi README).",
  "auth/too-many-requests": "Troppi tentativi, riprova tra poco.",
};
const authMsg = e => AUTH_ERRORS[e?.code] || "Qualcosa non ha funzionato. Riprova.";

// ---------------------------------------------------------------------
//  AZIONI
// ---------------------------------------------------------------------
async function run(fn) {
  try { await fn(); } catch (e) { console.error(e); toast(e?.code === "permission-denied" ? "Permesso negato: controlla le regole Firestore." : (e?.message || String(e))); }
}
const val = id => (document.getElementById(id)?.value || "").trim();
function clearPending() { try { sessionStorage.removeItem("gp-join"); } catch (e) {} }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Link copiato."); }
  catch (e) { prompt("Copia il link:", text); }
}

document.addEventListener("change", e => {
  const id = e.target.dataset?.actionChange;
  if (id === "monthSel") { S.month = e.target.value; render(); }
  if (id === "nMonthSel") { S.nMonth = e.target.value; render(); }
  if (id === "nGroupSel") { S.nGroup = e.target.value; render(); }
});

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "overlay") { if (e.target === el) { if (S.modal?.type === "join") { S.pendingJoin = null; clearPending(); } S.modal = null; render(); } return; }
  if (el.tagName === "A" && el.getAttribute("href") === "#") e.preventDefault();
  const d = el.dataset;
  const g = S.groupId ? getGroup(S.groupId) : null;

  switch (a) {
    // navigazione
    case "tab": S.tab = d.tab; S.groupId = null; S.modal = null; render(); window.scrollTo(0, 0); break;
    case "openGroup": S.groupId = d.g; render(); window.scrollTo(0, 0); break;
    case "closeGroup": S.groupId = null; render(); break;
    case "closeModal": S.modal = null; render(); break;

    // gruppi
    case "newGroup": S.modal = { type: "group" }; render(); break;
    case "editGroup": S.modal = { type: "group", gid: S.groupId }; render(); break;
    case "saveGroup": {
      const name = val("gName"), game = val("gGame"), rule = document.getElementById("gRuleMin").checked ? "min" : "all", min = +val("gMin") || 3;
      if (!name || !game) { document.getElementById("gErr").textContent = "Scrivi il nome del gruppo e il gioco."; break; }
      const gid = S.modal.gid; S.modal = null;
      if (gid) run(() => store.updateGroup(gid, { name, game, rule, min }));
      else run(async () => { const id = await store.createGroup({ name, game, rule, min }); S.tab = "groups"; S.groupId = id; render(); toast("Gruppo creato: ora invita gli altri."); });
      render();
      break;
    }
    case "setPref": run(() => store.setPref(S.groupId, +d.v)); break;
    case "leaveGroup": if (confirm(`Vuoi uscire dal gruppo "${g.name}"?`)) { const id = S.groupId; S.groupId = null; run(() => store.leaveGroup(id)); } break;
    case "deleteGroup": if (confirm(`Elimini il gruppo "${g.name}" per tutti?`)) { const id = S.groupId; S.groupId = null; run(() => store.deleteGroup(id)); } break;
    case "copyLink": copy(inviteLink(g)); break;
    case "shareLink": navigator.share({ title: "Si gioca?", text: inviteText(g) }).catch(() => {}); break;
    case "inviteEmail": {
      const to = val("invEmail");
      if (!/^\S+@\S+\.\S+$/.test(to)) { toast("Scrivi un indirizzo email valido."); break; }
      location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(`Invito al gruppo ${g.name}`)}&body=${encodeURIComponent(inviteText(g))}`;
      break;
    }
    case "inviteSms": case "inviteWa": {
      const raw = val("invPhone").replace(/[^\d+]/g, "");
      if (raw.replace(/\D/g, "").length < 6) { toast("Scrivi un numero di cellulare valido."); break; }
      if (a === "inviteSms") location.href = `sms:${raw}?&body=${encodeURIComponent(inviteText(g))}`;
      else {
        let n = raw.replace(/\D/g, ""); if (!raw.startsWith("+") && !n.startsWith("00") && n.length <= 10) n = "39" + n; n = n.replace(/^00/, "");
        window.open(`https://wa.me/${n}?text=${encodeURIComponent(inviteText(g))}`, "_blank", "noopener");
      }
      break;
    }

    // inviti
    case "pasteInvite": S.modal = { type: "paste" }; render(); break;
    case "usePaste": {
      const inv = parseInvite(val("pasteInput"));
      if (!inv) { document.getElementById("pErr").textContent = "Questo non sembra un link di invito valido."; break; }
      S.pendingJoin = inv; S.modal = null; render();
      break;
    }
    case "ignoreJoin": S.pendingJoin = null; clearPending(); S.modal = null; render(); break;
    case "doJoin": {
      const p = S.pendingJoin;
      run(async () => {
        try { await store.joinGroup(p.gid, p.code); }
        catch (err) { const box = document.getElementById("jErr"); if (box) box.textContent = err.message; return; }
        S.pendingJoin = null; clearPending(); S.modal = null; S.tab = "groups"; S.groupId = p.gid; render();
        toast("Sei entrato nel gruppo. Segna le tue disponibilità!");
      });
      break;
    }

    // disponibilità
    case "brush": S.brush = d.b; render(); break;
    case "day": {
      const cur = (S.me.days || {})[d.date];
      run(() => store.setDays({ [d.date]: S.brush === "clear" || cur === S.brush ? null : S.brush }));
      break;
    }
    case "fillEmpty": case "bulkWeekend": {
      if (S.brush === "clear") { toast("Scegli prima SI, FORSE o NO."); break; }
      const [y, m] = S.month.split("-").map(Number), map = {}, today = todayStr(), mine = S.me.days || {};
      for (let i = 1; i <= new Date(y, m, 0).getDate(); i++) {
        const dt = new Date(y, m - 1, i), k = ymd(dt), w = dt.getDay();
        if (k < today) continue;
        if (a === "fillEmpty" && !mine[k]) map[k] = S.brush;
        if (a === "bulkWeekend" && (w === 0 || w === 6)) map[k] = S.brush;
      }
      if (Object.keys(map).length) run(() => store.setDays(map));
      break;
    }
    case "clearMonth": {
      const map = {}, today = todayStr();
      for (const k of Object.keys(S.me.days || {})) if (k.startsWith(S.month + "-") && k >= today) map[k] = null;
      if (Object.keys(map).length && confirm("Cancello le tue disponibilità di questo mese?")) run(() => store.setDays(map));
      break;
    }

    // serate
    case "toggleOnly": S.onlyPossible = !S.onlyPossible; render(); break;
    case "propose": S.modal = { type: "session", gid: d.g, date: d.date }; render(); break;
    case "newSession": S.modal = { type: "session", gid: groupList()[0]?.id, date: "" }; render(); break;
    case "saveSession": {
      const gid = val("sGroup"), date = val("sDate"), err = document.getElementById("sErr");
      if (!S.groups[gid]) { err.textContent = "Scegli un gruppo."; break; }
      if (!date || date < todayStr()) { err.textContent = "Scegli un giorno a partire da oggi."; break; }
      const data = { date, time: val("sTime") || DEFAULT_TIME, location: val("sLoc"), notes: val("sNotes") };
      S.modal = null; S.tab = "agenda"; S.groupId = null;
      run(async () => { await store.createSession(gid, data); toast("Serata proposta: ora tocca agli altri confermare."); });
      render();
      break;
    }
    case "rsvp": {
      const s = S.groups[d.g]?.sessions?.[d.s];
      if (s && (s.rsvps || {})[S.me.uid] !== d.v) run(() => store.rsvp(d.g, d.s, d.v));
      break;
    }
    case "ics": { const gg = getGroup(d.g); downloadIcs(gg, d.s, gg.sessions[d.s]); break; }
    case "deleteSession": if (confirm("Annulli questa serata per tutti?")) run(() => store.deleteSession(d.g, d.s)); break;

    // profilo
    case "rename": S.modal = { type: "name" }; render(); break;
    case "saveName": { const n = val("nameInput"); if (!n) break; S.modal = null; run(() => store.setName(n)); render(); break; }
    case "logout": S.modal = null; S.tab = "groups"; S.groupId = null; run(() => store.logout()); break;

    // accesso Firebase
    case "googleIn": S.authErr = ""; store.signInGoogle().catch(e => { S.authErr = authMsg(e); render(); }); break;
    case "emailIn": S.authErr = ""; store.signInEmail(val("authEmail"), val("authPw")).catch(e => { S.authErr = authMsg(e); render(); }); break;
    case "emailUp": S.authErr = ""; store.signUpEmail(val("authEmail"), val("authPw")).catch(e => { S.authErr = authMsg(e); render(); }); break;
    case "resetPw": {
      const em = val("authEmail");
      if (!em) { S.authErr = "Scrivi la tua email qui sopra, poi tocca di nuovo."; render(); break; }
      store.resetPassword(em).then(() => toast("Ti abbiamo mandato un'email per reimpostare la password.")).catch(e => { S.authErr = authMsg(e); render(); });
      break;
    }
    case "resendVerify": store.resendVerification().then(() => toast("Email inviata di nuovo.")).catch(e => { S.authErr = authMsg(e); render(); }); break;
    case "checkVerify": store.checkVerified().then(ok => { if (!ok) { S.authErr = "Non risulta ancora verificata. Apri il link nell'email e riprova."; render(); } }).catch(e => { S.authErr = authMsg(e); render(); }); break;

    // demo
    case "demoAs": store.loginAs(d.u); break;
    case "demoNew": { const n = val("demoName"); if (!n) { toast("Scrivi un nome."); break; } store.createUser(n); break; }
    case "demoSeed": store.seed(); S.tab = "nights"; S.nMonth = "2026-10" >= curMonth() ? "2026-10" : curMonth(); render(); break;
    case "demoReset": if (confirm("Cancello tutti i dati della demo?")) store.reset(); break;
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.modal) { S.modal = null; render(); }
  if (e.key !== "Enter") return;
  const map = { demoName: "demoNew", nameInput: "saveName", authPw: "emailIn", pasteInput: "usePaste", gName: "saveGroup", gGame: "saveGroup" };
  const act = map[e.target.id];
  if (act) document.querySelector(`[data-action="${act}"]`)?.click();
});

// ---------------------------------------------------------------------
//  AVVIO
// ---------------------------------------------------------------------
(async () => {
  let inv = parseInvite(location.hash);
  if (inv) { try { sessionStorage.setItem("gp-join", JSON.stringify(inv)); } catch (e) {} history.replaceState(null, "", location.pathname + location.search); }
  else { try { inv = JSON.parse(sessionStorage.getItem("gp-join") || "null"); } catch (e) {} }
  S.pendingJoin = inv;
  try {
    store = FIREBASE_CONFIG ? await makeFirebaseStore(FIREBASE_CONFIG) : makeLocalStore();
  } catch (e) {
    console.error(e);
    $("#app").innerHTML = `<div class="auth"><h1>Ops</h1><p>Non riesco a collegarmi a Firebase. Controlla la configurazione in index.html e la connessione.</p></div>`;
    return;
  }
  store.start(data => { Object.assign(S, data); render(); });
})();
</script>
