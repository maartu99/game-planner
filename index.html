<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b6d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Planner">
<title>Game Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b6d4f'/%3E%3Ccircle cx='22' cy='22' r='6' fill='%23a5f3cd'/%3E%3Ccircle cx='42' cy='42' r='6' fill='%23a5f3cd'/%3E%3Ccircle cx='42' cy='22' r='6' fill='%23a5f3cd'/%3E%3Ccircle cx='22' cy='42' r='6' fill='%23a5f3cd'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<style>
/* ===== Design system "Tavolo & Dadi" ===== */
:root{
  --bg:#f8faf9; --surface:#ffffff; --surface-2:#f0f5f2; --surface-3:#e9eef5;
  --line:#e2e8f0; --line-2:#cbd5e1; --text:#1e2429; --muted:#5b6670; --faint:#94a3b8;
  --primary:#1b6d4f; --primary-dark:#00533a; --shelf:#124935; --primary-soft:#e3f1ea; --on-primary:#ffffff;
  --brass:#d9822b; --brass-dark:#8f4e00; --brass-soft:#fef3c7; --brass-line:#f2c48f; --brass-text:#78350f;
  --indigo:#6352a0; --indigo-soft:#f3f0ff; --indigo-line:#ddd6fe; --indigo-text:#5b21b6;
  --yes:#10b981; --yes-bg:#ecfdf5; --yes-line:#a7f3d0; --yes-text:#065f46;
  --maybe:#f59e0b; --maybe-bg:#fffbeb; --maybe-line:#fde68a; --maybe-text:#92400e; --maybe-fill:#fea047; --maybe-on:#4a2700;
  --no:#e11d48; --no-bg:#fff1f2; --no-line:#fecdd3; --no-text:#9f1239;
  --busy:#64748b; --busy-bg:#f1f5f9;
  --sh1:0 1px 3px 0 rgba(30,36,41,.05),0 1px 2px -1px rgba(30,36,41,.05);
  --sh2:0 8px 16px -4px rgba(27,109,79,.08),0 4px 6px -2px rgba(30,36,41,.04);
  --sh3:0 20px 25px -5px rgba(30,36,41,.12),0 10px 10px -5px rgba(30,36,41,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111614; --surface:#1a201d; --surface-2:#212925; --surface-3:#26302b;
    --line:#2c3632; --line-2:#3a4641; --text:#e8eeeb; --muted:#a2aea8; --faint:#6d7a74;
    --primary:#3fae84; --primary-dark:#2f8a64; --shelf:#174d38; --primary-soft:#1d3329; --on-primary:#06231a;
    --brass:#f0a25a; --brass-dark:#ffb77a; --brass-soft:#3a2a14; --brass-line:#6d4a1e; --brass-text:#ffd9a8;
    --indigo:#b3a5f0; --indigo-soft:#2a2540; --indigo-line:#433a6b; --indigo-text:#d6ccff;
    --yes:#34d399; --yes-bg:#123026; --yes-line:#1f5a45; --yes-text:#9ff0cc;
    --maybe:#fbbf24; --maybe-bg:#33270f; --maybe-line:#6b4e14; --maybe-text:#fde3a1; --maybe-fill:#e58f3a; --maybe-on:#2b1600;
    --no:#fb7185; --no-bg:#3a1820; --no-line:#6b2a39; --no-text:#ffc2cc;
    --busy:#94a3b8; --busy-bg:#262d33;
    --sh1:none; --sh2:none; --sh3:0 20px 40px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;vertical-align:middle;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 500;flex:none}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 500}
.ms.s14{font-size:14px}.ms.s16{font-size:16px}.ms.s18{font-size:18px}.ms.s24{font-size:24px}.ms.s28{font-size:28px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.small{font-size:14px;line-height:20px}
.xs{font-size:12px;line-height:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.nowrap{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1,h2,h3{margin:0;letter-spacing:-.02em}
.page-title{font-size:26px;line-height:32px;font-weight:800;letter-spacing:-.02em}
.page-sub{color:var(--muted);font-size:14px;margin:4px 0 16px}
.t-lg{font-size:18px;line-height:26px;font-weight:700}
.t-md{font-size:16px;line-height:24px;font-weight:600}
.label{font-size:11px;line-height:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.section{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:24px 0 10px}
.section h3{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}

/* header */
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:8px}
.brandbox{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:var(--primary);color:#fff;display:grid;place-items:center;box-shadow:0 2px 0 var(--shelf);flex:none}
.logo .ms{font-size:24px;color:#a5f3cd}
.brand{font-weight:800;font-size:18px;line-height:20px;color:var(--primary-dark)}
.brand-sub{font-size:12px;font-weight:600;color:var(--text)}
.tag-demo{font-size:10px;font-weight:800;letter-spacing:.06em;background:var(--brass-soft);color:var(--brass-text);border:1px solid var(--brass-line);border-radius:6px;padding:1px 6px;margin-left:6px}
.hbtn{position:relative;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;border:0;background:var(--surface-3);font-weight:700;font-size:13px}
.hbtn .dot{min-width:18px;height:18px;border-radius:9px;background:var(--no);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--indigo-soft);color:var(--indigo-text);border:2px solid var(--brass);display:grid;place-items:center;font-weight:800;font-size:15px;padding:0;flex:none}
.linkbtn{background:none;border:0;padding:4px;color:var(--brass-dark);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.demo-bar{background:var(--surface-3);color:var(--text);font-size:12px;font-weight:600;text-align:center;padding:6px 16px;display:flex;align-items:center;justify-content:center;gap:6px}
.demo-bar .ms{color:var(--no)}
main{padding:12px 0 110px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh1);margin-bottom:14px}
.card.click{cursor:pointer;transition:box-shadow .15s,border-color .15s}
.card.click:hover{box-shadow:var(--sh2);border-color:color-mix(in srgb,var(--primary) 30%,var(--line))}
.card.flush{padding:0;overflow:hidden}
.panel{background:var(--surface-2);border-radius:14px;padding:14px}
.foot{background:var(--surface-2);border-top:1px solid var(--line);padding:12px 16px}
.inset{background:var(--surface-3);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);color:var(--text);font-weight:700;font-size:15px;text-decoration:none;text-align:center;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff;box-shadow:0 2px 0 var(--shelf)}
.btn.primary:active{transform:translateY(2px);box-shadow:none}
.btn.brass{background:var(--brass-dark);border-color:var(--brass-dark);color:#fff;box-shadow:0 2px 0 #5c3200}
.btn.brass-soft{background:#ffdcc2;border-color:#ffdcc2;color:#4a2400}
.btn.soft{background:var(--surface-3);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--no);border-color:var(--no-line);background:var(--surface)}
.btn.danger-soft{background:var(--no-bg);border-color:transparent;color:var(--no-text)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.lg{min-height:52px;font-size:16px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn.on{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff}
.textlink{background:none;border:0;padding:6px;font-weight:700;font-size:14px;color:var(--primary-dark)}
.textlink.danger{color:var(--no)}

/* chips & badges */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;background:var(--surface-3);color:var(--text);border:1px solid transparent;line-height:18px}
button.chip{cursor:pointer}
.chip.admin{background:var(--yes-bg);color:var(--yes-text);border-color:var(--yes-line)}
.chip.yes{background:var(--yes-bg);color:var(--yes-text);border-color:var(--yes-line)}
.chip.maybe{background:var(--maybe-bg);color:var(--maybe-text);border-color:var(--maybe-line)}
.chip.no{background:var(--no-bg);color:var(--no-text);border-color:var(--no-line)}
.chip.busy{background:var(--no-bg);color:var(--no-text);border-color:var(--no-line);border-style:dashed}
.chip.none{background:transparent;color:var(--muted);border:1px dashed var(--line-2)}
.chip.sel{background:var(--primary-dark);color:#fff}
.chip .n{opacity:.7;font-weight:600;margin-left:2px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent;line-height:16px}
.pill.ok{background:#a5f3cd;color:var(--primary-dark)}
.pill.go{background:var(--yes-bg);color:var(--yes-text);border-color:var(--yes-line)}
.pill.wait{background:var(--maybe-bg);color:var(--maybe-text);border-color:var(--maybe-line)}
.pill.orange{background:var(--maybe-fill);color:var(--maybe-on)}
.pill.stop{background:var(--no-bg);color:var(--no-text);border-color:var(--no-line)}
.pill.star{background:var(--brass-soft);color:var(--brass-text);border-color:var(--brass);text-transform:uppercase;font-size:11px;letter-spacing:.04em;font-weight:800}
.pill.kind{background:var(--indigo-soft);color:var(--indigo-text);border-color:var(--indigo-line)}
.pill.kind.board{background:#ffe4cc;color:#7a3d00;border-color:#ffc89a}
.pill.kind.cards{background:var(--yes-bg);color:var(--yes-text);border-color:var(--yes-line)}
.pill.count{background:var(--surface);color:var(--text);border-color:var(--line)}
.pill.fatta{background:#a5f3cd;color:var(--primary-dark);font-weight:800;font-size:11px;letter-spacing:.04em}
.ctr{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;background:var(--surface-3);font-size:13px;font-weight:800;padding:0 7px}

/* notes */
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--surface-3);border-radius:14px;padding:14px;margin-bottom:14px}
.tip .ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:#ffdcc2;color:var(--brass-dark);flex:none}
.tip .ttl{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--brass-dark)}
.warn{display:flex;gap:10px;background:#ffeadb;color:#4a2400;border-radius:12px;padding:12px;font-size:14px;line-height:20px}
.warn .ttl{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.warn .ms{color:var(--brass-dark)}
@media (prefers-color-scheme: dark){.warn{background:#3a2716;color:#ffdcc2}.tip .ico{background:#4a2e14}}
.noteblk{background:#fff4e8;border-radius:12px;padding:12px;font-size:14px}
.noteblk .label{color:var(--brass-dark);display:flex;align-items:center;gap:6px}
@media (prefers-color-scheme: dark){.noteblk{background:#33261a}}
.info{background:var(--primary-soft);color:var(--text);border-radius:12px;padding:12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.info .ms{color:var(--primary)}
.banner-act{display:flex;align-items:center;gap:12px;background:#ffeadb;border-radius:14px;padding:12px;margin-bottom:14px}
.banner-act .ico{width:40px;height:40px;border-radius:50%;background:var(--maybe-fill);color:#fff;display:grid;place-items:center;flex:none}
@media (prefers-color-scheme: dark){.banner-act{background:#33261a}}
.err{color:var(--no);font-size:14px;min-height:20px;font-weight:600}

/* forms */
label.f{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.field{position:relative}
.field .ms.lead{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.field .trail{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);padding:6px}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=time],input[type=date],select,textarea{
  width:100%;min-height:48px;border:1.5px solid var(--line);background:var(--surface-3);border-radius:12px;padding:10px 14px;font-size:16px;outline:none}
.field input{padding-left:42px}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 25%,transparent);background:var(--surface)}
textarea{min-height:84px;resize:vertical}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.selbox{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px 12px}
.selbox .label{display:block;margin-bottom:0}
.selbox select{border:0;background-color:transparent;min-height:34px;padding:0 30px 0 0;font-size:16px;font-weight:600;background-position:calc(100% - 10px) 14px,calc(100% - 5px) 14px}
.selbox select:focus{box-shadow:none}
.choice{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin-top:8px;font-weight:600}
.choice input{width:20px;height:20px;accent-color:var(--primary);margin:0}
.switch{width:52px;height:30px;border-radius:15px;border:0;background:var(--line-2);position:relative;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--primary-dark)}
.switch.on::after{left:25px}
.seg{display:flex;gap:4px;background:var(--surface-3);border-radius:12px;padding:4px}
.seg button{flex:1;white-space:nowrap;padding:0 6px;border:0;background:transparent;border-radius:9px;min-height:36px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--text)}
.seg button.on{background:var(--primary-dark);color:#fff;box-shadow:0 2px 0 var(--shelf)}
.seg button.on.no{background:var(--no);box-shadow:none}
.seg button.on.maybe{background:var(--maybe-fill);color:var(--maybe-on);box-shadow:none}

/* calendar */
.calnav{display:flex;gap:8px;align-items:center}
.calnav .nav{width:40px;height:44px;border-radius:12px;border:0;background:var(--surface-3);display:grid;place-items:center;flex:none}
.calnav .nav:disabled{opacity:.35}
.calnav select{flex:1;min-width:0;font-weight:700;font-size:16px;background-color:var(--surface-3);border-color:transparent;padding:0 24px 0 10px;background-position:calc(100% - 14px) 21px,calc(100% - 9px) 21px}
.today-btn{height:44px;border-radius:12px;border:0;background:#a5f3cd;color:var(--primary-dark);font-weight:700;padding:0 10px;display:inline-flex;align-items:center;gap:6px;flex:none}
.brushes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-3);border-radius:14px;padding:4px}
.brushes button{border:0;background:transparent;border-radius:11px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text)}
.brushes button b{display:flex;align-items:center;gap:4px;font-size:14px}
.brushes button small{font-size:11px;color:var(--muted);font-weight:600}
.brushes button.on{background:var(--primary-dark);color:#fff;box-shadow:0 2px 0 var(--shelf)}
.brushes button.on small{color:#c7f0dc}
.brushes button.on.b-maybe{background:var(--maybe-fill);color:var(--maybe-on);box-shadow:none}
.brushes button.on.b-maybe small{color:var(--maybe-on)}
.brushes button.on.b-no{background:var(--no);color:#fff;box-shadow:none}
.brushes button.on.b-no small{color:#ffe4e9}
.brushes button.on.b-clear{background:var(--text);color:var(--bg);box-shadow:none}
.brushes button.on.b-clear small{color:var(--bg)}
.calcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px;box-shadow:var(--sh1)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow div{text-align:center;font-size:13px;color:var(--muted);font-weight:700;padding-bottom:6px}
.dow div.we{color:var(--brass-dark)}
.day{min-height:64px;border:0;background:var(--surface-2);border-radius:10px;position:relative;padding:5px 4px;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;text-align:left;font-size:15px;font-weight:700;color:var(--text)}
.day.we{background:color-mix(in srgb,var(--surface-3) 70%,var(--surface-2))}
.day .n{padding-left:3px}
.day.we .n{color:var(--brass-dark)}
.day .st{display:block;text-align:center;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.02em;padding:3px 0}
.day .st.yes{background:var(--primary-dark);color:#fff}
.day .st.maybe{background:var(--maybe-fill);color:var(--maybe-on)}
.day .st.no{background:var(--no-line);color:var(--no-text)}
.day.today{background:#ffeadb;outline:2px solid var(--brass);outline-offset:-2px}
@media (prefers-color-scheme: dark){.day.today{background:#3a2716}}
.day .oggi{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;background:var(--brass-dark);color:#fff;border-radius:4px;padding:1px 4px}
.day:disabled{background:transparent;color:var(--faint);cursor:default}
.day:disabled .n{color:var(--faint)}
.day:disabled .past{font-size:10px;font-weight:600;text-align:center;color:var(--faint)}
.day.out{visibility:hidden}
.bar{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary-dark);border-radius:4px}
.legend-dots{display:flex;gap:16px;font-size:13px;font-weight:700;flex-wrap:wrap}
.legend-dots span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend-dots .l-yes::before{background:var(--primary-dark)}
.legend-dots .l-maybe::before{background:var(--maybe-fill)}
.legend-dots .l-no::before{background:var(--no)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick .btn{background:var(--surface-3);border-color:transparent;min-height:52px}

/* groups */
.gcard{padding:0;overflow:hidden}
.gcard .body{padding:16px}
.gico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:none}
.gico .ms{font-size:26px}
.gico.c0{background:var(--indigo-soft);color:var(--indigo)}
.gico.c1{background:#ffe4cc;color:var(--brass-dark)}
.gico.c2{background:#a5f3cd;color:var(--primary-dark)}
.gico.c3{background:var(--surface-3);color:var(--text)}
.voglia{font-weight:700;color:var(--brass-dark)}

<script type="module">
// =====================================================================
//  CONFIGURAZIONE
//  Incolla qui sotto la configurazione del tuo progetto Firebase

// =====================================================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBGCaa8G2cqa510DRLMeLLu00uaMecBVek",
  authDomain: "game-planner-e876c.firebaseapp.com",
  projectId: "game-planner-e876c",
  storageBucket: "game-planner-e876c.firebasestorage.app",
  messagingSenderId: "59521254363",
  appId: "1:59521254363:web:60075d83d26fc8ca2c5dfe",
};
const DEFAULT_TIME = "21:00";
const SESSION_HOURS = 3;
const LAST_YEAR = 2029;
// =====================================================================

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const MONTHS = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const DOW = ["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const fmtDate = s => cap(parseYmd(s).toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long", year: "numeric" }));
const fmtShort = s => cap(parseYmd(s).toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" }));
const todayStr = () => ymd(new Date());
const LAST_DAY = `${LAST_YEAR}-12-31`;
const curMonth = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const PREFS = { 3: "Tanta voglia", 2: "Normale", 1: "Poca voglia" };
const STATUS = { yes: "Ci sono", maybe: "Forse", no: "Non ci sono" };

function monthOptions() {
  const out = []; const d = new Date(); d.setDate(1);
  while (d.getFullYear() <= LAST_YEAR) { out.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`); d.setMonth(d.getMonth() + 1); }
  return out;
}
const monthLabel = ym => { const [y, m] = ym.split("-").map(Number); return `${MONTHS[m - 1]} ${y}`; };

function parseInvite(str) {
  const m = String(str || "").match(/join=([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)(?:&n=([^&\s#]*))?/);
  if (!m) return null;
  let name = ""; try { name = m[3] ? decodeURIComponent(m[3]) : ""; } catch (e) {}
  return { gid: m[1], code: m[2], name };
}

const S = {
  authState: "loading", me: null, groups: {}, demoUsers: [],
  tab: "groups", groupId: null, brush: "yes",
  month: curMonth(), nMonth: curMonth(), nGroup: "all", onlyPossible: true,
  hGame: "all", hYear: "all", hMonth: "all", hGroup: "all",
  modal: null, authErr: "", pendingJoin: null,
};
let store = null;

// ---------------------------------------------------------------------
//  STORE DEMO (localStorage)
// ---------------------------------------------------------------------
function makeLocalStore() {
  const KEY = "gameplanner-demo-v2";
  let db = null;
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  db = db || { users: {}, groups: {}, current: null };
  let listener = () => {};
  const emit = () => {
    const uid = db.current, u = uid && db.users[uid];
    const me = u ? { uid, name: u.name, email: u.email || "", days: u.days || {}, seenAt: u.seenAt || 0 } : null;
    const groups = {};
    if (me) for (const [gid, g] of Object.entries(db.groups)) {
      if (!g.members.includes(uid)) continue;
      const names = {}, avail = {}, emails = {};
      for (const m of g.members) { names[m] = db.users[m]?.name || "?"; avail[m] = db.users[m]?.days || {}; emails[m] = db.users[m]?.email || ""; }
      groups[gid] = { ...g, names, emails, avail, sessions: g.sessions || {} };
    }
    listener({ me, groups, authState: me ? "ready" : "signedOut", demoUsers: Object.entries(db.users).map(([id, x]) => ({ id, name: x.name })) });
  };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} emit(); };
  const id = () => Math.random().toString(36).slice(2, 10);
  const G = gid => db.groups[gid];
  return {
    demo: true,
    start(fn) { listener = fn; emit(); },
    loginAs(u) { db.current = u; save(); },
    createUser(name) { const u = "u_" + id(); db.users[u] = { name, days: {} }; db.current = u; save(); },
    logout() { db.current = null; save(); },
    setName(n) { db.users[db.current].name = n; save(); },
    setDays(map) { const d = db.users[db.current].days ||= {}; for (const [k, v] of Object.entries(map)) { if (v) d[k] = v; else delete d[k]; } save(); },
    createGroup(data) { const gid = "g" + id(); db.groups[gid] = { ...data, members: [db.current], admins: [db.current], prefs: { [db.current]: 2 }, inviteCode: id(), createdBy: db.current, sessions: {} }; save(); return gid; },
    updateGroup(gid, p) { Object.assign(G(gid), p); save(); },
    joinGroup(gid, code) {
      const g = G(gid);
      if (!g || g.inviteCode !== code) throw new Error("Invito non valido o gruppo non più esistente.");
      if (!g.members.includes(db.current)) g.members.push(db.current);
      g.prefs[db.current] ??= 2; save();
    },
    removeMember(gid, u) { const g = G(gid); g.members = g.members.filter(x => x !== u); g.admins = (g.admins || []).filter(x => x !== u); delete g.prefs[u]; save(); },
    leaveGroup(gid) { this.removeMember(gid, db.current); },
    setAdmin(gid, u, on) { const g = G(gid); g.admins = (g.admins || []).filter(x => x !== u); if (on) g.admins.push(u); save(); },
    deleteGroup(gid) { delete db.groups[gid]; save(); },
    setPref(gid, v) { G(gid).prefs[db.current] = v; save(); },
    markSeen() { db.users[db.current].seenAt = Date.now(); save(); },
    confirmSession(gid, data) { G(gid).sessions["s" + id()] = { ...data, createdBy: db.current, confirmedBy: db.current, confirmedAt: Date.now(), rsvps: { [db.current]: "yes" } }; save(); },
    rsvp(gid, sid, v) { G(gid).sessions[sid].rsvps[db.current] = v; save(); },
    deleteSession(gid, sid) { delete G(gid).sessions[sid]; save(); },
    reset() { db = { users: {}, groups: {}, current: null }; save(); },
    seed() {
      // Dati di ottobre 2026 presi dal foglio "QUANDO GIOCARE" (s = si, n = no, f = forse)
      const october = {
        Gigi:    "nnnnssssssssssssnssssnssssssssn",
        Mattia:  "nnnnsnnsnnnssnsnnnssnsnnnssnsnn",
        Roberto: "sssssssssssssssssssssssssssssss",
        Iole:    "sssssssssssssssssssssssssssssss",
        Gian:    "ssnnsnsssnnsssssnnsssssnnsssssn",
        Fabiola: "nnnnssnsnsnssnnssssnnsnsnssnnns",
      };
      db = { users: {}, groups: {}, current: null };
      const ids = {};
      let r = 11; const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647;
      for (const [name, str] of Object.entries(october)) {
        const uid = "u_" + name.toLowerCase(); ids[name] = uid;
        const days = {};
        [...str].forEach((c, i) => { days[`2026-10-${pad(i + 1)}`] = c === "s" ? "yes" : c === "f" ? "maybe" : "no"; });
        const d = new Date(2026, 10, 1);
        while (d < new Date(2027, 1, 1)) {
          const x = rnd(), w = d.getDay(), k = ymd(d);
          const base = name === "Roberto" || name === "Iole" ? .85 : (w === 0 || w === 6) ? .45 : .6;
          days[k] = x < base ? "yes" : x < base + .12 ? "maybe" : "no";
          d.setDate(d.getDate() + 1);
        }
        db.users[uid] = { name, days, email: name.toLowerCase() + "@esempio.it", seenAt: 0 };
      }
      const mk = (gid, name, game, who, prefs, admins, past) => {
        const members = who.map(n => ids[n]); const p = {};
        members.forEach((m, i) => { p[m] = prefs[i]; });
        const sessions = {};
        past.forEach(([date, place, absent], i) => {
          const rsvps = {}; members.forEach(m => { rsvps[m] = "yes"; });
          if (absent) rsvps[ids[absent]] = "no";
          const [y, m, d] = date.split("-").map(Number);
          sessions[gid + "p" + i] = { date, time: "21:00", location: place, notes: "", createdBy: ids[admins[0]], confirmedBy: ids[admins[0]], confirmedAt: Date.UTC(y, m - 1, d - 3), rsvps };
        });
        db.groups[gid] = { name, game, kind: gid === "gSB" || gid === "gFM" ? "board" : "gdr", rule: "all", min: 2, members, admins: admins.map(n => ids[n]), prefs: p, inviteCode: "demo" + gid, createdBy: ids[admins[0]], sessions };
      };
      mk("gLUT", "L'Ultima Torcia", "Ultima Torcia", ["Gigi", "Mattia", "Roberto", "Iole", "Gian"], [3, 3, 2, 3, 2], ["Mattia"],
        [["2025-11-14", "da Gigi"], ["2025-12-05", "da Iole"], ["2026-02-20", "da Gigi"], ["2026-04-17", "da Roberto", "Gian"], ["2026-06-12", "da Iole"], ["2026-10-05", "da Gigi"], ["2026-10-12", "da Iole"]]);
      mk("gSB", "Set Base", "Set Base", ["Mattia", "Iole", "Gian"], [2, 2, 3], ["Gian"],
        [["2026-03-07", "da Gian"], ["2026-07-18", "da Mattia"], ["2026-10-08", "da Gian"]]);
      mk("gDND", "Campagna D&D", "Dungeons & Dragons", ["Gigi", "Mattia", "Roberto", "Iole", "Gian", "Fabiola"], [2, 3, 3, 2, 2, 3], ["Mattia", "Fabiola"],
        [["2025-09-20", "da Fabiola"], ["2025-10-25", "da Mattia"], ["2025-12-27", "da Fabiola", "Iole"], ["2026-01-24", "da Mattia"], ["2026-05-09", "da Fabiola"], ["2026-09-19", "da Mattia"], ["2026-10-13", "da Mattia"]]);
      mk("gFM", "Fan Made", "Fan Made", ["Gigi", "Roberto", "Iole", "Gian"], [3, 2, 2, 3], ["Gigi"], [["2026-10-09", "da Roberto"], ["2026-10-16", "da Roberto"]]);
      db.current = ids.Mattia;
      save();
    },
  };
}

// ---------------------------------------------------------------------
//  STORE FIREBASE
// ---------------------------------------------------------------------
async function makeFirebaseStore(cfg) {
  const V = "10.12.2";
  const [{ initializeApp }, A, F] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
  ]);
  const app = initializeApp(cfg);
  const auth = A.getAuth(app);
  auth.languageCode = "it";
  const db = F.getFirestore(app);
  let listener = () => {}, uid = null, email = "", authState = "loading", meDoc = null;
  let base = []; const per = {}; const raw = {};
  const emit = () => {
    const groups = {};
    for (const [gid, r] of Object.entries(raw)) if (r.doc) groups[gid] = { prefs: {}, names: {}, ...r.doc, avail: r.avail, sessions: r.sessions };
    listener({ authState, authEmail: email, groups, me: authState === "ready" && meDoc ? { uid, email, days: {}, ...meDoc } : null });
  };
  const onErr = e => { console.error(e); emit(); };
  const dropGroup = g => { (per[g] || []).forEach(u => u()); delete per[g]; delete raw[g]; };
  const stopAll = () => { base.forEach(u => u()); base = []; Object.keys(per).forEach(dropGroup); Object.keys(raw).forEach(g => delete raw[g]); meDoc = null; };

  function watchGroup(g) {
    if (per[g]) return;
    per[g] = [
      F.onSnapshot(F.collection(db, "groups", g, "availability"), s => { const o = {}; s.forEach(d => { o[d.id] = d.data().days || {}; }); if (raw[g]) { raw[g].avail = o; emit(); } }, onErr),
      F.onSnapshot(F.collection(db, "groups", g, "sessions"), s => { const o = {}; s.forEach(d => { o[d.id] = { rsvps: {}, ...d.data() }; }); if (raw[g]) { raw[g].sessions = o; emit(); } }, onErr),
    ];
  }

  async function handleUser(user) {
    stopAll();
    if (!user) { uid = null; email = ""; authState = "signedOut"; return emit(); }
    email = (user.email || "").toLowerCase();
    const isPassword = user.providerData.some(p => p.providerId === "password");
    if (isPassword && !user.emailVerified) { uid = null; authState = "unverified"; return emit(); }
    uid = user.uid;
    const ref = F.doc(db, "users", uid);
    try {
      const s = await F.getDoc(ref);
      if (!s.exists()) await F.setDoc(ref, { name: user.displayName || email.split("@")[0], email, days: {} });
    } catch (e) { console.error(e); authState = "error"; return emit(); }
    authState = "ready";
    base.push(F.onSnapshot(ref, s => { meDoc = s.data() || {}; emit(); }, onErr));
    base.push(F.onSnapshot(F.query(F.collection(db, "groups"), F.where("members", "array-contains", uid)), s => {
      const ids = new Set();
      s.forEach(d => { ids.add(d.id); (raw[d.id] ||= { avail: {}, sessions: {} }).doc = d.data(); watchGroup(d.id); });
      for (const g of Object.keys(raw)) if (!ids.has(g)) dropGroup(g);
      emit();
    }, onErr));
    emit();
  }

  const myIds = () => Object.keys(raw).filter(g => raw[g].doc);
  const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => "abcdefghijkmnpqrstuvwxyz23456789"[b % 32]).join("");

  return {
    demo: false,
    start(fn) { listener = fn; emit(); A.onAuthStateChanged(auth, handleUser); },
    signInGoogle: () => A.signInWithPopup(auth, new A.GoogleAuthProvider()),
    signInEmail: (e, p) => A.signInWithEmailAndPassword(auth, e, p),
    async signUpEmail(e, p) { const c = await A.createUserWithEmailAndPassword(auth, e, p); await A.sendEmailVerification(c.user); },
    resendVerification: () => A.sendEmailVerification(auth.currentUser),
    async checkVerified() { await auth.currentUser.reload(); await auth.currentUser.getIdToken(true); await handleUser(auth.currentUser); return auth.currentUser.emailVerified; },
    resetPassword: e => A.sendPasswordResetEmail(auth, e),
    logout: () => A.signOut(auth),
    async setName(n) {
      const b = F.writeBatch(db);
      b.update(F.doc(db, "users", uid), { name: n });
      for (const g of myIds()) b.update(F.doc(db, "groups", g), { ["names." + uid]: n });
      await b.commit();
    },
    async setDays(map) {
      const days = {}; for (const [k, v] of Object.entries(map)) days[k] = v || F.deleteField();
      const b = F.writeBatch(db);
      b.set(F.doc(db, "users", uid), { days }, { merge: true });
      for (const g of myIds()) b.set(F.doc(db, "groups", g, "availability", uid), { days }, { merge: true });
      await b.commit();
    },
    async createGroup(data) {
      const ref = F.doc(F.collection(db, "groups"));
      await F.setDoc(ref, { ...data, members: [uid], admins: [uid], names: { [uid]: meDoc?.name || "" }, emails: { [uid]: email }, prefs: { [uid]: 2 }, inviteCode: rid(), createdBy: uid, createdAt: F.serverTimestamp() });
      await F.setDoc(F.doc(db, "groups", ref.id, "availability", uid), { days: meDoc?.days || {} });
      return ref.id;
    },
    updateGroup: (gid, p) => F.updateDoc(F.doc(db, "groups", gid), p),
    async joinGroup(gid, code) {
      try {
        await F.updateDoc(F.doc(db, "groups", gid), { members: F.arrayUnion(uid), ["names." + uid]: meDoc?.name || "", ["emails." + uid]: email, ["prefs." + uid]: 2, joinCode: code });
      } catch (e) {
        throw new Error(e.code === "permission-denied" || e.code === "not-found" ? "Invito non valido o gruppo non più esistente." : e.message);
      }
      await F.setDoc(F.doc(db, "groups", gid, "availability", uid), { days: meDoc?.days || {} });
    },
    async removeMember(gid, u) {
      await F.deleteDoc(F.doc(db, "groups", gid, "availability", u));
      await F.updateDoc(F.doc(db, "groups", gid), { members: F.arrayRemove(u), admins: F.arrayRemove(u), ["names." + u]: F.deleteField(), ["emails." + u]: F.deleteField(), ["prefs." + u]: F.deleteField() });
    },
    leaveGroup(gid) { return this.removeMember(gid, uid); },
    setAdmin: (gid, u, on) => F.updateDoc(F.doc(db, "groups", gid), { admins: on ? F.arrayUnion(u) : F.arrayRemove(u) }),
    deleteGroup: gid => F.deleteDoc(F.doc(db, "groups", gid)),
    setPref: (gid, v) => F.updateDoc(F.doc(db, "groups", gid), { ["prefs." + uid]: v }),
    markSeen: () => F.updateDoc(F.doc(db, "users", uid), { seenAt: Date.now() }),
    confirmSession: (gid, d) => F.addDoc(F.collection(db, "groups", gid, "sessions"), { ...d, createdBy: uid, confirmedBy: uid, confirmedAt: Date.now(), rsvps: { [uid]: "yes" } }),
    rsvp: (gid, sid, v) => F.updateDoc(F.doc(db, "groups", gid, "sessions", sid), { ["rsvps." + uid]: v }),
    deleteSession: (gid, sid) => F.deleteDoc(F.doc(db, "groups", gid, "sessions", sid)),
  };
}

const groupList = () => Object.entries(S.groups).map(([id, g]) => ({ id, ...g })).sort((a, b) => (a.name || "").localeCompare(b.name || ""));
const getGroup = id => S.groups[id] ? { id, ...S.groups[id] } : null;
const nameIn = (g, u) => u === S.me.uid ? (S.me.name || "Tu") : (g.names?.[u] || "Qualcuno");
const prefOf = (g, u) => g.prefs?.[u] || 2;
const dayOf = (g, u, d) => u === S.me.uid ? (S.me.days || {})[d] : (g.avail?.[u] || {})[d];
const need = g => g.rule === "min" ? Math.min(g.min || 2, g.members.length) : g.members.length;
const ruleText = g => g.rule === "min" ? `Si gioca con almeno ${g.min} membri` : "Si gioca solo se ci sono tutti";
const byName = (g, list) => [...list].sort((a, b) => nameIn(g, a).localeCompare(nameIn(g, b)));

const adminsOf = g => g.admins || [g.createdBy];
const isAdmin = (g, u = S.me.uid) => adminsOf(g).includes(u);

// Chi quella sera è già impegnato in una serata confermata di un altro gruppo
function busyOn(d, exceptGid) {
  const busy = {};
  for (const x of allSessions()) {
    if (x.s.date !== d || x.g.id === exceptGid) continue;
    for (const u of x.g.members) if ((x.s.rsvps || {})[u] !== "no") busy[u] = x.g.name;
  }
  return busy;
}

function evalGroup(g, d) {
  const by = { yes: [], maybe: [], no: [], none: [], busy: [] };
  const busy = busyOn(d, g.id);
  for (const u of g.members) (busy[u] ? by.busy : by[dayOf(g, u, d)] || by.none).push(u);
  by.busyWhere = busy;
  const n = need(g);
  const status = by.yes.length >= n ? "ok" : by.yes.length + by.maybe.length >= n ? "maybe" : "no";
  const counted = status === "ok" ? by.yes : [...by.yes, ...by.maybe];
  const pref = counted.length ? counted.reduce((a, u) => a + prefOf(g, u), 0) / counted.length : 0;
  return { g, n, ...by, status, pref, counted };
}

function sessionInfo(g, s) {
  const rs = s.rsvps || {};
  const yes = g.members.filter(u => rs[u] === "yes"), no = g.members.filter(u => rs[u] === "no"), pending = g.members.filter(u => !rs[u]);
  const n = need(g);
  return { yes, no, pending, n, go: yes.length >= n, missing: Math.max(0, n - yes.length) };
}

function allSessions() {
  const out = [];
  for (const g of groupList()) for (const [sid, s] of Object.entries(g.sessions || {})) out.push({ g, sid, s });
  return out.sort((a, b) => (a.s.date + (a.s.time || "")).localeCompare(b.s.date + (b.s.time || "")));
}

function notifications() {
  const seen = S.me.seenAt || 0, today = todayStr();
  return allSessions().filter(x => x.s.confirmedAt && x.s.confirmedBy !== S.me.uid && x.s.date >= today)
    .map(x => ({ ...x, unread: x.s.confirmedAt > seen }))
    .sort((a, b) => b.s.confirmedAt - a.s.confirmedAt);
}
const sessionText = (g, s) => `Confermato! ${fmtDate(s.date)} alle ${s.time || DEFAULT_TIME} si gioca a ${g.game} (gruppo ${g.name})${s.location ? ", " + s.location : ""}.${s.notes ? " " + s.notes : ""} Conferma la tua presenza su Game Planner: ${location.origin + location.pathname}`;

// Notifiche del browser per le nuove serate confermate (mentre l'app è aperta)
let notifiedKeys = null;
function browserNotify() {
  if (!S.me) return;
  const keys = notifications().filter(n => n.unread).map(n => n.g.id + n.sid);
  if (notifiedKeys === null) { notifiedKeys = new Set(keys); return; }
  for (const n of notifications()) {
    const k = n.g.id + n.sid;
    if (!n.unread || notifiedKeys.has(k)) continue;
    notifiedKeys.add(k);
    try { if ("Notification" in window && Notification.permission === "granted") new Notification("Game Planner - si gioca!", { body: `${fmtShort(n.s.date)} alle ${n.s.time || DEFAULT_TIME}: ${n.g.game} con ${n.g.name}` }); } catch (e) {}
  }
}

function inviteLink(g) {
  const base = location.origin + location.pathname;
  return `${base}#join=${g.id}.${g.inviteCode}&n=${encodeURIComponent(g.name)}`;
}
const inviteText = g => `Ciao! Ti invito nel gruppo "${g.name}" (${g.game}) su Game Planner, così vediamo insieme quando possiamo giocare. Entra da qui: ${inviteLink(g)}`;

function sessionTimes(s) {
  const [hh, mm] = (s.time || DEFAULT_TIME).split(":").map(Number);
  const start = parseYmd(s.date); start.setHours(hh, mm, 0, 0);
  const end = new Date(start.getTime() + SESSION_HOURS * 3600e3);
  const f = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  return { start: f(start), end: f(end) };
}
function sessionDetails(g, s) {
  const i = sessionInfo(g, s);
  const lines = [`Si gioca a ${g.game} con il gruppo ${g.name}!`];
  if (i.yes.length) lines.push("Confermati: " + byName(g, i.yes).map(u => nameIn(g, u)).join(", "));
  if (s.notes) lines.push(s.notes);
  return lines.join("\n");
}
function downloadIcs(g, sid, s) {
  const t = sessionTimes(s);
  const e = x => String(x || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Game Planner//IT", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
    "BEGIN:VEVENT", `UID:${g.id}-${sid}@gameplanner`, `DTSTAMP:${stamp}`, `DTSTART:${t.start}`, `DTEND:${t.end}`,
    `SUMMARY:${e(g.game + " - " + g.name)}`, `LOCATION:${e(s.location)}`, `DESCRIPTION:${e(sessionDetails(g, s))}`,
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${e("Domani si gioca a " + g.game)}`, "TRIGGER:-P1D", "END:VALARM",
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${e("Tra 2 ore si gioca a " + g.game)}`, "TRIGGER:-PT2H", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR",
  ].join("\r\n");
  const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = `${g.game.replace(/[^\w]+/g, "-").toLowerCase()}-${s.date}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function gcalLink(g, s) {
  const t = sessionTimes(s);
  const p = new URLSearchParams({ action: "TEMPLATE", text: `${g.game} - ${g.name}`, dates: `${t.start}/${t.end}`, details: sessionDetails(g, s), location: s.location || "" });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

}

      return `<div class="card click gcard" data-action="openGroup" data-g="${g.id}">
        <div class="body">
          <div class="row nowrap" style="align-items:flex-start;gap:12px">
            ${gIcon(g)}
            <div class="grow"><div class="row between nowrap" style="align-items:flex-start"><div class="t-lg ell">${esc(g.name)}</div>${kindPill(g)}</div>
            <div class="small muted" style="font-weight:600">${g.members.length} ${g.members.length === 1 ? "membro" : "membri"}</div></div>
          </div>
          <div class="inset" style="margin:12px 0">${ic("groups", "s18")}<span class="ell">${esc(g.game)} &bull; ${ruleText(g)}</span></div>
          <div class="chips">${mem.map(u => admins.includes(u) ? `<span class="chip admin">${ic("verified_user", "s14")} ${esc(nameIn(g, u))} (admin)</span>` : `<span class="chip">${esc(nameIn(g, u))}</span>`).join("")}</div>
        </div>
        <div class="foot small">
          <div><strong>La tua voglia:</strong> <span class="voglia">${prefLabel(prefOf(g, S.me.uid))}</span></div>
          <div style="margin-top:4px;font-weight:600;color:${next ? "var(--primary-dark)" : "var(--muted)"}">${next ? `${ic("event", "s16")} Prossima serata: ${fmtTiny(next.date)}` : `${ic("hourglass_empty", "s16")} Nessuna data fissata`}</div>
        </div>
      </div>`;
    }).join("");
}

function renderGroup(g) {
  const me = S.me.uid, today = todayStr();
  const mine = prefOf(g, me);
  const futureMarked = u => Object.entries(u === me ? (S.me.days || {}) : (g.avail?.[u] || {})).filter(([d]) => d >= today).length;
  const link = inviteLink(g);
  const sessions = Object.entries(g.sessions || {}).filter(([, s]) => s.date >= today).sort((a, b) => a[1].date.localeCompare(b[1].date));
  const admin = isAdmin(g);
  return `
    <button class="textlink" style="padding:0 0 10px" data-action="closeGroup">${ic("arrow_back", "s18")} I miei gruppi</button>
    <div class="card">
      <div class="row nowrap" style="align-items:flex-start;gap:12px">
        ${gIcon(g)}
        <div class="grow"><div class="row between nowrap" style="align-items:flex-start"><h1 class="page-title" style="font-size:24px">${esc(g.name)}</h1>${admin ? `<button class="btn sm" data-action="editGroup">${ic("edit", "s16")} Modifica</button>` : ""}</div>
          <div class="row" style="margin-top:4px">${kindPill(g)}<span class="small muted" style="font-weight:600">${esc(g.game)}</span></div></div>
      </div>
      <div class="inset" style="margin-top:12px">${ic("rule", "s18")} ${ruleText(g)}</div>
      <div class="info" style="margin-top:10px">${ic(admin ? "verified_user" : "shield")}<span>${admin ? "Sei admin: inviti, gestisci i giocatori e confermi le serate." : `Admin: <strong>${esc(byName(g, adminsOf(g).filter(u => g.members.includes(u))).map(u => nameIn(g, u)).join(", ") || "nessuno")}</strong>. Sono loro a confermare le serate.`}</span></div>
    </div>

    <div class="card">
      <div class="t-md">La tua voglia di giocare con questo gruppo</div>
      <p class="small muted" style="margin:4px 0 12px">Serve a scegliere quale gruppo consigliare quando la stessa sera si potrebbe giocare a più giochi.</p>
      <div class="seg">${[3, 2, 1].map(v => `<button class="${mine === v ? "on" : ""}" data-action="setPref" data-v="${v}">${ic(PREF_ICON[v], "s16")} ${PREFS[v]}</button>`).join("")}</div>
    </div>

    <div class="card">
      <div class="row between"><div class="t-lg">Membri</div><span class="ctr">${g.members.length}</span></div>
      ${byName(g, g.members).map(u => {
        const n = futureMarked(u), uAdmin = isAdmin(g, u);
        return `<div class="mrow">
          <div class="mav ${uAdmin ? "admin" : ""}">${initial(nameIn(g, u))}</div>
          <div class="grow">
            <div class="row" style="gap:6px"><strong>${esc(nameIn(g, u))}</strong>${u === me ? `<span class="small muted">(tu)</span>` : ""}${uAdmin ? `<span class="chip admin" style="padding:1px 8px;font-size:12px">${ic("verified_user", "s14")} Admin</span>` : ""}</div>
            <div class="xs muted" style="font-weight:600">${n ? `${ic("event_available", "s14")} ${n} giorni segnati da oggi in poi` : `${ic("event_busy", "s14")} Non ha ancora segnato le disponibilità`}</div>
            <div class="xs voglia" style="margin-top:2px">${prefLabel(prefOf(g, u))}</div>
            ${admin && u !== me ? `<div class="row" style="margin-top:8px;gap:6px">
              <button class="btn sm" data-action="toggleAdmin" data-u="${u}">${ic(uAdmin ? "remove_moderator" : "add_moderator", "s16")} ${uAdmin ? "Togli admin" : "Rendi admin"}</button>
              <button class="btn sm danger" data-action="removeMember" data-u="${u}">${ic("person_remove", "s16")} Rimuovi</button></div>` : ""}
          </div>
        </div>`;
      }).join("")}
    </div>

    ${admin ? `<div class="card stack">
      <div class="row nowrap" style="gap:10px"><div class="gico c0" style="width:40px;height:40px">${ic("person_add")}</div><div><div class="t-lg">Invita qualcuno</div><div class="small muted">Chi riceve il link entra nel gruppo dopo aver fatto l'accesso.</div></div></div>
      <div class="linkbox">${esc(link)}</div>
      <div class="row"><button class="btn sm" data-action="copyLink">${ic("content_copy", "s16")} Copia link</button>${navigator.share ? `<button class="btn sm" data-action="shareLink">${ic("share", "s16")} Condividi...</button>` : ""}</div>
      <div><label class="f" for="invEmail">Via email</label>
        <div class="row nowrap"><div class="field grow">${ic("mail", "lead")}<input id="invEmail" data-keep type="email" placeholder="nome@esempio.it"></div><button class="btn primary" data-action="inviteEmail">Invia</button></div></div>
      <div><label class="f" for="invPhone">Via cellulare</label>
        <div class="field">${ic("smartphone", "lead")}<input id="invPhone" data-keep type="tel" placeholder="+39 333 1234567"></div>
        <div class="row nowrap" style="margin-top:8px"><button class="btn grow" data-action="inviteSms">${ic("sms", "s18")} SMS</button><button class="btn grow" data-action="inviteWa">${ic("chat", "s18")} WhatsApp</button></div></div>
      <p class="xs muted" style="margin:0">Funziona anche con chi non ha ancora l'app: dal link si registra e entra direttamente nel gruppo.</p>
    </div>` : `<div class="info" style="margin-bottom:14px">${ic("info")}<span>Per invitare qualcuno chiedi a un admin del gruppo.</span></div>`}

    <div class="section"><h3>${ic("event_available")} Serate confermate</h3>${sessions.length ? `<span class="pill go">${sessions.length}</span>` : ""}</div>
    ${sessions.length ? sessions.map(([sid, s]) => renderSessionCard(g, sid, s, false)).join("") : `<p class="muted small">Nessuna serata in programma. Guarda le <a href="#" data-action="tab" data-tab="nights">Serate</a> possibili.</p>`}

    <div class="row" style="margin-top:20px;justify-content:center">
      <button class="btn sm danger" data-action="leaveGroup">${ic("logout", "s16")} Esci dal gruppo</button>
      ${admin ? `<button class="btn sm danger-soft" data-action="deleteGroup">${ic("delete", "s16")} Elimina gruppo</button>` : ""}
    </div>`;
}

// ----- PAGINA DISPONIBILITÀ -----
function monthSelect(id, value) {
  return `<select id="${id}" data-action-change="${id}">${monthOptions().map(m => `<option value="${m}" ${m === value ? "selected" : ""}>${monthLabel(m)}</option>`).join("")}</select>`;
}

function renderAvail() {
  const opts = monthOptions();
  if (!opts.includes(S.month)) S.month = opts[0];
  const [y, m1] = S.month.split("-").map(Number), m = m1 - 1;
  const mine = S.me.days || {};
  const offset = (new Date(y, m, 1).getDay() + 6) % 7;
  const dim = new Date(y, m + 1, 0).getDate();
  const today = todayStr();
  let cells = "", future = 0; const cnt = { yes: 0, maybe: 0, no: 0 };
  for (let i = 0; i < offset; i++) cells += `<div class="day out"></div>`;
  for (let d = 1; d <= dim; d++) {
    const k = `${y}-${pad(m + 1)}-${pad(d)}`, st = mine[k] || "";
    const w = new Date(y, m, d).getDay(), we = w === 0 || w === 6;
    if (k >= today) { future++; if (st) cnt[st]++; }
    const lab = st === "yes" ? "SÌ" : st === "maybe" ? "FORSE" : st === "no" ? "NO" : "";
    if (k < today) cells += `<button class="day" disabled aria-label="${k}"><span class="n">${d}</span><span class="past">Passato</span></button>`;
    else cells += `<button class="day ${we ? "we" : ""} ${k === today ? "today" : ""}" data-action="day" data-date="${k}" aria-label="${k}"><span class="n">${d}</span>${k === today ? `<span class="oggi">OGGI</span>` : ""}${lab ? `<span class="st ${st}">${lab}</span>` : "<span></span>"}</button>`;
  }
  const marked = cnt.yes + cnt.maybe + cnt.no, pct = future ? Math.round(marked / future * 100) : 0;
  const first = opts[0], last = opts[opts.length - 1];
  const b = (id, icon, label, sub) => `<button class="b-${id} ${S.brush === id ? "on" : ""}" data-action="brush" data-b="${id}"><b>${ic(icon, "s18")} ${label}</b><small>${sub}</small></button>`;
  const groups = groupList();
  return `
    <h1 class="page-title">Le mie disponibilità</h1>
    <p class="page-sub">Valgono per tutti i tuoi gruppi.</p>
    <div class="filtercard stack">
      <div class="calnav">
        <button class="nav" data-action="monthPrev" ${S.month === first ? "disabled" : ""} aria-label="Mese precedente">${ic("chevron_left")}</button>
        ${monthSelect("monthSel", S.month)}
        <button class="nav" data-action="monthNext" ${S.month === last ? "disabled" : ""} aria-label="Mese successivo">${ic("chevron_right")}</button>
        <button class="today-btn" data-action="monthToday">Oggi</button>
      </div>
      <div><div class="label" style="margin-bottom:6px">Seleziona pennello:</div>
      <div class="brushes">${b("yes", "check_circle", "SÌ", "Libero")}${b("maybe", "help", "FORSE", "In dubbio")}${b("no", "cancel", "NO", "Occupato")}${b("clear", "ink_eraser", "Gomma", "Azzera")}</div></div>
    </div>
    <div class="calcard">
      <div class="dow">${DOW.map((d, i) => `<div class="${i > 4 ? "we" : ""}">${d}</div>`).join("")}</div>
      <div class="grid">${cells}</div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="row between"><div class="t-lg">${ic("fact_check")} Riepilogo mese</div><strong style="color:var(--primary-dark)">${pct}%</strong></div>
      <p class="small" style="margin:6px 0 10px">Hai segnato <strong>${marked}</strong> giorni su ${future} da qui a fine mese.</p>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="legend-dots" style="margin-top:12px"><span class="l-yes">${cnt.yes} SÌ</span><span class="l-maybe">${cnt.maybe} FORSE</span><span class="l-no">${cnt.no} NO</span></div>
    </div>
    <div class="label" style="margin:18px 0 8px">Azioni rapide</div>
    <div class="quick">
      <button class="btn" data-action="fillEmpty">${ic("auto_fix_high")} Applica ai vuoti</button>
      <button class="btn" data-action="bulkWeekend">${ic("weekend")} Applica ai weekend</button>
    </div>
    <div style="text-align:center;margin:10px 0"><button class="textlink danger" data-action="clearMonth">${ic("delete_sweep", "s18")} Svuota mese</button></div>
    <div class="card"><div class="row nowrap" style="gap:8px">${ic("touch_app")}<strong>Come funziona</strong></div>
      <p class="small" style="margin:6px 0 0">Scegli <strong>SÌ</strong>, <strong>FORSE</strong> o <strong>NO</strong> e tocca i giorni. Toccando di nuovo un giorno con lo stesso stato lo cancelli.</p></div>
    ${groups.length ? `<div class="banner-act" style="align-items:flex-start"><div class="ico" style="background:#ffdcc2;color:var(--brass-dark)">${ic("groups")}</div>
      <div><div class="t-md">Ricorda</div><p class="small" style="margin:2px 0 0">Le disponibilità sono <strong>uniche</strong> e condivise con tutti i tuoi <strong>${groups.length} ${groups.length === 1 ? "gruppo" : "gruppi"}</strong> (${esc(groups.map(g => g.name).join(", "))}).</p></div></div>`
      : `<div class="banner-act"><div class="ico">${ic("groups")}</div><div class="small"><strong>Ricorda:</strong> per vedere quando si gioca devi far parte di almeno un gruppo. Vai su <a href="#" data-action="tab" data-tab="groups">Gruppi</a>.</div></div>`}`;
}

// ----- PAGINA SERATE -----
function renderNights() {
  const groups = groupList();
  if (!groups.length) return `<h1 class="page-title">Serate</h1><p class="page-sub">Qui vedrai in quali serate si può giocare e con quale gruppo. Prima <a href="#" data-action="tab" data-tab="groups">crea o entra in un gruppo</a>.</p>`;
  const opts = monthOptions();
  if (!opts.includes(S.nMonth)) S.nMonth = opts[0];
  if (S.nGroup !== "all" && !S.groups[S.nGroup]) S.nGroup = "all";
  const shown = S.nGroup === "all" ? groups : groups.filter(g => g.id === S.nGroup);
  const [y, m] = S.nMonth.split("-").map(Number);
  const today = todayStr(), dim = new Date(y, m, 0).getDate();
  const sessKey = new Set(allSessions().map(x => x.g.id + "|" + x.s.date));
  const cards = [];
  for (let d = 1; d <= dim; d++) {
    const k = `${y}-${pad(m)}-${pad(d)}`;
    if (k < today) continue;
    const ev = shown.map(g => evalGroup(g, k));
    const rank = { ok: 0, maybe: 1, no: 2 };
    ev.sort((a, b) => rank[a.status] - rank[b.status] || b.pref - a.pref || b.yes.length - a.yes.length || a.g.name.localeCompare(b.g.name));
    const viable = ev.filter(e => e.status !== "no" && !sessKey.has(e.g.id + "|" + k));
    const list = S.onlyPossible ? viable : ev;
    const best = viable.length >= 2 ? viable[0].g.id : null;
    let overlapNote = "";
    if (viable.length >= 2) {
      const count = {};
      viable.forEach(e => e.counted.forEach(u => { count[u] = (count[u] || 0) + 1; }));
      const shared = Object.keys(count).filter(u => count[u] > 1);
      if (shared.length) {
        const names = shared.map(u => nameIn(viable.find(e => e.counted.includes(u)).g, u)).sort();
        overlapNote = `<div class="warn" style="margin-top:12px">${ic("warning")}<div><div class="ttl">Sovrapposizione rilevata</div>${viable.length} gruppi possibili con persone in comune (<strong>${esc(names.join(", "))}</strong>): si gioca a uno solo. Consigliato <strong>${esc(viable[0].g.name)}</strong>, il gruppo con più voglia di giocare.</div></div>`;
      }
    }
    const confirmedHere = allSessions().filter(x => x.s.date === k && (S.nGroup === "all" || x.g.id === S.nGroup));
    if (S.onlyPossible && !viable.length && !confirmedHere.length) continue;
    const anyOk = viable.some(e => e.status === "ok");
    const top = confirmedHere.length ? `<span class="pill go">${ic("check_circle", "s14")} Confermata</span>` : anyOk ? `<span class="pill ok">${ic("casino", "s14")} Si può giocare</span>` : viable.length ? `<span class="pill orange">Dipende dai forse</span>` : `<span class="pill stop">Nessun gruppo</span>`;
    const dot = confirmedHere.length || anyOk ? "ok" : viable.length ? "maybe" : "";
    cards.push(`<div class="card night">
      <div class="nhead"><span class="ndot ${dot}"></span><div class="ndate">${fmtShort(k)}</div>${top}<button class="btn sm soft" data-action="openNight" data-date="${k}">Apri</button></div>
      ${confirmedHere.map(x => `<div class="gbox confirmed">
          <div class="row nowrap" style="gap:8px">${ic("castle")}<div class="t-md grow ell">${esc(x.g.name)}</div><span class="pill count">${esc(x.g.game)}</span></div>
          <div class="hmeta">${ic("schedule", "s16")} Ore ${esc(x.s.time || DEFAULT_TIME)}${x.s.location ? ` &bull; ${ic("location_on", "s16")} ${esc(x.s.location)}` : ""}</div>
          <div style="text-align:right;margin-top:8px"><button class="btn sm soft" data-action="tab" data-tab="plays">Dettagli ${ic("arrow_forward", "s16")}</button></div>
        </div>`).join("")}
      ${overlapNote}
      ${list.filter(e => !sessKey.has(e.g.id + "|" + k)).map(e => renderGroupRow(e, k, best === e.g.id)).join("")}
    </div>`);
  }
  return `
    <h1 class="page-title">Serate</h1>
    <p class="page-sub">Incrocia le disponibilità di tutti i membri dei tuoi gruppi, sera per sera.</p>
    <div class="filtercard">
      <div class="grid2">
        <div class="selbox"><span class="label">Periodo</span>${monthSelect("nMonthSel", S.nMonth)}</div>
        <div class="selbox"><span class="label">Gruppo</span><select id="nGroupSel" data-action-change="nGroupSel"><option value="all">Tutti (${groups.length})</option>${groups.map(g => `<option value="${g.id}" ${S.nGroup === g.id ? "selected" : ""}>${esc(g.name)}</option>`).join("")}</select></div>
      </div>
      <div class="row between nowrap" style="margin-top:12px"><span class="small" style="font-weight:600">${ic("verified", "s18")} Solo le serate possibili</span><button class="switch ${S.onlyPossible ? "on" : ""}" role="switch" aria-checked="${S.onlyPossible}" data-action="toggleOnly" aria-label="Solo le serate possibili"></button></div>
    </div>
    ${cards.length ? cards.join("") : `<div class="card" style="text-align:center"><div class="gico c3" style="margin:0 auto 10px">${ic("event_busy")}</div><p class="small muted" style="margin:0">Nessuna serata possibile in ${monthLabel(S.nMonth).toLowerCase()}. Servono le disponibilità di tutti: controlla in ogni gruppo chi non ha ancora segnato i suoi giorni, oppure prova un altro mese.</p></div>`}
    ${cards.length ? `<div class="footer-note">${ic("casino", "s16")} IL DESTINO DEL TAVOLO È NELLE VOSTRE MANI</div>` : ""}`;
}

function renderGroupRow(e, k, recommended) {
  const g = e.g;
  const admin = isAdmin(g);
  const chip = (u, cls) => {
    const n = esc(nameIn(g, u));
    if (cls === "yes") return `<span class="chip yes">${ic("check", "s14")} ${n} (SÌ)</span>`;
    if (cls === "maybe") return `<span class="chip maybe">${ic("help", "s14")} ${n} (FORSE)</span>`;
    if (cls === "busy") return `<span class="chip busy">${ic("block", "s14")} ${n} (occupato: ${esc(e.busyWhere[u])})</span>`;
    if (cls === "no") return `<span class="chip no">${ic("close", "s14")} ${n} (NO)</span>`;
    return `<span class="chip none">${n} (?)</span>`;
  };
  return `<div class="gbox ${e.status === "no" ? "dim" : ""}">
    <div class="row between" style="align-items:flex-start"><div class="row" style="gap:8px"><span class="t-lg">${esc(g.name)}</span>${recommended ? `<span class="pill star">${ic("star", "s14 fill")} Consigliato</span>` : ""}</div></div>
    <div style="margin:6px 0">${statusPill(e.status)}</div>
    <div class="row between small" style="margin:8px 0;color:var(--muted)"><span>${esc(g.game)}</span><span>Servono ${e.n} su ${g.members.length}</span></div>
    <div class="chips">${byName(g, e.yes).map(u => chip(u, "yes")).join("")}${byName(g, e.maybe).map(u => chip(u, "maybe")).join("")}${byName(g, e.busy).map(u => chip(u, "busy")).join("")}${byName(g, e.no).map(u => chip(u, "no")).join("")}${byName(g, e.none).map(u => chip(u, "none")).join("")}</div>
    ${e.status !== "no" ? `<div class="row between" style="margin-top:12px"><span class="vm">Voglia media: <b>${e.pref.toFixed(1).replace(".", ",")} / 3</b></span>${admin ? "" : `<span class="decide">${ic("shield", "s16")} Decide un admin</span>`}</div>
      ${admin ? `<button class="btn primary lg full" style="margin-top:12px" data-action="propose" data-g="${g.id}" data-date="${k}">${ic("event_available")} Conferma questa serata</button>` : ""}` : ""}
  </div>`;
}

// ----- PAGINA GIOCATE -----
function renderSessionCard(g, sid, s, past) {
  const i = sessionInfo(g, s);
  const my = (s.rsvps || {})[S.me.uid];
  const pres = i.pending.length ? `Presenze: ${i.yes.length} sì, ${i.pending.length} da confermare${i.no.length ? `, ${i.no.length} non vengono` : ""}.` : i.no.length ? `${i.no.length} non vengono.` : "Hanno confermato tutti.";
  const adminTag = isAdmin(g, s.confirmedBy || s.createdBy) ? " (admin)" : "";
  return `<div class="card flush">
    <div class="sess-head">
      <div class="row between nowrap" style="align-items:flex-start"><div class="grow" style="min-width:0"><div class="label">Gruppo "${esc(g.name)}"</div><div class="ttl">${esc(g.game)}</div></div>${past ? "" : `<span class="pill">${ic("check_circle", "s14")} Confermata</span>`}</div>
      ${past ? "" : `<div class="meta">${ic("verified_user", "s16")}<span>Confermata da ${esc(nameIn(g, s.confirmedBy || s.createdBy))}${adminTag}. ${pres}</span></div>`}
    </div>
    <div class="sess-body stack">
      <div class="datebox">
        <div>${ic("event")}<strong>${fmtDate(s.date)} alle ${esc(s.time || DEFAULT_TIME)}</strong></div>
        ${s.location ? `<div>${ic("location_on")}<span>${esc(s.location)}</span></div>` : ""}
      </div>
      ${s.notes ? `<div class="noteblk"><div class="label">${ic("sticky_note_2", "s16")} Note di serata</div><div style="margin-top:4px">"${esc(s.notes)}"</div></div>` : ""}
      <div><div class="label" style="margin-bottom:6px">Stato partecipanti</div>
        <div class="chips">
          ${byName(g, i.yes).map(u => `<span class="chip yes">${esc(nameIn(g, u))}${u === S.me.uid ? " (tu)" : ""} ${ic("check", "s14")}</span>`).join("")}
          ${byName(g, i.pending).map(u => `<span class="chip maybe">${esc(nameIn(g, u))} - in attesa ${ic("hourglass_empty", "s14")}</span>`).join("")}
          ${byName(g, i.no).map(u => `<span class="chip no">${esc(nameIn(g, u))} - non viene</span>`).join("")}
        </div></div>
      ${past ? "" : `
      <div class="row nowrap" style="background:var(--surface-2);border-radius:12px;padding:6px 6px 6px 12px"><span class="small" style="font-weight:600;white-space:nowrap">La tua risposta:</span>
        <div class="seg grow" style="background:transparent">
          <button class="${my === "yes" ? "on" : ""}" data-action="rsvp" data-g="${g.id}" data-s="${sid}" data-v="yes">${ic("check", "s16")} Ci sono</button>
          <button class="${my === "no" ? "on no" : ""}" data-action="rsvp" data-g="${g.id}" data-s="${sid}" data-v="no">${ic("close", "s16")} Non posso</button>
        </div></div>
      <div class="row nowrap">
        <button class="btn grow soft" style="white-space:nowrap;padding:0 10px" data-action="ics" data-g="${g.id}" data-s="${sid}">${ic("calendar_add_on", "s18")} Aggiungi (.ics)</button>
        <a class="btn grow soft" style="white-space:nowrap;padding:0 10px" href="${esc(gcalLink(g, s))}" target="_blank" rel="noopener">${ic("edit_calendar", "s18")} G-Calendar</a>
      </div>
      ${isAdmin(g) ? `<div class="row nowrap">
        <button class="btn brass grow" data-action="notifyAll" data-g="${g.id}" data-s="${sid}">${ic("campaign", "s18")} Avvisa tutti</button>
        <button class="btn danger-soft" data-action="deleteSession" data-g="${g.id}" data-s="${sid}">Annulla</button></div>` : ""}`}

}

function renderPlays() {
  const today = todayStr(), me = S.me.uid, all = allSessions();
  const mineIn = x => (x.s.rsvps || {})[me] !== "no";
  const up = all.filter(x => x.s.date >= today);
  const played = all.filter(x => x.s.date < today && mineIn(x)).reverse();
  const games = [...new Set(played.map(x => x.g.game))].sort((a, b) => a.localeCompare(b));
  const perGame = {};
  played.forEach(x => { perGame[x.g.game] = (perGame[x.g.game] || 0) + 1; });
  const topGame = Object.entries(perGame).sort((a, b) => b[1] - a[1])[0];
  const next = up.find(mineIn);
  const canConfirm = groupList().some(g => isAdmin(g));
  const perm = "Notification" in window ? Notification.permission : "unsupported";

  const years = [...new Set(played.map(x => x.s.date.slice(0, 4)))].sort().reverse();
  const groupsP = [...new Map(played.map(x => [x.g.id, x.g.name])).entries()].sort((a, b) => a[1].localeCompare(b[1]));
  if (S.hGame !== "all" && !games.includes(S.hGame)) S.hGame = "all";
  if (S.hYear !== "all" && !years.includes(S.hYear)) S.hYear = "all";
  if (S.hGroup !== "all" && !groupsP.some(([id]) => id === S.hGroup)) S.hGroup = "all";
  const list = played.filter(x => (S.hGame === "all" || x.g.game === S.hGame) && (S.hYear === "all" || x.s.date.startsWith(S.hYear))
    && (S.hMonth === "all" || x.s.date.slice(5, 7) === S.hMonth) && (S.hGroup === "all" || x.g.id === S.hGroup));
  const filtered = S.hGame !== "all" || S.hYear !== "all" || S.hMonth !== "all" || S.hGroup !== "all";
  const limit = S.hLimit || 10;
  const shownList = list.slice(0, limit);
  const months = {};
  shownList.forEach(x => { (months[x.s.date.slice(0, 7)] ||= []).push(x); });
  const monthCount = {};
  list.forEach(x => { const k = x.s.date.slice(0, 7); monthCount[k] = (monthCount[k] || 0) + 1; });
  const sel = (id, label, opts) => `<div><div class="label" style="margin-bottom:4px">${label}</div><select id="${id}" data-action-change="${id}" style="background-color:var(--surface)">${opts}</select></div>`;
  const opt = (v, t, cur) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(t)}</option>`;
  const present = x => byName(x.g, x.g.members.filter(u => (x.s.rsvps || {})[u] === "yes"));
  const firstDate = played.length ? played[played.length - 1].s.date : null;

  return `
    <div class="row between nowrap" style="align-items:flex-start;margin-bottom:12px">
      <div><h1 class="page-title">Le mie giocate</h1><div class="small muted">Archivio e prossimi appuntamenti al tavolo</div></div>
      ${canConfirm ? `<button class="btn sm primary" data-action="newSession">${ic("event_available", "s16")} Conferma</button>` : ""}
    </div>
    ${perm === "default" ? `<div class="banner-act"><div class="ico">${ic("notifications_active")}</div><div class="grow small"><strong>Notifiche serate</strong><div class="muted xs">Avviso immediato quando un admin conferma una serata.</div></div><button class="btn sm primary" data-action="enableNotif">Attiva avvisi</button></div>` : ""}
    <div class="card">
      <div class="next"><div class="ico">${ic("rocket_launch")}</div>
        <div class="grow" style="min-width:0">${next ? `<div class="label" style="color:var(--brass-dark)">Prossima giocata</div><div class="t-lg">${fmtShort(next.s.date)} alle ${esc(next.s.time || DEFAULT_TIME)}</div><div class="small ell"><strong>${esc(next.g.game)}</strong> con gruppo <em>${esc(next.g.name)}</em></div>` : `<div class="label">Prossima giocata</div><div class="small muted">Nessuna giocata in programma.</div>`}</div></div>
      <div class="stat">
        <div><strong class="c1">${up.filter(mineIn).length}</strong><span>In programma</span></div>
        <div><strong class="c2">${played.length}</strong><span>Giocate totali</span></div>
        <div><strong class="c3">${games.length}</strong><span>Giochi provati</span></div>
      </div>
      ${games.length ? `<div class="hscroll"><button class="chip ${S.hGame === "all" ? "sel" : ""}" data-action="filterPlayed" data-game="all">Tutti</button>${Object.entries(perGame).sort((a, b) => b[1] - a[1]).map(([gm, n]) => `<button class="chip ${S.hGame === gm ? "sel" : ""}" data-action="filterPlayed" data-game="${esc(gm)}">${esc(gm)} <span class="n">${n}</span></button>`).join("")}</div>` : ""}
      ${topGame ? `<div class="insight">${ic("auto_awesome")}<span>Il gioco a cui hai giocato di più è <strong>${esc(topGame[0])}</strong>; la prima giocata registrata è del ${fmtDate(firstDate).replace(/^\S+ /, "")}.</span></div>` : ""}
    </div>

    <div class="section"><h3>${ic("event_upcoming")} In programma</h3>${up.length ? `<span class="pill ok">${up.length} ${up.length === 1 ? "CONFERMATA" : "CONFERMATE"}</span>` : ""}</div>
    ${up.length ? up.map(x => renderSessionCard(x.g, x.sid, x.s, false)).join("") : `<p class="muted small">Nessuna serata confermata. Guarda le <a href="#" data-action="tab" data-tab="nights">Serate</a> possibili.</p>`}

    <div class="section" style="margin-bottom:2px"><h3>${ic("inventory_2")} Storico delle giocate</h3></div>
    ${played.length ? `
    <div class="small" style="font-weight:700;margin-bottom:10px">${list.length} ${list.length === 1 ? "giocata trovata" : "giocate trovate"}${filtered ? "" : " in totale"}${filtered ? ` &bull; <button class="textlink" style="padding:0" data-action="resetPlayed">Togli i filtri</button>` : ""}</div>
    <div class="filtercard"><div class="grid2">
      ${sel("hGame", "Gioco", opt("all", "Tutti", S.hGame) + games.map(g => opt(g, g, S.hGame)).join(""))}
      ${sel("hGroup", "Gruppo", opt("all", "Tutti", S.hGroup) + groupsP.map(([id, n]) => opt(id, n, S.hGroup)).join(""))}
      ${sel("hYear", "Anno", opt("all", "Tutti", S.hYear) + years.map(y => opt(y, y, S.hYear)).join(""))}
      ${sel("hMonth", "Mese", opt("all", "Tutti", S.hMonth) + MONTHS.map((m, i) => opt(pad(i + 1), m, S.hMonth)).join(""))}
    </div></div>
    ${shownList.length ? Object.entries(months).map(([ym, xs]) => `<div class="monthbar"><strong>${monthLabel(ym)}</strong><span class="pill count">${monthCount[ym]} ${monthCount[ym] === 1 ? "giocata" : "giocate"}</span></div>
      ${xs.map(x => `<div class="card hcard">
        <div class="row between nowrap" style="align-items:flex-start"><div class="grow" style="min-width:0">
          <div class="row" style="gap:6px">${kindPill(x.g)}<span class="xs muted" style="font-weight:600">Gruppo ${esc(x.g.name)}</span></div>
          <div class="t-lg" style="font-size:20px;margin-top:4px">${esc(x.g.game)}</div></div>${gIcon(x.g).replace('class="gico', 'style="width:36px;height:36px" class="gico')}</div>
        <div class="hmeta">${ic("schedule", "s16")} ${fmtDate(x.s.date)} &bull; ore ${esc(x.s.time || DEFAULT_TIME)}</div>
        ${x.s.location ? `<div class="hmeta">${ic("home", "s16")} ${esc(x.s.location)}</div>` : ""}
        ${x.s.notes ? `<div class="small" style="margin-top:6px">"${esc(x.s.notes)}"</div>` : ""}
        <div class="withrow"><span>${ic("group", "s16")} Con: ${esc(present(x).filter(u => u !== me).map(u => nameIn(x.g, u)).join(", ") || "nessun altro")}</span><span class="pill fatta">FATTA</span></div>
      </div>`).join("")}`).join("")
      + (list.length > shownList.length ? `<button class="btn full soft" data-action="morePlayed">Mostra altre giocate precedenti (${list.length - shownList.length}) ${ic("expand_more", "s18")}</button>` : "")
      : `<p class="muted small">Nessuna giocata con questi filtri.</p>`}` : `<p class="muted small">Le serate giocate compariranno qui, con data, gioco, gruppo e chi c'era.</p>`}`;
}

    const emails = others.map(u => g.emails?.[u]).filter(Boolean);

      <div class="noteblk">${esc(sessionText(g, s))}</div>
      <div class="stack" style="margin-top:14px">
        <a class="btn full primary" href="https://wa.me/?text=${encodeURIComponent(sessionText(g, s))}" target="_blank" rel="noopener">${ic("chat")} Invia su WhatsApp</a>
        ${emails.length ? `<a class="btn full" href="mailto:?bcc=${encodeURIComponent(emails.join(","))}&subject=${encodeURIComponent(`Game Planner - si gioca: ${g.game} ${fmtShort(s.date)}`)}&body=${encodeURIComponent(sessionText(g, s))}">${ic("mail")} Invia per email a ${emails.length} ${emails.length === 1 ? "persona" : "persone"}</a>` : ""}
        <button class="btn full" data-action="copyText" data-text="${esc(sessionText(g, s))}">${ic("content_copy")} Copia il messaggio</button>
        <button class="btn full ghost" data-action="closeModal">Fatto</button>
      </div>`;
  } else if (M.type === "session") {
    const groups = groupList().filter(g => isAdmin(g));
    inner = `<h2>Conferma la serata</h2>
      <p class="small muted" style="margin:0 0 12px">Tutti i membri del gruppo riceveranno l'avviso.</p>

        <div><label class="f" for="sGroup">Gruppo</label><select id="sGroup" data-keep>${groups.map(g => `<option value="${g.id}" ${g.id === M.gid ? "selected" : ""}>${esc(g.name)} - ${esc(g.game)}</option>`).join("")}</select></div>
        <div class="row nowrap">
          <div style="flex:1.4"><label class="f" for="sDate">Giorno</label><input id="sDate" data-keep type="date" min="${todayStr()}" max="${LAST_DAY}" value="${esc(M.date || "")}"></div>

        <div class="err" id="sErr"></div>

      ${actions(`<button class="btn grow" data-action="closeModal">Annulla</button>`, `<button class="btn primary grow" data-action="saveSession">${ic("event_available")} Conferma</button>`)}`;
  }
  return `<div class="overlay" data-action="overlay"><div class="sheet">${inner}</div></div>`;
}

let toastTimer;
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2800);
}
